<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The 5am Club</title>
<meta name="description" content="Daily, weekly, monthly and annual task system.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="5am Club">
<meta name="theme-color" content="#7a2fb0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237a2fb0'/%3E%3Ctext x='32' y='43' font-family='-apple-system,sans-serif' font-size='26' font-weight='700' fill='%23fff' text-anchor='middle'%3E5a%3C/text%3E%3C/svg%3E">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;1,400&display=swap');
  :root { color-scheme: light;
    --bg:#f9f5f9; --card:#ffffff; --ink:#2a2430; --muted:#8b8393;
    --accent:#7a2fb0; --accent-2:#1fbdd4; --accent-soft:#f3e9fb; --line:#ece4f0;
    --gold:#b8860b; --gold-soft:#fdf3d9;
    --pop:#ff8c42;
    --shadow:0 1px 2px rgba(42,36,48,.05), 0 6px 20px -8px rgba(122,47,176,.18);
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); max-width:640px; margin:0 auto;
    padding:20px 16px calc(28px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased; }
  #confetti { position:fixed; inset:0; width:100%; height:100%;
    pointer-events:none; z-index:9999; }

  /* ---------- header ---------- */
  .hero { background:linear-gradient(135deg,#6d2fb8 0%,#a32f9e 52%,#e0457b 100%);
    border-radius:20px; padding:18px 18px 16px; color:#fff; box-shadow:var(--shadow);
    position:relative; overflow:hidden; }
  .hero::after { content:""; position:absolute; right:-46px; top:-56px; width:180px; height:180px;
    border-radius:50%; background:rgba(255,255,255,.06); }
  .hero h1 { font-size:1.4rem; font-weight:800; letter-spacing:-0.02em; }
  .hero .sub { font-size:0.78rem; opacity:.78; margin-top:3px; }
  .ringwrap { display:flex; align-items:center; gap:14px; margin-top:14px; position:relative; z-index:1; }
  .ring { position:relative; width:62px; height:62px; flex:none; }
  .ring svg { transform:rotate(-90deg); }
  .ring .trk { stroke:rgba(255,255,255,.2); }
  .ring .val { stroke:var(--pop); stroke-linecap:round;
    transition:stroke-dashoffset .5s cubic-bezier(.4,0,.2,1); }
  .ring .num { position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; font-size:0.82rem; font-weight:800; }
  .ringtxt .big { font-size:0.92rem; font-weight:700; }
  .ringtxt .small { font-size:0.74rem; opacity:.75; margin-top:2px; }
  .kcount { display:inline-block; margin-top:10px; font-size:0.68rem; font-weight:600;
    background:rgba(255,255,255,.14); padding:4px 11px; border-radius:20px; }

  /* ---------- tabs ---------- */
  .tabs { display:flex; gap:4px; margin:16px 0 12px; background:#eee5f2;
    padding:4px; border-radius:12px; }
  .tabs button { flex:1; padding:9px 2px; border:none; border-radius:9px;
    background:none; font-size:0.76rem; font-weight:700; color:var(--muted);
    cursor:pointer; transition:all .18s; }
  .tabs button.on { background:#fff; color:var(--accent); box-shadow:0 1px 3px rgba(0,0,0,.07); }

  .toggle { display:flex; gap:6px; margin:0 0 12px; }
  .toggle button { flex:1; padding:9px 4px; border:1px solid var(--line); background:var(--card);
    border-radius:11px; font-size:0.78rem; font-weight:600; color:var(--muted);
    cursor:pointer; transition:all .18s; }
  .toggle button.on { background:var(--accent); border-color:var(--accent); color:#fff; }

  /* ---------- day strip ---------- */
  .days { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:16px; }
  .days button { padding:9px 0 7px; border:1px solid var(--line); background:var(--card);
    border-radius:12px; cursor:pointer; text-align:center; transition:all .18s; }
  .days button .d { display:block; font-size:0.72rem; font-weight:700; }
  .days button.sel { border-color:var(--accent); background:var(--accent-soft);
    transform:translateY(-1px); box-shadow:var(--shadow); }
  .days button.today .d::after { content:""; display:block; width:4px; height:4px;
    border-radius:50%; background:var(--gold); margin:3px auto 0; }
  .days button.full { background:var(--accent); border-color:var(--accent); }
  .days button.full .d { color:#fff; }
  .mini { display:block; height:3px; border-radius:2px; background:var(--line);
    margin:5px 7px 0; overflow:hidden; }
  .mini i { display:block; height:100%; background:var(--accent-2);
    width:0; transition:width .4s; }
  .days button.full .mini { background:rgba(255,255,255,.3); }
  .days button.full .mini i { background:var(--pop); }

  /* ---------- buckets ---------- */
  .bucket { background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:6px 15px 4px; margin-bottom:11px; box-shadow:var(--shadow); }
  .bucket h2 { font-size:0.68rem; text-transform:uppercase; letter-spacing:0.09em;
    color:var(--muted); padding:12px 0 8px; display:flex; justify-content:space-between;
    align-items:center; }
  .bucket h2 .time { font-weight:500; text-transform:none; letter-spacing:0; opacity:.85; }
  .bucket h2 .nm { -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent; }
  .b-morning h2 .nm { background-image:linear-gradient(90deg,#22c9d8,#2f9fd0); }
  .b-work    h2 .nm { background-image:linear-gradient(90deg,#2f9fd0,#6b6ec9); }
  .b-zone    h2 .nm { background-image:linear-gradient(90deg,#12b3c4,#3f93cf); }
  .b-home    h2 .nm { background-image:linear-gradient(90deg,#7c5cc4,#a544b0); }
  .b-evening h2 .nm { background-image:linear-gradient(90deg,#a544b0,#e0457b); }
  .row { border-top:1px solid var(--line); }
  .row:first-of-type { border-top:none; }
  label.item { display:flex; align-items:flex-start; gap:11px; padding:10px 2px;
    cursor:pointer; font-size:0.89rem; line-height:1.38; }
  label.item input { appearance:none; -webkit-appearance:none; flex:none; width:21px; height:21px;
    border:2px solid #c9bed3; border-radius:7px; margin-top:1px; cursor:pointer;
    position:relative; transition:all .18s; }
  label.item input:active { transform:scale(.88); }
  label.item input:checked { background:var(--accent); border-color:var(--accent); }
  label.item input:checked::after { content:""; position:absolute; left:6px; top:2px; width:5px;
    height:10px; border:solid #fff; border-width:0 2.5px 2.5px 0; transform:rotate(45deg);
    animation:pop .28s cubic-bezier(.2,1.4,.5,1); }
  @keyframes pop { 0%{transform:rotate(45deg) scale(0)} 100%{transform:rotate(45deg) scale(1)} }
  label.item span { transition:color .2s, opacity .2s; }
  label.item input:checked + span { color:var(--muted); text-decoration:line-through;
    opacity:.62; }
  .anchor { color:var(--gold); font-weight:700; }
  .row.gold { background:linear-gradient(90deg,var(--gold-soft),transparent 70%);
    margin:0 -15px; padding:0 15px; }
  .tag { display:inline-block; font-size:0.6rem; font-weight:700; text-transform:uppercase;
    letter-spacing:0.06em; color:var(--accent); background:var(--accent-soft);
    border-radius:8px; padding:2px 7px; margin-left:6px; vertical-align:1px; }

  .wnote { display:block; width:calc(100% - 32px); margin:0 0 11px 32px; padding:8px 11px;
    font-size:0.85rem; font-family:inherit; color:var(--ink);
    border:1px dashed #cdc7bd; border-radius:9px; background:#fdfcfa; transition:all .18s; }
  .wnote:focus { outline:none; border:1px solid var(--accent); background:#fff;
    box-shadow:0 0 0 3px var(--accent-soft); }
  .pills { display:flex; gap:6px; margin:0 0 11px 32px; }

  /* ---------- all-tasks ---------- */
  .addform { background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:15px; margin-bottom:14px; box-shadow:var(--shadow); }
  .addform h3 { font-size:0.68rem; text-transform:uppercase; letter-spacing:0.09em;
    color:var(--muted); margin-bottom:11px; }
  .addform input[type=text], .addform select, .addform input[type=date] {
    font-family:inherit; font-size:0.85rem; color:var(--ink); background:#fff;
    border:1px solid var(--line); border-radius:9px; padding:9px 11px; }
  .addform input[type=text] { width:100%; margin-bottom:8px; }
  .addform input[type=text]:focus { outline:none; border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft); }
  .frow { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .frow select, .frow input[type=date] { flex:1; min-width:88px; }
  .addform .go { width:100%; padding:11px; border:none; border-radius:11px;
    background:var(--accent); color:#fff; font-size:0.86rem; font-weight:700;
    cursor:pointer; transition:all .18s; }
  .addform .go:active { transform:scale(.98); }

  .sched { background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:6px 15px 4px; margin-bottom:11px; box-shadow:var(--shadow); }
  .sched h2 { font-size:0.68rem; text-transform:uppercase; letter-spacing:0.09em;
    color:var(--muted); padding:12px 0 6px; display:flex; justify-content:space-between; }
  .sched h2 .hint { font-weight:500; text-transform:none; letter-spacing:0; }
  .srow { display:flex; flex-direction:column; gap:7px; padding:10px 0;
    border-top:1px solid var(--line); font-size:0.85rem; }
  .srow:first-of-type { border-top:none; }
  .stop { display:flex; align-items:center; gap:8px; }
  .srow .lbl { flex:1; line-height:1.3; user-select:none; -webkit-user-select:none; }
  .sctl { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .srow select, .srow input[type=date] { font-family:inherit; font-size:0.76rem;
    border:1px solid var(--line); border-radius:8px; padding:5px 6px; background:#fff;
    color:var(--ink); }
  .srow .del { border:none; background:none; color:#b9534a; font-size:1.15rem;
    cursor:pointer; padding:0 4px; line-height:1; flex:none; }
  /* zone pill — doubles as the picker for moving a task to another zone */
  .srow select.zsel { font-family:inherit; font-size:0.7rem; font-weight:700;
    color:var(--accent); background:var(--accent-soft);
    border:1px solid transparent; border-radius:999px; padding:3px 4px 3px 9px;
    cursor:pointer; flex:none; width:auto; max-width:120px; }
  .srow select.zsel:focus { outline:none; border-color:var(--accent); }
  .srow select.cadsel { font-weight:700; color:var(--accent); }
  .empty { color:var(--muted); font-size:0.8rem; padding:8px 0 12px; }

  .nncard { background:var(--card); border:1.5px solid #d8c3ea; border-radius:16px;
    padding:6px 15px 4px; margin-bottom:14px; box-shadow:var(--shadow); }
  .nncard h2 { font-size:0.68rem; text-transform:uppercase; letter-spacing:0.09em;
    padding:12px 0 8px; display:flex; justify-content:space-between; align-items:center; }
  .nncard h2 .nm { -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
    background-image:linear-gradient(90deg,#22c9d8,#7c5cc4 55%,#e0457b); }
  .nncard h2 .cnt { font-weight:500; text-transform:none; letter-spacing:0;
    color:var(--muted); }
  .nnhint { font-size:0.76rem; color:var(--muted); line-height:1.45; padding:2px 0 12px; }
  .star { border:none; background:none; cursor:pointer; padding:8px 2px 8px 8px;
    font-size:0.95rem; line-height:1; color:#cfc6d6; flex:none; transition:all .15s; }
  .star.on { color:var(--gold); }
  .star:active { transform:scale(.85); }
  .bump { border:none; background:none; cursor:pointer; padding:8px 2px 8px 6px;
    font-size:1rem; line-height:1; color:#c3b9cd; flex:none; transition:all .15s; }
  .bump:active { transform:translateX(3px); }
  .bump.back { color:var(--accent); }
  .bump.back:active { transform:translateX(-3px); }
  .b-extra h2 .nm { background-image:linear-gradient(90deg,#e0457b,#a544b0); }
  .exbtn { border:none; background:none; cursor:pointer; padding:8px 3px;
    font-size:0.88rem; line-height:1; color:#b6acc2; flex:none; transition:all .15s; }
  .exbtn:active { transform:scale(.86); color:var(--accent); }
  .exbtn.del { color:#c98b84; font-size:1.05rem; }
  .exbtn.del:active { color:#b9534a; }
  .exadd { display:flex; gap:6px; padding:10px 0 6px; border-top:1px solid var(--line); }
  .exadd input { flex:1; font-family:inherit; font-size:0.85rem; color:var(--ink);
    background:#fff; border:1px solid var(--line); border-radius:9px; padding:9px 11px; }
  .exadd input:focus { outline:none; border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft); }
  .exadd button { border:none; border-radius:9px; background:var(--accent); color:#fff;
    font-size:0.82rem; font-weight:700; padding:0 16px; cursor:pointer; }
  .exadd button:active { transform:scale(.97); }
  .exnote { font-size:0.72rem; color:var(--muted); padding:2px 0 10px; }
  .mealrow { display:flex; align-items:center; gap:10px; padding:7px 0;
    border-top:1px solid var(--line); }
  .mealrow:first-of-type { border-top:none; }
  .mealday { font-size:0.72rem; font-weight:700; color:var(--accent);
    width:34px; flex:none; }
  .mealin { flex:1; font-family:inherit; font-size:0.85rem; color:var(--ink);
    background:#fff; border:1px solid var(--line); border-radius:8px; padding:7px 10px; }
  .mealin:focus { outline:none; border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft); }
  .pulled { color:var(--accent); font-weight:500; }
  .pullempty { color:var(--muted); font-style:italic; opacity:.8; }

  /* ---------- week planning ---------- */
  .grocerylink { display:flex; align-items:center; justify-content:center; gap:6px;
    text-decoration:none; background:linear-gradient(120deg,#22c9d8,#7c5cc4);
    color:#fff; font-size:0.85rem; font-weight:700; padding:12px; border-radius:14px;
    margin-bottom:14px; box-shadow:var(--shadow); }
  .planrow { display:flex; align-items:center; gap:8px; padding:6px 0;
    border-top:1px solid var(--line); }
  .planrow:first-of-type { border-top:none; }
  .planctrl { display:flex; flex-direction:column; gap:2px; flex:none; }
  .planctrl button { border:none; background:none; color:#b6acc2; cursor:pointer;
    font-size:0.75rem; line-height:1; padding:2px 4px; }
  .planctrl button:disabled { opacity:.25; cursor:default; }
  .planctrl button:active:not(:disabled) { color:var(--accent); }
  .milesrow { display:flex; align-items:center; gap:8px; padding:0 0 9px 42px; }
  .milesrow .mlbl { font-size:0.72rem; color:var(--muted); }
  .milesrow input { flex:none; width:64px; font-family:inherit; font-size:0.78rem; color:var(--ink);
    background:#fff; border:1px solid var(--line); border-radius:8px; padding:5px 8px; }
  .milesrow input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }

  /* ---------- work ---------- */
  .waiting { background:linear-gradient(135deg,#6d2fb8,#a32f9e 55%,#e0457b); color:#fff;
    border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:14px; }
  .waiting .wn { font-size:2.4rem; font-weight:800; line-height:1; }
  .waiting .wt { font-size:0.82rem; opacity:.92; line-height:1.35; }
  .waiting .wact { margin-left:auto; display:flex; flex-direction:column; gap:6px; }
  .waiting a, .waiting button { border:none; border-radius:9px; background:rgba(255,255,255,.9);
    color:#7a2fb0; font-size:0.72rem; font-weight:700; padding:7px 11px; cursor:pointer;
    text-decoration:none; text-align:center; white-space:nowrap; }
  .wlink { display:flex; align-items:center; gap:8px; text-decoration:none;
    padding:11px 13px; border:1px solid var(--line); border-radius:12px; background:var(--card);
    color:var(--ink); font-size:0.88rem; font-weight:600; margin-bottom:8px; box-shadow:var(--shadow); }
  .wlink .ar { margin-left:auto; color:var(--muted); }
  .waddrow { display:flex; gap:6px; margin-bottom:8px; }
  .waddrow input[type=text] { flex:1 1 auto; min-width:0; }
  .waddrow input[type=date] { flex:none; width:118px; min-width:0; max-width:40%; }
  .wtask { display:flex; align-items:center; gap:10px; padding:9px 0;
    border-top:1px solid var(--line); font-size:0.88rem; }
  .wtask:first-of-type { border-top:none; }
  .wtask input[type=checkbox] { appearance:none; -webkit-appearance:none; width:20px; height:20px;
    border:2px solid #c9bed3; border-radius:6px; flex:none; cursor:pointer; position:relative; }
  .wtask input:checked { background:var(--accent); border-color:var(--accent); }
  .wtask input:checked::after { content:""; position:absolute; left:5px; top:1px; width:5px; height:10px;
    border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg); }
  .wtask .wl { flex:1; }
  .wtask.done .wl { color:var(--muted); text-decoration:line-through; opacity:.6; }
  .wtask .due { font-size:0.7rem; font-weight:700; padding:2px 8px; border-radius:8px;
    background:var(--accent-soft); color:var(--accent); white-space:nowrap; }
  .wtask .due.over { background:#fbe9f0; color:#a3245a; }
  .wtask .wx { border:none; background:none; color:#b9534a; font-size:1.1rem; cursor:pointer; padding:0 2px; }
  .wbtn { border:1px solid var(--line); background:var(--card); color:var(--accent);
    font-size:0.74rem; font-weight:700; padding:8px 14px; border-radius:9px; cursor:pointer; }
  .wbtn:active { background:var(--accent-soft); }
  .worksubhead { font-size:0.85rem; font-weight:700; color:var(--accent);
    padding:10px 0 3px; border-top:1px solid var(--line); }
  .worksubhead:first-of-type { border-top:none; }
  .wtask.sub { padding-left:20px; border-top:none; }
  .wtask.sub .wl { font-size:0.85rem; }

  /* ---------- pizzazz ---------- */
  @keyframes twinkle { 0%,100%{opacity:0; transform:scale(.4) rotate(0deg)} 50%{opacity:.95; transform:scale(1) rotate(20deg)} }
  .hero .spk { position:absolute; color:#ffe08a; font-size:12px; pointer-events:none;
    animation:twinkle 3.4s ease-in-out infinite; z-index:2; text-shadow:0 0 6px rgba(255,224,138,.7); }
  @keyframes flamePulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.22)} }
  .sk:not(.cold) .flame { animation:flamePulse 1.7s ease-in-out infinite; }
  @keyframes ringGlow { 0%,100%{filter:none} 50%{filter:drop-shadow(0 0 7px rgba(255,209,102,.95))} }
  .ring.full svg { animation:ringGlow 1.9s ease-in-out infinite; }
  @keyframes viewIn { from{opacity:0; transform:translateY(7px)} to{opacity:1; transform:none} }
  .viewin { animation:viewIn .34s cubic-bezier(.2,1,.4,1); }
  @keyframes chipPulse { 0%{transform:scale(1)} 50%{transform:scale(1.09)} 100%{transform:scale(1)} }
  .days button.full { animation:chipPulse .5s ease; }
  .tabs button:active { transform:scale(.93); }
  .days button:active { transform:scale(.95); }
  .toggle button:active, .pills button:active, .footer button:active { transform:scale(.96); }
  .wlink:active, .grocerylink:active { transform:scale(.98); }
  .hero h1 { position:relative; }
  .hero { transition:background .3s ease; }

  /* ---------- quick capture / inbox ---------- */
  #capture { display:flex; gap:6px; margin:0 0 10px; }
  #capIn { flex:1; font-family:inherit; font-size:0.85rem; color:var(--ink); background:var(--card);
    border:1px solid var(--line); border-radius:11px; padding:10px 12px; }
  #capIn:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  #capMic, #capAdd { flex:none; width:42px; border:1px solid var(--line); background:var(--card);
    border-radius:11px; cursor:pointer; font-size:1.05rem; color:var(--accent); }
  #capAdd { font-weight:800; }
  #capMic:active, #capAdd:active { transform:scale(.94); }
  #capMic.rec { background:#ffe0ec; border-color:var(--gold); animation:recpulse 1s ease-in-out infinite; }
  @keyframes recpulse { 50% { background:#ffc9de; } }
  .inboxhead { border:none; background:none; color:var(--muted); font-size:0.76rem; font-weight:700;
    cursor:pointer; padding:0 2px 10px; display:flex; align-items:center; gap:7px; }
  .ibcount { background:var(--accent); color:#fff; border-radius:999px; font-size:0.66rem;
    font-weight:700; padding:1px 8px; }
  .inboxitem { display:flex; align-items:center; gap:8px; padding:9px 0;
    border-top:1px solid var(--line); font-size:0.85rem; }
  .inboxitem:first-child { border-top:none; }
  .ibtx { flex:1; line-height:1.35; }
  .ibbtn { border:1px solid var(--line); background:#fff; color:var(--accent); font-size:0.64rem;
    font-weight:700; padding:4px 10px; border-radius:999px; cursor:pointer; white-space:nowrap; flex:none; }
  .ibbtn:active { transform:scale(.95); }

<script>
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DAY_FULL = {Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',Fri:'Friday',Sat:'Saturday',Sun:'Sunday'};
const QMONTHS = [0,3,6,9];
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const BUCKETS = ['Home','Kitchen','Living Area','Bedrooms','Bathrooms','Entrance',
  'Grocery','Misc','Morning','Work Day','Evening'];
const CADENCES = [['daily','Every day'],['weekly','Weekly'],['monthly','Monthly'],
  ['quarterly','Quarterly'],['annual','Annual'],['once','One-time']];

/* ================= confetti ================= */
const cvs = document.getElementById('confetti');
const ctx = cvs.getContext('2d');
let parts = [], raf = null;
function sizeCanvas(){
  const dpr = window.devicePixelRatio || 1;
  cvs.width = innerWidth * dpr; cvs.height = innerHeight * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
sizeCanvas(); addEventListener('resize', sizeCanvas);
const COLORS = ['#7a2fb0','#e0457b','#1fbdd4','#ffd166','#ff8c42','#a32f9e','#3ddc97'];
function burst(x, y, n, power){
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, s = (Math.random()*0.6+0.5)*power;
    parts.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - power*0.5,
      w:Math.random()*6+4, h:Math.random()*4+3, rot:Math.random()*6.28,
      vr:(Math.random()-0.5)*0.4, c:COLORS[(Math.random()*COLORS.length)|0],
      life:0, max:60+Math.random()*35 });
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts = parts.filter(p=>p.life < p.max);
  parts.forEach(p=>{
    p.life++; p.vy += 0.32; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    ctx.globalAlpha = Math.max(0, 1 - p.life/p.max);
    ctx.fillStyle = p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
  });
  if (parts.length) raf = requestAnimationFrame(tick);
  else { raf = null; ctx.clearRect(0,0,innerWidth,innerHeight); }
}
function burstAt(el, big){
  const r = el.getBoundingClientRect();
  burst(r.left + r.width/2, r.top + r.height/2, big?90:14, big?9:5);
}
function celebrate(){
  burst(innerWidth*0.2, innerHeight*0.42, 70, 10);

/* ================= dates ================= */
function mondayOf(d){
  const x = new Date(d); const dow = (x.getDay()+6)%7;
  x.setDate(x.getDate()-dow); x.setHours(0,0,0,0); return x;
}
const now = new Date();
const monday = mondayOf(now);
const weekKey = 'mwl-' + monday.toISOString().slice(0,10);
function dateFor(dn){ const d = new Date(monday); d.setDate(d.getDate()+DAYS.indexOf(dn)); return d; }
function wom(d){ return Math.floor((d.getDate()-1)/7)+1; }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function occursOn(t, d){
  const dn = DAYS[(d.getDay()+6)%7];
  if (t.cad === 'daily') return true;
  if (t.cad === 'once') return t.date === ymd(d);
  if (t.day !== dn) return false;
  if (t.cad === 'weekly') return true;
  if (t.cad === 'monthly') return wom(d) === t.week;
  if (t.cad === 'quarterly') return wom(d) === t.week && QMONTHS.includes(d.getMonth());
  if (t.cad === 'annual') return wom(d) === t.week && d.getMonth() === t.month;
  return false;
}
function tasksOn(dn){ const d = dateFor(dn); return tasks.filter(t=>occursOn(t,d)); }
function occursAnyDay(t){ return DAYS.some(d=>occursOn(t, dateFor(d))); }
function autoDay(){
  let best='Mon', bestN=Infinity;
  DAYS.forEach(dn=>{ const n = tasks.filter(t=>t.day===dn).length; if (n<bestN){bestN=n;best=dn;} });
  return best;
}
function autoWeek(cad){
  let best=1, bestN=Infinity;
  for (let w=1;w<=4;w++){ const n = tasks.filter(t=>t.cad===cad&&t.week===w).length; if (n<bestN){bestN=n;best=w;} }
  return best;
}
/* Switch a task's cadence in place, filling in whatever the new cadence needs
   and dropping what it doesn't — so no delete-and-re-add. */
function changeCadence(t, cad){
  t.cad = cad;
  if (cad === 'daily'){
    delete t.day; delete t.week; delete t.month; delete t.date;
  } else if (cad === 'once'){
    delete t.day; delete t.week; delete t.month;
    if (!t.date){ const d = new Date(now); d.setDate(d.getDate()+1); t.date = ymd(d); }
  } else {
    delete t.date;
    if (!t.day) t.day = autoDay();
    if (cad === 'weekly'){ delete t.week; delete t.month; }
    else {
      if (!t.week) t.week = autoWeek(cad);
      if (cad === 'annual'){ if (typeof t.month !== 'number') t.month = now.getMonth(); }
      else delete t.month;
    }
  }
  saveTasks(); render();
}

  const k = nnKey(day); const list = nn[k] || [];
  const i = list.indexOf(rk);

    const mv = movedTo(t);
    if (mv && occursAnyDay(t)) return mv === dn;
    return occursOn(t, dateFor(dn));

function editExtra(idx, text){

/* Non-negotiables pin an extra by its position ('EX#2'), so removing one has to
   shift those pins down or they'd point at the wrong to-do. */
function deleteExtra(idx){
  const list = extras().slice();
  if (!list[idx]) return;
  list.splice(idx, 1);
  state['EXW'] = list;
  let touched = false;
  Object.keys(nn).forEach(k=>{
    const out = [];
    (nn[k] || []).forEach(rk=>{
      if (rk.indexOf('EX#') !== 0){ out.push(rk); return; }
      const j = +rk.slice(3);
      if (j === idx){ touched = true; return; }
      if (j > idx){ out.push('EX#'+(j-1)); touched = true; return; }
      out.push(rk);
    });
    nn[k] = out;
  });
  if (touched) localStorage.setItem('mwl-nn', JSON.stringify(nn));
  save();
}

function dayProgress(day){

/* ========== history + streaks ========== */
let history = {};
try { history = JSON.parse(localStorage.getItem('mwl-history') || '{}'); } catch(e){ history = {}; }
function ymdToDate(s){ const a=s.split('-').map(Number); return new Date(a[0],a[1]-1,a[2]); }
function dowKey(d){ return DAYS[(d.getDay()+6)%7]; }

function dayFacts(day){
  return {
    workoutDone: !!state[anchorKey('workout',day)],
    wakeDone: !!state[anchorKey('wake',day)],
    bedDone: !!state[anchorKey('bed',day)]
  };
}
function snapshotToday(){
  // Snapshot every day of THIS week up through today from the live checkboxes,
  // so ticking a past day (e.g. yesterday's workout) still counts.
  //
  // Days before today are UPGRADE-ONLY: a recorded workout can never be
  // un-recorded by clearing checkboxes. That's what makes "Reset week" safe —
  // it wipes the boxes for a fresh week without erasing the streak behind them.
  const today = new Date(now); today.setHours(0,0,0,0);
  DAYS.forEach((wd,idx)=>{
    const d = new Date(monday); d.setDate(d.getDate()+idx); d.setHours(0,0,0,0);
    if (d > today) return;
    const f = dayFacts(wd);
    const p = dayProgress(wd);
    const key = ymd(d);
    const pct = p.total ? Math.round(100*p.done/p.total) : 0;
    const prev = history[key];
    if (d < today && prev){
      history[key] = {
        p: Math.max(prev.p||0, pct),
        w: !!prev.w || f.workoutDone,
        k: !!prev.k || f.wakeDone,
        b: !!prev.b || f.bedDone,
        dn: Math.max(prev.dn||0, p.done),
        tt: Math.max(prev.tt||0, p.total)
      };
    } else {
      history[key] = { p:pct, w:f.workoutDone, k:f.wakeDone, b:f.bedDone, dn:p.done, tt:p.total };
    }
  });
  localStorage.setItem('mwl-history', JSON.stringify(history));
}
function anchorFreeze(kind, d){
  const wd = dowKey(d);
  if (kind === 'workout') return wd === 'Sun';
  if (kind === 'wake') return wd === 'Sat' || wd === 'Sun';
  return false;
}
function anchorDone(kind, e){
  if (!e) return false;
  return kind==='workout' ? !!e.w : kind==='wake' ? !!e.k : !!e.b;
}
function currentStreak(kind){
  let streak=0, first=true;
  let d=new Date(now); d.setHours(0,0,0,0);
  for (let i=0;i<400;i++){
    if (anchorFreeze(kind,d)){ d.setDate(d.getDate()-1); first=false; continue; }
    if (anchorDone(kind, history[ymd(d)])){ streak++; d.setDate(d.getDate()-1); first=false; continue; }
    if (first){ d.setDate(d.getDate()-1); first=false; continue; }
    break;
  }
  return streak;
}
function bestStreak(kind){
  const keys = Object.keys(history); if (!keys.length) return 0;
  keys.sort();
  let d = ymdToDate(keys[0]);
  const end = new Date(now); end.setHours(0,0,0,0);
  let best=0, run=0;
  while (d <= end){
    if (anchorFreeze(kind,d)){ /* freeze */ }
    else if (anchorDone(kind, history[ymd(d)])){ run++; if (run>best) best=run; }
    else run=0;
    d.setDate(d.getDate()+1);
  }
  return best;
}
function allTimeDone(){
  return Object.values(history).reduce((s,e)=>s+(e.dn||0),0);
}
function bestDayPct(){
  return Object.values(history).reduce((m,e)=>Math.max(m,e.p||0),0);
}
function weeksTracked(){
  const set = new Set();
  Object.keys(history).forEach(k=> set.add(ymd(mondayOf(ymdToDate(k)))));
  return set.size;
}
function weekProgress(){
  let total=0, done=0;
  DAYS.forEach(d=>{ const p = dayProgress(d); total+=p.total; done+=p.done; });
  return { total, done };
}

/* ================= week view ================= */
function daysToK(){ return Math.ceil((SCHOOL_START - now)/86400000); }
function renderTransition(){
  const el = document.getElementById('transition'); el.innerHTML = '';
  const k = daysToK();

  /* If the calendar and the active rhythm disagree, say so — this is what
     used to leave you on the summer plan all through September. */
  if (version !== dateVersion){
    const div = document.createElement('div'); div.className='tbanner';
    const onSummerInSchool = dateVersion === 'school';
    div.innerHTML = '<div class="th">' +
      (onSummerInSchool ? 'School’s in — you’re on the summer rhythm' : 'It’s still summer — you’re on the school rhythm') +
      '</div><div class="tb">' +
      (onSummerInSchool
        ? 'Your checklist still says kids up 7:30–8:00. Switch over for the 7:05 out-the-door morning.'
        : 'You’re test-driving the school-year plan early. Switch back any time.') +
      '</div>';
    const btn = document.createElement('button');
    btn.textContent = onSummerInSchool ? 'Switch to school schedule' : 'Back to summer schedule';
    btn.onclick = ()=> setVersion(dateVersion);
    div.appendChild(btn);
    el.appendChild(div);
    return;
  }

  if (k <= 0 || k > 30) return;
  let head, body;
  if (k <= 7){
    head = 'Trial week — ' + k + ' day' + (k===1?'':'s') + ' to kindergarten';
    body = 'Run the real thing now: 5:00 wake, out the door by 7:25. Better to hit the friction this week than on day one.';
  } else if (k <= 14){
    head = 'Two-week warning — ' + k + ' days to kindergarten';
    body = 'Start test-driving the 7:25 departure a couple mornings this week so it’s muscle memory by Aug 20.';
  } else {
    head = 'Kindergarten in ' + k + ' days';
    body = 'Begin easing bedtime and wake earlier now — small shifts beat one hard reset on Aug 20.';
  }
  const div = document.createElement('div'); div.className='tbanner';
  div.innerHTML = '<div class="th">'+head+'</div><div class="tb">'+body+'</div>';
  if (version !== 'school'){
    const btn = document.createElement('button');
    btn.textContent = 'Switch to school schedule';
    btn.onclick = ()=> setVersion('school');
    div.appendChild(btn);
  }
  el.appendChild(div);
}
function streakCard(){
  const defs = [['workout','Workout','&#128293;'],['wake','5am wake','&#9200;'],['bed','9:15 bed','&#127772;']];
  const sec = document.createElement('section'); sec.className='streaks';
  defs.forEach(([kind,label,glyph])=>{
    const cur = currentStreak(kind), best = bestStreak(kind);
    const el = document.createElement('div'); el.className='sk'+(cur?'':' cold');
    el.innerHTML = '<div class="flame">'+(cur?glyph:'&#10022;')+'</div>' +
      '<div class="n">'+cur+'</div><div class="lbl">'+label+'</div>' +
      '<div class="best">best '+best+'</div>';
    sec.appendChild(el);
  });
  return sec;
}
function extraRow(day, idx, inCard){
  const x = extras()[idx]; if (!x) return null;
  const rk = 'EX#'+idx;
  const row = document.createElement('div'); row.className='row';
  const lab = document.createElement('label'); lab.className='item';
  const cb = document.createElement('input'); cb.type='checkbox'; cb.checked=!!x.d;
  cb.onchange = ()=>{
    const before = dayProgress(day); const wasFull = before.total && before.done===before.total;
    const list = extras().slice(); list[idx] = { t:x.t, d:cb.checked };
    state['EXW'] = list; save();
    if (cb.checked){ const p=dayProgress(day);
      if (p.total && p.done===p.total && !wasFull) celebrate(); else burstAt(cb,false); }
    render();
  };
  const sp = document.createElement('span'); sp.textContent = x.t;
  lab.appendChild(cb); lab.appendChild(sp);
  const flex = document.createElement('div'); flex.className='rowflex'; flex.appendChild(lab);
  if (!inCard){
    const st = document.createElement('button');
    st.className = 'star' + (nnHas(day, rk) ? ' on' : '');
    st.innerHTML = nnHas(day, rk) ? '&#9733;' : '&#9734;';
    st.title = 'Pin as a non-negotiable'; st.setAttribute('aria-label','Pin as a non-negotiable');
    st.onclick = (e)=>{ e.preventDefault();
      if (!nnToggle(day, rk)){ alert('You already have five. Unpin one first — that’s the point.'); return; }
      if (nnHas(day, rk)) burstAt(st,false); render(); };
    flex.appendChild(st);

    const ed = document.createElement('button'); ed.className='exbtn';
    ed.innerHTML = '&#9998;';
    ed.title = 'Edit this to-do'; ed.setAttribute('aria-label','Edit this to-do');
    ed.onclick = (e)=>{
      e.preventDefault();
      const v = prompt('Edit this to-do (clear the box to delete it):', x.t);
      if (v === null) return;
      if (!v.trim()){ deleteExtra(idx); render(); return; }
      editExtra(idx, v.trim()); render();
    };
    flex.appendChild(ed);

    const rm = document.createElement('button'); rm.className='exbtn del';
    rm.innerHTML = '&times;';
    rm.title = 'Delete this to-do'; rm.setAttribute('aria-label','Delete this to-do');
    rm.onclick = (e)=>{
      e.preventDefault();
      if (!confirm('Delete “' + x.t + '”?')) return;
      deleteExtra(idx); render();
    };
    flex.appendChild(rm);
  }
  row.appendChild(flex);
  return row;
}
function renderWeek(){
  document.getElementById('vNow').className = version==='now' ? 'on' : '';
  document.getElementById('vSchool').className = version==='school' ? 'on' : '';
  renderTransition();

  const tabs = document.getElementById('dayTabs'); tabs.innerHTML = '';
  const todayKey = DAYS[(now.getDay()+6)%7];
  DAYS.forEach(d=>{
    const p = dayProgress(d);
    const pc = p.total ? 100*p.done/p.total : 0;
    const b = document.createElement('button');
    b.className = (d===selDay?'sel ':'') + (d===todayKey?'today ':'') + (pc===100?'full':'');
    b.innerHTML = '<span class="d">'+d+'</span><span class="mini"><i style="width:'+pc+'%"></i></span>';
    b.onclick = ()=>{ selDay = d; render(); };
    tabs.appendChild(b);
  });

  const plan = fixedPlan(selDay, version);
  const dayTasks = liveTasksOn(selDay);
  const names = Object.keys(plan);
  dayTasks.forEach(t=>{ if (!names.includes(t.bucket)) names.push(t.bucket); });

  const all = [];
  names.forEach(bucket=>{
    const fixed = plan[bucket] ? plan[bucket].items : [];
    fixed.forEach((it,i)=> all.push({ bucket, text:it[0], anchor:it[1], special:it[2],
      id:fixedId(selDay,bucket,i), rk:bucket+'#'+i, tag:'' }));
    dayTasks.filter(t=>t.bucket===bucket).forEach(t=> all.push({ bucket, text:t.label,
      anchor:false, special:null, id:storeId(selDay,t.id), rk:'T#'+t.id,
      tag:t.cad==='weekly'?'':t.cad, task:t,
      bumped: movedTo(t)===selDay && !occursOn(t, dateFor(selDay)) }));
  });

  const wrap = document.getElementById('buckets'); wrap.innerHTML = '';
  wrap.appendChild(streakCard());

  const picks = nnList(selDay);
  const card = document.createElement('section'); card.className='nncard';
  const ch = document.createElement('h2');
  ch.innerHTML = '<span class="nm">Today’s non-negotiables</span>' +
    '<span class="cnt">' + picks.length + ' of 5</span>';
  card.appendChild(ch);
  if (!picks.length){
    const hint = document.createElement('div'); hint.className='nnhint';
    hint.textContent = 'Tap the star on any task below to pin it here. Pick up to five — if only these get done, the day still counts.';
    card.appendChild(hint);
  } else {
    picks.forEach(rk=>{
      if (rk.indexOf('EX#')===0){ const r=extraRow(selDay, +rk.slice(3), true); if (r) card.appendChild(r); return; }
      const it = all.find(x=>x.rk===rk);
      if (it) card.appendChild(makeRow(it, true));
    });
  }
  wrap.appendChild(card);

  const TONE = { 'Morning':'b-morning', 'Work Day':'b-work', 'Home':'b-home', 'Evening':'b-evening' };
  names.forEach(bucket=>{
    const mine = all.filter(x=>x.bucket===bucket);
    if (!mine.length) return;
    const sec = document.createElement('section');
    sec.className = 'bucket ' + (TONE[bucket] || 'b-zone');
    const h = document.createElement('h2');
    h.innerHTML = '<span class="nm">' + bucket + '</span><span class="time">' +
      (plan[bucket] ? plan[bucket].time : 'zone day') + '</span>';
    sec.appendChild(h);
    mine.forEach(it=> sec.appendChild(makeRow(it, false)));
    wrap.appendChild(sec);
  });

  /* ---- extra to-dos ---- */
  const ex = document.createElement('section'); ex.className='bucket b-extra';
  const eh = document.createElement('h2');
  eh.innerHTML = '<span class="nm">Extra to-dos</span><span class="time">all week</span>';
  ex.appendChild(eh);
  extras().forEach((x,i)=>{ const r=extraRow(selDay,i,false); if (r) ex.appendChild(r); });
  const addRow = document.createElement('div'); addRow.className='exadd';
  const exIn = document.createElement('input');
  exIn.type='text'; exIn.placeholder='Add something for this week';
  const exGo = document.createElement('button'); exGo.textContent='Add';
  function commit(){
    const v = exIn.value.trim(); if (!v) return;
    addExtra(v); exIn.value=''; burstAt(exGo,false); render();
  }
  exGo.onclick = commit;
  exIn.onkeydown = (e)=>{ if (e.key === 'Enter') commit(); };
  addRow.appendChild(exIn); addRow.appendChild(exGo);
  ex.appendChild(addRow);
  const note = document.createElement('div'); note.className='exnote';
  note.textContent = 'These stay all week and show every day. Cleared on the weekly reset.';
  ex.appendChild(note);
  wrap.appendChild(ex);

  const p = dayProgress(selDay);
  document.getElementById('doneMsg').style.display = (p.total && p.done===p.total) ? 'block' : 'none';
}

function makeRow(item, inCard){
  const text = item.text, isAnchor = item.anchor, special = item.special,
        id = item.id, tag = item.tag, rk = item.rk;
  const row = document.createElement('div');
  row.className = 'row' + (isAnchor ? ' gold' : '');
  const lab = document.createElement('label'); lab.className = 'item';
  const cb = document.createElement('input'); cb.type='checkbox'; cb.checked = !!state[id];
  cb.onchange = ()=>{
    const before = dayProgress(selDay);
    const wasFull = before.total && before.done===before.total;
    state[id] = cb.checked; if (!cb.checked) delete state[id];
    let ak = null;
    if (special === 'workout') ak = anchorKey('workout', selDay);
    else if (typeof text === 'string' && text.indexOf('Wake 5:00') === 0) ak = anchorKey('wake', selDay);
    else if (typeof text === 'string' && text.indexOf('In bed') === 0) ak = anchorKey('bed', selDay);
    if (ak){ if (cb.checked) state[ak] = true; else delete state[ak]; }
    save();
    if (cb.checked){
      const p = dayProgress(selDay);
      if (p.total && p.done===p.total && !wasFull) celebrate();
      else burstAt(cb, isAnchor);
    }
    render();
  };
  const span = document.createElement('span');
  let t = text;
  if (special === 'steps') t = 'Walking pad while you work';
  let pull = '';
  if (special === 'meal'){
    const m = getMeal(selDay);
    pull = m ? ' · <span class="pulled">'+m+'</span>' : ' · <span class="pullempty">set in Plan</span>';
  }
  if (special === 'workout'){
    const w = getWorkout(selDay);
    pull = w ? ' · <span class="pulled">'+w+'</span>' : ' · <span class="pullempty">set in Plan</span>';
  }
  const core = (isAnchor ? '<span class="anchor">'+t+'</span>' : t);
  span.innerHTML = core + pull + (tag ? '<span class="tag">'+tag+'</span>' : '');
  lab.appendChild(cb); lab.appendChild(span);

  const flex = document.createElement('div'); flex.className='rowflex';
  flex.appendChild(lab);
  if (!inCard && rk){
    const st = document.createElement('button');
    st.className = 'star' + (nnHas(selDay, rk) ? ' on' : '');
    st.innerHTML = nnHas(selDay, rk) ? '&#9733;' : '&#9734;';
    st.title = 'Pin as a non-negotiable';
    st.setAttribute('aria-label','Pin as a non-negotiable');
    st.onclick = (e)=>{
      e.preventDefault();
      if (!nnToggle(selDay, rk)){
        alert('You already have five. Unpin one first — that’s the point.');
        return;
      }
      if (nnHas(selDay, rk)) burstAt(st, false);
      render();
    };
    flex.appendChild(st);
  }
  if (!inCard && item.task && item.task.cad !== 'daily'){
    if (movedTo(item.task)){
      const back = document.createElement('button');
      back.className = 'bump back'; back.innerHTML = '&#8617;';
      back.title = 'Move back to ' + DAY_FULL[item.task.day];
      back.setAttribute('aria-label', back.title);
      back.onclick = (e)=>{
        e.preventDefault();
        delete state['MV|'+item.task.id];
        delete state[item.id];
        save(); render();
      };
      flex.appendChild(back);
    }
    const bump = document.createElement('button');
    bump.className = 'bump'; bump.innerHTML = '&#8594;';
    const tgt = nextDay(selDay);
    bump.title = 'Move to ' + DAY_FULL[tgt];
    bump.setAttribute('aria-label','Move to ' + tgt);
    bump.onclick = (e)=>{
      e.preventDefault();
      state['MV|'+item.task.id] = tgt;
      delete state[item.id];
      save(); render();
    };
    flex.appendChild(bump);
  }
  row.appendChild(flex);

  if (special === 'steps' && !inCard){
    const pills = document.createElement('div'); pills.className='pills'; pills.style.alignItems='center';
    const mi = document.createElement('input'); mi.type='number'; mi.step='0.1'; mi.min='0';
    mi.placeholder='Miles'; mi.value = getMiles(selDay);
    mi.style.cssText = 'width:78px;flex:none;font-family:inherit;font-size:0.82rem;'+
      'border:1px solid var(--line);border-radius:9px;padding:6px 9px;color:var(--ink);background:#fff;';
    const out = document.createElement('span');
    out.style.cssText = 'font-size:0.74rem;color:var(--muted);cursor:pointer;';
    out.title = 'Tap to adjust your steps-per-mile average';
    function refreshOut(){
      const v = parseFloat(mi.value);
      out.textContent = (v > 0)
        ? '≈ '+Math.round(v*stepsPerMile).toLocaleString()+' steps · '+stepsPerMile.toLocaleString()+'/mi'
        : 'log miles to estimate · '+stepsPerMile.toLocaleString()+'/mi';
    }
    refreshOut();
    mi.oninput = ()=>{ setMiles(selDay, mi.value); refreshOut(); };
    out.onclick = (e)=>{
      e.preventDefault();
      const v = prompt('Your average steps per mile (Health app: Steps ÷ Walking + Running Distance for the same days):', stepsPerMile);
      if (v === null) return;
      const n = parseInt(v, 10); if (!n || n <= 0) return;
      stepsPerMile = n; localStorage.setItem('mwl-stepspermile', String(n)); refreshOut();
    };
    pills.appendChild(mi); pills.appendChild(out);
    row.appendChild(pills);
  }
  return row;
}

/* press-and-hold helper */
function attachLongPress(el, cb){
  let timer=null;
  const start = ()=>{ timer=setTimeout(()=>{ timer=null; cb(); }, 500); };
  const cancel = ()=>{ if (timer){ clearTimeout(timer); timer=null; } };
  el.addEventListener('touchstart', start, {passive:true});
  el.addEventListener('touchmove', cancel, {passive:true});
  el.addEventListener('touchend', cancel);
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', cancel);
  el.addEventListener('mouseleave', cancel);
  el.oncontextmenu = (e)=>{ e.preventDefault(); };
}

/* ================= all tasks ================= */
function renderAll(){
  const wrap = document.getElementById('schedList'); wrap.innerHTML = '';
  const tip = document.createElement('div'); tip.className='exnote'; tip.style.padding='0 2px 8px';
  tip.textContent = 'Long-press a name to rename it. The pill on the right is its zone, and "how often" swaps a task between weekly, monthly, quarterly and annual without redoing it.';
  wrap.appendChild(tip);
  const groups = [
    ['daily','Every day',''],
    ['weekly','Weekly','pick the day'],
    ['monthly','Monthly','day + week of month'],
    ['quarterly','Quarterly','Jan · Apr · Jul · Oct'],
    ['annual','Annual','one per month'],
    ['once','One-time','']
  ];
  groups.forEach(([cad,title,hint])=>{
    const list = tasks.filter(t=>t.cad===cad);
    if (!list.length && (cad==='daily'||cad==='once'||cad==='quarterly')) return;
    const sec = document.createElement('section'); sec.className='sched';
    const h = document.createElement('h2');
    h.innerHTML = title + (hint ? '<span class="hint">'+hint+'</span>' : '');
    sec.appendChild(h);
    if (!list.length){
      const e = document.createElement('div'); e.className='empty';
      e.textContent = 'Nothing here yet.'; sec.appendChild(e);
    }
    list.forEach(t=>{
      const row = document.createElement('div'); row.className='srow';

      /* ---- line 1: name, zone, delete ---- */
      const top = document.createElement('div'); top.className='stop';
      const lbl = document.createElement('span'); lbl.className='lbl';
      lbl.textContent = t.label; lbl.title='Long-press to rename'; lbl.style.cursor='pointer';
      attachLongPress(lbl, ()=>{ const v=prompt('Rename task:', t.label);
        if (v!==null && v.trim()){ t.label=v.trim(); saveTasks(); render(); } });
      top.appendChild(lbl);

      const zs = document.createElement('select'); zs.className='zsel';
      zs.title = 'Zone — change it to move this task';
      const zones = BUCKETS.slice();
      if (t.bucket && zones.indexOf(t.bucket) === -1) zones.push(t.bucket);
      zones.forEach(b=>{ const o=document.createElement('option'); o.textContent=b;
        if (b===t.bucket) o.selected=true; zs.appendChild(o); });
      zs.onchange = ()=>{ t.bucket = zs.value; saveTasks(); render(); };
      top.appendChild(zs);

      const del = document.createElement('button'); del.className='del'; del.textContent='×';
      del.onclick = ()=>{ if (confirm('Remove "'+t.label+'"?')){
        tasks = tasks.filter(x=>x.id!==t.id); saveTasks(); render(); } };
      top.appendChild(del);
      row.appendChild(top);

      /* ---- line 2: how often, and whatever that cadence needs ---- */
      const ctl = document.createElement('div'); ctl.className='sctl';

      const cs = document.createElement('select'); cs.className='cadsel';
      cs.title = 'How often this repeats';
      CADENCES.forEach(([val,label])=>{ const o=document.createElement('option');
        o.value=val; o.textContent=label; if (val===t.cad) o.selected=true; cs.appendChild(o); });
      cs.onchange = ()=> changeCadence(t, cs.value);
      ctl.appendChild(cs);

      if (t.cad !== 'daily' && t.cad !== 'once'){
        const ds = document.createElement('select');
        DAYS.forEach(dn=>{ const o=document.createElement('option'); o.textContent=dn;
          if (dn===t.day) o.selected=true; ds.appendChild(o); });
        ds.onchange = ()=>{ t.day = ds.value; saveTasks(); render(); };
        ctl.appendChild(ds);
      }
      if (t.cad==='monthly'||t.cad==='quarterly'||t.cad==='annual'){
        const ws = document.createElement('select');
        for (let w=1;w<=4;w++){ const o=document.createElement('option'); o.value=w; o.textContent='Wk '+w;
          if (w===t.week) o.selected=true; ws.appendChild(o); }
        ws.onchange = ()=>{ t.week = +ws.value; saveTasks(); render(); };
        ctl.appendChild(ws);
      }
      if (t.cad==='annual'){
        const ms = document.createElement('select');
        MONTH_NAMES.forEach((mn,mi)=>{ const o=document.createElement('option'); o.value=mi; o.textContent=mn;
          if (mi===t.month) o.selected=true; ms.appendChild(o); });
        ms.onchange = ()=>{ t.month = +ms.value; saveTasks(); render(); };
        ctl.appendChild(ms);
      }
      if (t.cad==='once'){
        const di = document.createElement('input'); di.type='date'; di.value = t.date||'';
        di.onchange = ()=>{ t.date = di.value; saveTasks(); render(); };
        ctl.appendChild(di);
      }
      row.appendChild(ctl);
      sec.appendChild(row);
    });
    if (cad === 'once'){
      const today = ymd(new Date(now));

function recentFoodStats(days){
  let calSum=0, proSum=0, n=0;
  for (let i=0;i<days;i++){
    const d = new Date(now); d.setDate(d.getDate()-i);
    const log = food[ymd(d)];
    if (log && log.length){
      calSum += log.reduce((s,e)=>s+(+e.c||0),0);
      proSum += log.reduce((s,e)=>s+(+e.p||0),0);
      n++;
    }
  }
  return { avgCal: n?Math.round(calSum/n):0, avgPro: n?Math.round(proSum/n):0, daysLogged:n };
}
function weekWorkoutStats(){
  let elapsed=0, done=0;
  const today0 = new Date(now); today0.setHours(0,0,0,0);
  DAYS.forEach((dn,idx)=>{
    if (dn === 'Sun') return;
    const d = new Date(monday); d.setDate(d.getDate()+idx); d.setHours(0,0,0,0);
    if (d > today0) return;

/* miles for the 7 days starting at a given Monday */
function milesForWeek(mondayDate){
  let total = 0;
  for (let i=0;i<7;i++){
    const d = new Date(mondayDate); d.setDate(d.getDate()+i);
    const v = parseFloat(milesLog[ymd(d)]);
    if (v > 0) total += v;
  }
  return total;
}
function weekWalkMiles(){ return milesForWeek(monday); }

    } else if (dropping && mag <= 2){

    } else if (dropping){
      lines.push('Down about ' + mag.toFixed(1) + ' lb/wk, which is faster than the usual 1–2 lb guideline. If you’re feeling drained or your workouts are suffering, eating a bit more — nearer the top of your range — usually holds the trend without the crash.');
    } else {
      lines.push('Up about ' + mag.toFixed(1) + ' lb/wk over the last two weeks. Worth a look at portions and how consistently you’re logging before changing anything bigger — a couple of unlogged days can hide a lot.');
    }
    if (f.daysLogged && f.avgCal >= CAL_MIN && f.avgCal <= CAL_MAX && Math.abs(r) < 0.3){
      lines.push('Your intake is inside target and the scale is flat, so the gap is likely activity or unlogged bites rather than your calorie ceiling.');
    }
  } else if (wt){
    lines.push('You’ve logged ' + wt.count + ' weigh-in' + (wt.count===1?'':'s') +
      '. Once there are about two weeks in, this card can tell you whether your intake and activity are actually producing the trend you want.');
  }
  if (f.daysLogged){
    const dayWord = f.daysLogged===1 ? 'day' : 'days';
    if (f.avgCal > CAL_MAX){
      lines.push('Averaging ~'+f.avgCal.toLocaleString()+' cal over the last '+f.daysLogged+' logged '+dayWord+' — about '+(f.avgCal-CAL_MAX)+' over your ceiling. Trim a bit at dinner or cut one snack.');
    } else if (f.avgCal < CAL_MIN){
      lines.push('Averaging ~'+f.avgCal.toLocaleString()+' cal over the last '+f.daysLogged+' logged '+dayWord+' — under your '+CAL_MIN+' floor. Add a bit more, especially protein-dense food, so you’re not under-fueling.');
    } else {
      lines.push('Averaging ~'+f.avgCal.toLocaleString()+' cal over the last '+f.daysLogged+' logged '+dayWord+' — right in your '+CAL_MIN+'–'+CAL_MAX+' range. Keep doing what you’re doing.');
    }
    if (f.avgPro < PRO_FLOOR){
      lines.push('Protein’s averaging ~'+f.avgPro+'g, about '+(PRO_FLOOR-f.avgPro)+'g short of your '+PRO_FLOOR+'g floor — work in one more protein source most days (shake, eggs, Greek yogurt).');
    } else {
      lines.push('Protein’s on target at ~'+f.avgPro+'g/day. Nice.');
    }
  }
  if (wk.elapsed){
    lines.push(wk.done+' of '+wk.elapsed+' workout days done this week — '+
      (wk.done/wk.elapsed < 0.7 ? 'squeeze in one more before Sunday.' : 'strong, keep going.'));
  }
  if (miles > 0){
    const lastWk = lastWeekWalkMiles();
    let cmp = '';
    if (lastWk > 0){
      const diff = miles - lastWk;
      cmp = Math.abs(diff) < 0.5
        ? ' About the same as last week.'
        : (diff > 0 ? ' Up ' : ' Down ') + Math.abs(diff).toFixed(1) + ' mi from last week.';
    }
    lines.push('Logged '+miles.toFixed(1)+' mi on the walking pad this week (~'+Math.round(miles*stepsPerMile).toLocaleString()+' steps).'+cmp+
      (miles < 5 ? ' Try to bump this up a bit.' : ' Solid volume.'));
  }
  lines.forEach(t=>{
    const row = document.createElement('div'); row.className='brow';
    row.innerHTML = '<span>'+t+'</span>';
    card.appendChild(row);
  });
  return card;
}

function weightEntries(){
  return Object.keys(weights).filter(k=>+weights[k] > 0).sort()
    .map(k=>({ d:k, w:+weights[k] }));
}
function shiftYmd(base, delta){ const d = ymdToDate(base); d.setDate(d.getDate()+delta); return ymd(d); }
function avgInRange(es, startY, endY){
  const sub = es.filter(e=> e.d >= startY && e.d <= endY);
  return sub.length ? sub.reduce((s,e)=>s+e.w,0)/sub.length : null;
}
/* Compares a 7-day average to the previous 7 days so one heavy/light morning
   doesn't read as real change. Negative rate = trending down. */
function weightTrend(){
  const es = weightEntries();
  if (!es.length) return null;
  const first = es[0], latest = es[es.length-1];
  const today = ymd(new Date(now));
  const recent = avgInRange(es, shiftYmd(today,-6), today);
  const prior  = avgInRange(es, shiftYmd(today,-13), shiftYmd(today,-7));
  const rate = (recent !== null && prior !== null) ? (recent - prior) : null;
  const spanDays = Math.round((ymdToDate(latest.d) - ymdToDate(first.d))/86400000);
  const overallRate = spanDays >= 7 ? (latest.w - first.w)/(spanDays/7) : null;
  return { es, first, latest, recent, prior, rate, overallRate, spanDays,
           count:es.length, total: latest.w - first.w };
}
/* signed delta for display — avoids printing a silly "−0.0" */
function fmtDelta(v){
  if (Math.abs(v) < 0.05) return '0.0';
  return (v < 0 ? '−' : '+') + Math.abs(v).toFixed(1);
}
function entriesInRange(es, range){
  if (range === 'all') return es;
  const cut = shiftYmd(ymd(new Date(now)), -(+range - 1));
  return es.filter(e=> e.d >= cut);
}
/* trailing 7-day average at each point — the line that actually shows the trend */
function smoothed(es){
  return es.map(e=>{
    const from = shiftYmd(e.d, -6);
    const win = es.filter(x=> x.d >= from && x.d <= e.d);
    return { d:e.d, w: win.reduce((s,x)=>s+x.w,0)/win.length };
  });
}
/* inline SVG line chart — no libraries. opts: {avg, labels} */
function weightChart(es, h, opts){
  opts = opts || {};
  const w = 320, pad = 8;
  const vals = es.map(e=>e.w);
  let min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if (goalWeight > 0){ min = Math.min(min, goalWeight); max = Math.max(max, goalWeight); }
  if (max - min < 2){ const mid = (max+min)/2; min = mid-1; max = mid+1; }
  const t0 = ymdToDate(es[0].d).getTime();
  const t1 = ymdToDate(es[es.length-1].d).getTime();
  const spanT = Math.max(1, t1-t0);
  const px = e => pad + (ymdToDate(e.d).getTime()-t0)/spanT * (w-2*pad);
  const py = v => pad + (max-v)/(max-min) * (h-2*pad);
  const pctY = v => (py(v)/h)*100;

  let goalLine = '';
  if (goalWeight > 0 && goalWeight >= min && goalWeight <= max){
    const gy = py(goalWeight).toFixed(1);
    goalLine = '<line x1="'+pad+'" y1="'+gy+'" x2="'+(w-pad)+'" y2="'+gy+'" '+
      'stroke="#0f9d6b" stroke-width="1.5" stroke-dasharray="4 3" opacity=".85"></line>';
  }
  const rawPts = es.map(e=> px(e).toFixed(1)+','+py(e.w).toFixed(1)).join(' ');
  const rawStroke = opts.avg ? '#c9a8e0' : '#7a2fb0';
  const rawWidth  = opts.avg ? 1.5 : 2;
  let avgLine = '';
  if (opts.avg && es.length >= 3){
    const sm = smoothed(es);
    avgLine = '<polyline points="'+sm.map(e=>px(e).toFixed(1)+','+py(e.w).toFixed(1)).join(' ')+
      '" fill="none" stroke="#7a2fb0" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>';
  }
  const dotR = opts.avg ? 1.8 : 2.5;
  const dots = es.map(e=>'<circle cx="'+px(e).toFixed(1)+'" cy="'+py(e.w).toFixed(1)+
    '" r="'+dotR+'" fill="'+rawStroke+'"></circle>').join('');

  const box = document.createElement('div'); box.className='wchart';
  let labels = '';
  if (opts.labels){
    labels =
      '<span class="wcv" style="top:'+pctY(max).toFixed(1)+'%">'+max.toFixed(1)+'</span>'+
      '<span class="wcv" style="top:'+pctY(min).toFixed(1)+'%">'+min.toFixed(1)+'</span>'+
      (goalWeight > 0 && goalWeight >= min && goalWeight <= max
        ? '<span class="wcg" style="top:'+pctY(goalWeight).toFixed(1)+'%">goal '+goalWeight+'</span>' : '');
  }
  box.innerHTML =
    '<div class="wcplot" style="height:'+h+'px">'+
      '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" '+
      'style="width:100%;height:'+h+'px;overflow:visible">'+
      goalLine +
      '<polyline points="'+rawPts+'" fill="none" stroke="'+rawStroke+'" stroke-width="'+rawWidth+'" '+
      'stroke-linejoin="round" stroke-linecap="round"></polyline>' + avgLine + dots +
      '</svg>' + labels +
    '</div>'+
    '<div class="wcax"><span>'+ymdToDate(es[0].d).toLocaleDateString('en-US',{month:'short',day:'numeric'})+
    '</span><span>'+ymdToDate(es[es.length-1].d).toLocaleDateString('en-US',{month:'short',day:'numeric'})+'</span></div>';
  return box;
}

/* staple + common food estimator (offline fallback) — [regex, cal, protein] per unit */
const WORDNUM = { a:1, an:1, one:1, two:2, three:3, four:4, five:5, six:6, half:0.5 };
const FOODS = [
  [/premier|protein shake|\bshakes?\b/, 160, 30],
  [/oikos/, 120, 15], [/siggi/, 90, 15], [/greek yogurt/, 120, 16], [/\byogurt\b/, 110, 9],
  [/cottage cheese/, 90, 12],
  [/\beggs?\b/, 72, 6],
  [/deli turkey|\bturkey\b/, 35, 6],
  [/chicken/, 165, 31], [/steaks?/, 250, 26], [/ground beef|\bbeef\b/, 250, 22],
  [/salmon/, 230, 25], [/\btofu\b/, 90, 10],
  [/kerrygold|cheese sticks?|string cheese|\bcheese\b/, 80, 7],
  [/\bapples?\b/, 95, 0], [/\bbananas?\b/, 105, 1], [/berries|strawberr|blueberr/, 50, 1], [/\boranges?\b/, 62, 1],
  [/lesserevil|popcorn/, 150, 2],
  [/protein ice cream|halo top/, 100, 7], [/ice cream/, 250, 4],
  [/barilla|protein pasta/, 200, 14], [/\bpasta\b|spaghetti/, 200, 7],
  [/sara lee|\bbread\b|\btoast\b/, 70, 3], [/sister schubert|\brolls?\b/, 110, 3],
  [/kodiak|pancakes?|waffles?/, 110, 6],
  [/\brice\b/, 205, 4], [/\bquinoa\b/, 220, 8], [/potato(es)?/, 160, 4],
  [/almonds?|\bnuts\b|trail mix/, 170, 6], [/peanut butter|\bpb\b/, 190, 7],
  [/starbucks|shaken espresso|\blattes?\b/, 120, 8], [/\bcoffee\b/, 5, 0],
  [/\bmilk\b/, 100, 8],
  [/\bsalads?\b/, 180, 6], [/\btacos?\b/, 200, 10], [/burritos?|\bbowls?\b/, 450, 25],
  [/\bsandwich(es)?\b/, 350, 18], [/\bwraps?\b/, 300, 15],
  [/\bpizza\b/, 285, 12], [/\bburgers?\b/, 400, 24],
  [/v8/, 50, 0], [/la croix|sparkling/, 0, 0], [/bloom/, 5, 0],
  [/\bwater\b/, 0, 0]
];
function estimateLocal(text){
  const parts = text.toLowerCase().split(/,|\band\b|\bwith\b|\+|&/);
  let c=0, p=0, matched=0;
  parts.forEach(raw=>{
    const chunk = raw.trim(); if (!chunk) return;
    let qty = 1;
    const m = chunk.match(/^(\d+(?:\.\d+)?)\s*/);
    if (m) qty = parseFloat(m[1]);
    else { for (const w in WORDNUM){ if (chunk.indexOf(w+' ')===0){ qty=WORDNUM[w]; break; } } }
    const hit = FOODS.find(f=>f[0].test(chunk));
    if (hit){ c += qty*hit[1]; p += qty*hit[2]; matched++; }
  });
  return { c:Math.round(c), p:Math.round(p), matched };
}
/* your own most-logged items, newest macros wins — powers the quick-add chips */
/* add an already-costed item straight to today's log — no estimating step */
/* ---------- remembered nutrition, per single serving ----------
   A log entry carries q (how many), cu/pu (per-one calories/protein) and
   c/p (the totals actually eaten). Older entries have only c/p, so unitMacros
   treats those as one serving — nothing needs migrating. */
function unitMacros(e){
  const q = (+e.q > 0) ? +e.q : 1;
  const cu = (e.cu !== undefined && e.cu !== null) ? +e.cu : (+e.c || 0) / q;
  const pu = (e.pu !== undefined && e.pu !== null) ? +e.pu : (+e.p || 0) / q;
  return { q:q, cu:cu, pu:pu };
}
function memKey(n){ return String(n || '').trim().toLowerCase().replace(/\s+/g,' '); }
let foodMem = {};
try { foodMem = JSON.parse(localStorage.getItem('mwl-foodmem') || '{}'); } catch(e){ foodMem = {}; }
function saveFoodMem(){ localStorage.setItem('mwl-foodmem', JSON.stringify(foodMem)); }
function rememberFood(n, cu, pu){
  const k = memKey(n); if (!k) return;
  foodMem[k] = { n:String(n).trim(), c:Math.round(cu), p:Math.round(pu) };
  saveFoodMem();
}
function recallFood(n){ return foodMem[memKey(n)] || null; }

/* Seed the memory from everything already logged, so foods you've eaten before
   are recognised straight away rather than after logging them once more. */
if (!localStorage.getItem('mwl-foodmem-seed-v1')){
  Object.keys(food).sort().forEach(d=>{
    (food[d] || []).forEach(e=>{
      if (!e.n || e.st === 'pending' || e.c === null || e.c === undefined) return;
      const u = unitMacros(e);
      foodMem[memKey(e.n)] = { n:String(e.n).trim(), c:Math.round(u.cu), p:Math.round(u.pu) };
    });
  });
  saveFoodMem();
  localStorage.setItem('mwl-foodmem-seed-v1','1');
}

/* accepts 2, 2.5, .5, 1/2, 1 1/2 — returns null if it isn't a usable amount */
function parseQty(s){
  if (s === null || s === undefined) return null;
  s = String(s).trim();
  if (!s) return 1;
  let m = s.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if (m){ const d = +m[3]; if (!d) return null; return +m[1] + (+m[2]) / d; }
  m = s.match(/^(\d*\.?\d*)\s*\/\s*(\d*\.?\d+)$/);
  if (m && m[1] !== ''){ const d = parseFloat(m[2]); if (!d) return null; return parseFloat(m[1]) / d; }
  const v = parseFloat(s);
  if (isNaN(v) || v <= 0) return null;
  return v;
}
function fmtQty(q){
  const r = Math.round(q * 100) / 100;
  if (Math.abs(r - 0.5) < 1e-9) return '½';
  if (Math.abs(r - 0.25) < 1e-9) return '¼';
  if (Math.abs(r - 0.75) < 1e-9) return '¾';
  if (Math.abs(r - 1.5) < 1e-9) return '1½';
  return String(r);
}

function addLoggedFood(item, qty){
  const q = (qty && qty > 0) ? qty : 1;
  const list = foodLog(foodDay).slice();
  list.push({ n:item.n, q:q, cu:item.c, pu:item.p,
    c:Math.round(item.c * q), p:Math.round(item.p * q), st:'done', src:'quick' });
  food[foodDay] = list; saveFood(); render();
}
function frequentFoods(n){
  const seen = {};
  Object.keys(food).forEach(d=>{
    (food[d]||[]).forEach(e=>{
      if (!e.n || e.st === 'pending' || e.c === null) return;
      const key = memKey(e.n);
      const u = unitMacros(e);
      if (!seen[key]) seen[key] = { n:e.n.trim(), c:Math.round(u.cu), p:Math.round(u.pu), count:0, last:'' };
      seen[key].count++;
      if (d >= seen[key].last){ seen[key].last = d;
        seen[key].c = Math.round(u.cu); seen[key].p = Math.round(u.pu); }
    });
  });
  /* a value you confirmed by hand beats one derived from an old entry */
  Object.keys(seen).forEach(k=>{ const m = foodMem[k]; if (m){ seen[k].c = m.c; seen[k].p = m.p; } });
  return Object.keys(seen).map(k=>seen[k])
    .filter(x=>x.count >= 2)
    .sort((a,b)=> b.count - a.count || (b.last < a.last ? -1 : 1))
    .slice(0, n);
}
function estimateEntry(text){
  if (window.cowork && typeof window.cowork.askClaude === 'function'){
    return window.cowork.askClaude(
      'Estimate total calories and grams of protein for this food. Reply with ONLY compact JSON like {"cal":320,"protein":24}. Food: '+text, [])
      .then(res=>{
        const s = typeof res==='string' ? res : (res && (res.text||res.content||JSON.stringify(res)));
        const mm = s && s.match(/\{[^}]*\}/);
        if (mm){ const o = JSON.parse(mm[0]);
          if (typeof o.cal==='number' && typeof o.protein==='number')
            return { c:Math.round(o.cal), p:Math.round(o.protein), src:'ai' }; }
        return Object.assign(estimateLocal(text), {src:'local'});
      })
      .catch(()=> Object.assign(estimateLocal(text), {src:'local'}));
  }
  return Promise.resolve(Object.assign(estimateLocal(text), {src:'local'}));
}

  const proCls = pro>=PRO_FLOOR?'good':'neutral';

  const left = CAL_MAX - cal;

    '<div class="fring"><div class="fv '+calCls+'">'+cal+'</div>'+

    '<div class="fring"><div class="fv '+proCls+'">'+pro+'g</div>'+
      '<div class="fg tgt" data-edit="pro" title="Tap to change your protein floor">floor '+PRO_FLOOR+'g</div>'+
      '<div class="fbar"><i style="width:'+proPct+'%;background:'+(pro>=PRO_FLOOR?'#0f9d6b':'#7a2fb0')+'"></i></div><div class="fl">protein</div></div>'+
    '<div class="fring"><div class="fv neutral">'+(left>=0?left:('+'+(-left)))+'</div><div class="fg">'+(left>=0?'to '+CAL_MAX:'over')+'</div>'+
      '<div class="fbar"></div><div class="fl">cal left</div></div>';
  rings.querySelector('[data-edit=cal]').onclick = editCalTarget;
  rings.querySelector('[data-edit=pro]').onclick = editProTarget;
  wrap.appendChild(rings);

  const r10 = pro>0 ? (cal/pro) : 0;

  if (pro===0){ r10el.style.background='var(--accent-soft)'; r10el.style.color='var(--accent)';
    r10el.textContent = 'Rule of 10 — log some protein to see it'; }
  else if (r10 <= 10){ r10el.style.background='#e4f6ee'; r10el.style.color='#0f7a52';
    r10el.textContent = 'Rule of 10: '+r10.toFixed(1)+' — under 10, good food quality'; }
  else { r10el.style.background='#fbe9f0'; r10el.style.color='#a3245a';
    r10el.textContent = 'Rule of 10: '+r10.toFixed(1)+' — over 10, lean more protein-dense'; }

  /* ---- weigh-in (logs against whichever day the date nav is on) ---- */

  wIn.onblur = ()=>{
    const v = parseFloat(wIn.value);
    if (wIn.value !== '' && v > 0){
      const others = weightEntries().filter(e=>e.d !== foodDay);
      const prev = others.length ? others[others.length-1] : null;
      const wild = v < 50 || v > 700;

        const msg = 'That reads as ' + v + ' lbs' +

  /* ---- Your go-tos: everything you log repeatedly, one tap to add ---- */
  const gotos = frequentFoods(30);
  const gCard = document.createElement('section'); gCard.className='pcard';
  const gHead = document.createElement('h3');
  gHead.textContent = gotos.length ? 'Your go-tos · ' + gotos.length : 'Your go-tos';
  gCard.appendChild(gHead);
  if (!gotos.length){
    const em = document.createElement('div'); em.className='exnote';
    em.textContent = 'Anything you log twice or more shows up here, with its calories and protein remembered — so repeat meals become one tap.';
    gCard.appendChild(em);
  } else {
    const gl = document.createElement('div'); gl.className='gtlist';
    gotos.forEach(u=>{
      const b = document.createElement('button'); b.className='gtrow';
      const nm = document.createElement('span'); nm.className='gtn'; nm.textContent = u.n;
      const mc = document.createElement('span'); mc.className='gtm';
      mc.textContent = u.c + ' cal · ' + u.p + 'g';
      const cnt = document.createElement('span'); cnt.className='gtc';
      cnt.textContent = '×' + u.count;
      const plus = document.createElement('span'); plus.className='gtx'; plus.textContent = '+';
      b.appendChild(nm); b.appendChild(cnt); b.appendChild(mc); b.appendChild(plus);
      b.title = 'Logged ' + u.count + ' times — tap to add to today';

    gCard.appendChild(gl);
    const gn = document.createElement('div'); gn.className='exnote';
    gn.textContent = 'Sorted by how often you log it. Tap to add — the numbers come from the last time you logged it.';
    gCard.appendChild(gn);
  }
  wrap.appendChild(gCard);

  const logCard = document.createElement('section'); logCard.className='pcard flog';
  logCard.innerHTML = '<h3>Food log</h3>';
  const nIn = document.createElement('input'); nIn.type='text'; nIn.className='fn';
  nIn.placeholder='What did you eat? e.g. Oikos shake';
  nIn.style.width='100%'; nIn.style.marginBottom='8px';
  logCard.appendChild(nIn);

  const qRow = document.createElement('div'); qRow.className='qrow';
  const qLbl = document.createElement('span'); qLbl.className='qlbl'; qLbl.textContent='How many';
  const qIn = document.createElement('input'); qIn.type='text'; qIn.className='qin';
  qIn.placeholder='1'; qIn.setAttribute('inputmode','decimal');
  qIn.title = 'Whole or partial — 2, 0.5 and 1/2 all work';
  const memHint = document.createElement('span'); memHint.className='qmem';
  function refreshHint(){
    const m = recallFood(nIn.value);
    memHint.textContent = m ? 'remembered: ' + m.c + ' cal · ' + m.p + 'g each' : '';
  }
  nIn.oninput = refreshHint; refreshHint();
  qRow.appendChild(qLbl); qRow.appendChild(qIn); qRow.appendChild(memHint);
  logCard.appendChild(qRow);

  const addBtn = document.createElement('button'); addBtn.className='fadd'; addBtn.textContent='Log it';
  function addFood(){
    const nm = nIn.value.trim(); if (!nm) return;
    const q = parseQty(qIn.value);
    if (q === null){ alert('How many? Try a number like 2, 0.5 or 1/2.'); return; }
    const list = foodLog(foodDay).slice();
    const mem = recallFood(nm);
    if (mem){
      /* already known — no estimating step, and the amount scales it */
      list.push({ n:nm, q:q, cu:mem.c, pu:mem.p,
        c:Math.round(mem.c * q), p:Math.round(mem.p * q), st:'done', src:'memory' });
      food[foodDay] = list; saveFood();
      nIn.value=''; qIn.value=''; burstAt(addBtn,false); render();
      return;
    }
    list.push({ n:nm, q:q, c:null, p:null, st:'pending' });
    food[foodDay] = list; saveFood();
    nIn.value=''; qIn.value=''; burstAt(addBtn,false); render();
    estimateEntry(nm).then(r=>{
      const cur = foodLog(foodDay).slice();
      const idx = cur.findIndex(x=>x.n===nm && x.st==='pending');
      if (idx>=0){
        cur[idx] = { n:nm, q:q, cu:r.c, pu:r.p,
          c:Math.round(r.c * q), p:Math.round(r.p * q), st:'done', src:r.src };
        food[foodDay]=cur; saveFood();
        rememberFood(nm, r.c, r.p);
        if (view==='food') render();
      }
    });
  }
  addBtn.onclick = addFood;
  nIn.onkeydown = (e)=>{ if (e.key==='Enter') addFood(); };
  qIn.onkeydown = (e)=>{ if (e.key==='Enter') addFood(); };
  logCard.appendChild(addBtn);

  const yKey = shiftYmd(foodDay, -1);
  const yLog = (food[yKey] || []).filter(e=>e.st !== 'pending' && e.c !== null);
  if (yLog.length && !log.length){
    const cy = document.createElement('button'); cy.className='wbtn';
    cy.style.cssText = 'width:100%;margin:4px 0 2px;';
    const yCal = yLog.reduce((s,e)=>s+(+e.c||0),0);
    cy.textContent = 'Copy the previous day (' + yLog.length + ' items · ' + yCal + ' cal)';
    cy.onclick = ()=>{
      const list = foodLog(foodDay).slice();
      yLog.forEach(e=>{ const u = unitMacros(e);
        list.push({ n:e.n, q:u.q, cu:u.cu, pu:u.pu, c:e.c, p:e.p, st:'done', src:'copy' }); });
      food[foodDay] = list; saveFood(); burstAt(cy,false); render();
    };
    logCard.appendChild(cy);
  }

  log.forEach((e,i)=>{
    const u = unitMacros(e);
    const it = document.createElement('div'); it.className='fitem';
    const nm = document.createElement('span'); nm.className='fnm'; nm.textContent = e.n;
    it.appendChild(nm);

    if (e.st !== 'pending'){
      const qb = document.createElement('button'); qb.className='fq';
      qb.textContent = fmtQty(u.q) + '×';
      qb.title = 'Change how many — this rescales the numbers';
      qb.onclick = ()=>{
        const v = prompt('How many "'+e.n+'"?\n\n2, 0.5 and 1/2 all work.', fmtQty(u.q));
        if (v === null) return;
        const nq = parseQty(v);
        if (nq === null){ alert('Try a number like 2, 0.5 or 1/2.'); return; }
        const cur = foodLog(foodDay).slice();
        cur[i] = { n:e.n, q:nq, cu:u.cu, pu:u.pu,
          c:Math.round(u.cu * nq), p:Math.round(u.pu * nq), st:'done', src:e.src || 'qty' };
        food[foodDay] = cur; saveFood(); render();
      };
      it.appendChild(qb);
    }

    const mac = document.createElement('span'); mac.className='fmac';
    if (e.st==='pending'){ mac.textContent = 'estimating…'; }
    else {
      mac.textContent = '≈ '+(e.c||0)+' cal · '+(e.p||0)+'g';
      mac.style.cursor='pointer';
      mac.title = 'Tap to correct — it will be remembered for next time';
      mac.onclick = ()=>{
        const many = fmtQty(u.q);
        const one = Math.abs(u.q - 1) < 1e-9;
        const cc = prompt('Calories for '+(one?'':many+' × ')+'"'+e.n+'"', e.c||0);
        if (cc===null) return;
        const pp = prompt('Protein grams for '+(one?'':many+' × ')+'"'+e.n+'"', e.p||0);
        if (pp===null) return;
        const ctot = Math.round(+cc||0), ptot = Math.round(+pp||0);
        const cu = ctot / u.q, pu = ptot / u.q;
        const cur = foodLog(foodDay).slice();
        cur[i] = { n:e.n, q:u.q, cu:cu, pu:pu, c:ctot, p:ptot, st:'done', src:'edit' };
        food[foodDay]=cur; saveFood();
        rememberFood(e.n, cu, pu);   /* correcting it once teaches it for good */
        render();
      };
    }
    it.appendChild(mac);

    const x = document.createElement('button'); x.className='fx'; x.innerHTML='&times;';
    x.onclick = ()=>{ const list=foodLog(foodDay).slice(); list.splice(i,1); food[foodDay]=list; saveFood(); render(); };
    it.appendChild(x);
    logCard.appendChild(it);
  });
  if (!log.length){
    const em = document.createElement('div'); em.className='exnote';
    em.textContent = 'Write what you ate in plain words. Anything you’ve logged before is remembered, so it fills in instantly — and the amount box handles half or double portions. Tap any estimate to correct it once and it sticks.';
    logCard.appendChild(em);
  }
  wrap.appendChild(logCard);
}

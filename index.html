  wHead.textContent = isToday ? 'Weigh-in' : 'Weigh-in · ' + lbl.textContent;
  wCard.appendChild(wHead);
  const wRow = document.createElement('div'); wRow.className='weighrow';
  const wIn = document.createElement('input'); wIn.type='number'; wIn.step='0.1'; wIn.min='0';
  wIn.placeholder='lbs'; wIn.value = weights[foodDay] || '';
  wIn.oninput = ()=>{
    if (wIn.value === '') delete weights[foodDay];
    else weights[foodDay] = parseFloat(wIn.value);
    saveWeights();
  };
  /* catch fat-fingered entries before they wreck the chart */
  wIn.onblur = ()=>{
    const v = parseFloat(wIn.value);
    if (wIn.value !== '' && v > 0){
      const others = weightEntries().filter(e=>e.d !== foodDay);
      const prev = others.length ? others[others.length-1] : null;
      const wild = v < 50 || v > 700;
      const jumpy = prev && Math.abs(v - prev.w) > 25;
      if (wild || jumpy){
        const msg = 'That reads as ' + v + ' lbs' +
          (jumpy ? ' — a ' + Math.abs(v-prev.w).toFixed(1) + ' lb jump from your last weigh-in of ' + prev.w : '') +
          '. Keep it?';
        if (!confirm(msg)){ delete weights[foodDay]; saveWeights(); render(); return; }
      }
    }
    if (view==='food') render();
  };
  const wUnit = document.createElement('span'); wUnit.className='wunit'; wUnit.textContent='lbs';
  const gBtn = document.createElement('button'); gBtn.className='wbtn'; gBtn.style.marginLeft='auto';
  gBtn.textContent = goalWeight > 0 ? 'Goal ' + goalWeight + ' lbs' : 'Set a goal';
  gBtn.onclick = ()=>{
    const v = prompt('Goal weight in lbs (leave blank to clear):', goalWeight || '');
    if (v === null) return;
    if (v.trim() === ''){ setGoalWeight(0); render(); return; }
    const n = parseFloat(v); if (!n || n <= 0) return;
    setGoalWeight(n); render();
  };
  wRow.appendChild(wIn); wRow.appendChild(wUnit); wRow.appendChild(gBtn);
  wCard.appendChild(wRow);

  const wt = weightTrend();
  if (!wt){
    const em = document.createElement('div'); em.className='exnote';
    em.textContent = 'Log your weight a few mornings and this starts showing your trend — it averages a week at a time, so a single heavy morning won’t spook you.';
    wCard.appendChild(em);
  } else {
    const stats = document.createElement('div'); stats.className='wstats';
    const rateTxt = wt.rate === null ? '—' : fmtDelta(wt.rate);
    const totTxt = fmtDelta(wt.total);
    stats.innerHTML =
      '<div class="wstat"><div class="wsv">'+wt.latest.w.toFixed(1)+'</div><div class="wsl">latest</div></div>'+
      '<div class="wstat"><div class="wsv">'+rateTxt+'</div><div class="wsl">lbs / week</div></div>'+
      '<div class="wstat"><div class="wsv">'+totTxt+'</div><div class="wsl">since start</div></div>';
    wCard.appendChild(stats);

    /* ---- chart: compact sparkline that unfurls into the full view ---- */
    if (wt.es.length >= 2){
      const toggle = document.createElement('button'); toggle.className='wctoggle';
      toggle.innerHTML = '<span class="wccar">'+(chartOpen?'&#9662;':'&#9656;')+'</span> ' +
        (chartOpen ? 'Hide chart' : 'Show full chart');
      toggle.onclick = ()=>{
        chartOpen = !chartOpen;
        localStorage.setItem('mwl-chartopen', chartOpen ? '1' : '0');
        render();
      };

      if (!chartOpen){
        const spark = weightChart(wt.es, 62);
        spark.classList.add('wcmini');
        spark.onclick = ()=>{ chartOpen = true; localStorage.setItem('mwl-chartopen','1'); render(); };
        spark.title = 'Tap to expand';
        wCard.appendChild(spark);
        wCard.appendChild(toggle);
      } else {
        wCard.appendChild(toggle);
        const ranges = document.createElement('div'); ranges.className='wcranges';
        [['30','30 days'],['90','3 months'],['all','All']].forEach(([val,label])=>{
          const b = document.createElement('button');
          b.textContent = label;
          if (val === chartRange) b.className = 'on';
          b.onclick = ()=>{ chartRange = val; localStorage.setItem('mwl-chartrange', val); render(); };
          ranges.appendChild(b);
        });
        wCard.appendChild(ranges);

        const sub = entriesInRange(wt.es, chartRange);
        if (sub.length >= 2){
          wCard.appendChild(weightChart(sub, 168, { avg:true, labels:true }));
          const lg = document.createElement('div'); lg.className='wclegend';
          lg.innerHTML = '<span><i class="lraw"></i>daily</span>' +
            '<span><i class="lavg"></i>7-day average</span>' +
            (goalWeight > 0 ? '<span><i class="lgoal"></i>goal</span>' : '');
          wCard.appendChild(lg);
          const rr = sub[sub.length-1].w - sub[0].w;
          const rn = document.createElement('div'); rn.className='exnote';
          rn.textContent = fmtDelta(rr) + ' lbs across the ' + sub.length +
            ' weigh-in' + (sub.length===1?'':'s') + ' shown.';
          wCard.appendChild(rn);
        } else {
          const em2 = document.createElement('div'); em2.className='exnote';
          em2.textContent = 'Not enough weigh-ins in this range yet — try a wider one.';
          wCard.appendChild(em2);
        }
      }
    }

    /* ---- editable list, so a typo is easy to find and fix ---- */
    const listBtn = document.createElement('button'); listBtn.className='wctoggle';
    listBtn.innerHTML = '<span class="wccar">'+(wlistOpen?'&#9662;':'&#9656;')+'</span> ' +
      (wlistOpen ? 'Hide all weigh-ins' : 'All weigh-ins (' + wt.count + ')');
    listBtn.onclick = ()=>{
      wlistOpen = !wlistOpen;
      localStorage.setItem('mwl-wlistopen', wlistOpen ? '1' : '0');
      render();
    };
    wCard.appendChild(listBtn);
    if (wlistOpen){
      const list = document.createElement('div'); list.className='wlist';
      wt.es.slice().reverse().forEach(e=>{
        const row = document.createElement('div'); row.className='wlrow';
        const dt = document.createElement('span'); dt.className='wld';
        dt.textContent = ymdToDate(e.d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
        const val = document.createElement('button'); val.className='wlv';
        val.textContent = e.w.toFixed(1) + ' lbs';
        val.title = 'Tap to edit';
        val.onclick = ()=>{
          const v = prompt('Weight for ' + dt.textContent + ' (blank to delete):', e.w);
          if (v === null) return;
          if (v.trim() === ''){ delete weights[e.d]; saveWeights(); render(); return; }
          const n = parseFloat(v);
          if (!n || n <= 0) return;
          weights[e.d] = n; saveWeights(); render();
        };
        const del = document.createElement('button'); del.className='wlx'; del.innerHTML='&times;';
        del.title = 'Delete this weigh-in';
        del.onclick = ()=>{
          if (!confirm('Delete the ' + e.w.toFixed(1) + ' lb weigh-in from ' + dt.textContent + '?')) return;
          delete weights[e.d]; saveWeights(); render();
        };
        row.appendChild(dt); row.appendChild(val); row.appendChild(del);
        list.appendChild(row);
      });
      wCard.appendChild(list);
    }
    const note = document.createElement('div'); note.className='exnote';
    if (wt.rate === null){
      note.textContent = 'Need about two weeks of weigh-ins before a weekly rate means much. Keep logging.';
    } else if (goalWeight > 0){
      const togo = wt.latest.w - goalWeight;
      if (togo <= 0){
        note.textContent = 'You’re at or past your ' + goalWeight + ' lb goal.';
      } else if (wt.rate < -0.2){
        note.textContent = togo.toFixed(1) + ' lbs to your goal — about ' +
          Math.ceil(togo / Math.abs(wt.rate)) + ' weeks at your current pace.';
      } else {
        note.textContent = togo.toFixed(1) + ' lbs to your goal. The trend is flat right now, so no ETA yet.';
      }
    }
    if (note.textContent) wCard.appendChild(note);
  }
  wrap.appendChild(wCard);

  const calLeft = CAL_MAX - cal, proNeed = Math.max(0, PRO_FLOOR - pro);
  const sugCard = document.createElement('section'); sugCard.className='pcard';
  sugCard.innerHTML = '<h3>What to eat next</h3>';
  const sugMsg = document.createElement('div'); sugMsg.className='exnote'; sugMsg.style.padding='0 0 8px';
  if (calLeft <= 0){
    sugMsg.textContent = proNeed>0
      ? 'At (or past) today’s calorie target and still '+proNeed+'g protein short — keep anything extra light and protein-forward.'
      : 'At (or past) today’s calorie target. Nice work.';
  } else if (proNeed > 0){
    sugMsg.textContent = calLeft+' cal left and '+proNeed+'g protein to go today — try:';
  } else {
    sugMsg.textContent = 'Protein floor already hit, '+calLeft+' cal left — spend it however you like. A few options:';
  }
  sugCard.appendChild(sugMsg);
  suggestFood(calLeft).forEach(f=>{
    const row = document.createElement('div'); row.className='fitem';
    row.innerHTML = '<span class="fnm">'+f.n+'</span><span class="fmac">≈ '+f.c+' cal · '+f.p+'g</span>';
    sugCard.appendChild(row);
  });
  wrap.appendChild(sugCard);

  const weekCard = document.createElement('section'); weekCard.className='pcard';
  weekCard.innerHTML = '<h3>Dinners left this week</h3>';
  const todayDow = dowKey(new Date(now));
  const upcoming = DAYS.slice(DAYS.indexOf(todayDow));
  let anyMeal = false;
  upcoming.forEach(dn=>{
    const m = getMeal(dn); if (m) anyMeal = true;
    const row = document.createElement('div'); row.className='mealrow';
    row.innerHTML = '<span class="mealday">'+dn+'</span><span>'+(m || '<span class="pullempty">not set</span>')+'</span>';
    weekCard.appendChild(row);
  });
  if (!anyMeal){
    const em = document.createElement('div'); em.className='exnote'; em.style.paddingTop='8px';
    em.textContent = 'Set dinners in the Plan tab and they’ll show here as a reminder of what to grab.';
    weekCard.appendChild(em);
  }
  wrap.appendChild(weekCard);

  /* ---- Your go-tos: everything you log repeatedly, one tap to add ---- */
  const gotos = frequentFoods(30);
  const gCard = document.createElement('section'); gCard.className='pcard';
  const gHead = document.createElement('h3');
  gHead.textContent = gotos.length ? 'Your go-tos · ' + gotos.length : 'Your go-tos';
  gCard.appendChild(gHead);
  if (!gotos.length){
    const em = document.createElement('div'); em.className='exnote';
    em.textContent = 'Anything you log twice or more shows up here, with its calories and protein remembered — so repeat meals become one tap.';
    gCard.appendChild(em);
  } else {
    const gl = document.createElement('div'); gl.className='gtlist';
    gotos.forEach(u=>{
      const b = document.createElement('button'); b.className='gtrow';
      const nm = document.createElement('span'); nm.className='gtn'; nm.textContent = u.n;
      const mc = document.createElement('span'); mc.className='gtm';
      mc.textContent = u.c + ' cal · ' + u.p + 'g';
      const cnt = document.createElement('span'); cnt.className='gtc';
      cnt.textContent = '×' + u.count;
      const plus = document.createElement('span'); plus.className='gtx'; plus.textContent = '+';
      b.appendChild(nm); b.appendChild(cnt); b.appendChild(mc); b.appendChild(plus);
      b.title = 'Logged ' + u.count + ' times — tap to add to today';
      b.onclick = ()=>{ burstAt(b,false); addLoggedFood(u); };
      gl.appendChild(b);
    });
    gCard.appendChild(gl);
    const gn = document.createElement('div'); gn.className='exnote';
    gn.textContent = 'Sorted by how often you log it. Tap to add — the numbers come from the last time you logged it.';
    gCard.appendChild(gn);
  }
  wrap.appendChild(gCard);

  const logCard = document.createElement('section'); logCard.className='pcard flog';
  logCard.innerHTML = '<h3>Food log</h3>';
  const nIn = document.createElement('input'); nIn.type='text'; nIn.className='fn';
  nIn.placeholder='What did you eat? e.g. Oikos shake';
  nIn.style.width='100%'; nIn.style.marginBottom='8px';
  logCard.appendChild(nIn);

  const qRow = document.createElement('div'); qRow.className='qrow';
  const qLbl = document.createElement('span'); qLbl.className='qlbl'; qLbl.textContent='How many';
  const qIn = document.createElement('input'); qIn.type='text'; qIn.className='qin';
  qIn.placeholder='1'; qIn.setAttribute('inputmode','decimal');
  qIn.title = 'Whole or partial — 2, 0.5 and 1/2 all work';
  const memHint = document.createElement('span'); memHint.className='qmem';
  function refreshHint(){
    const m = recallFood(nIn.value);
    memHint.textContent = m ? 'remembered: ' + m.c + ' cal · ' + m.p + 'g each' : '';
  }
  nIn.oninput = refreshHint; refreshHint();
  qRow.appendChild(qLbl); qRow.appendChild(qIn); qRow.appendChild(memHint);
  logCard.appendChild(qRow);

  const addBtn = document.createElement('button'); addBtn.className='fadd'; addBtn.textContent='Log it';
  function addFood(){
    const nm = nIn.value.trim(); if (!nm) return;
    const q = parseQty(qIn.value);
    if (q === null){ alert('How many? Try a number like 2, 0.5 or 1/2.'); return; }
    const list = foodLog(foodDay).slice();
    const mem = recallFood(nm);
    if (mem){
      /* already known — no estimating step, and the amount scales it */
      list.push({ n:nm, q:q, cu:mem.c, pu:mem.p,
        c:Math.round(mem.c * q), p:Math.round(mem.p * q), st:'done', src:'memory' });
      food[foodDay] = list; saveFood();
      nIn.value=''; qIn.value=''; burstAt(addBtn,false); render();
      return;
    }
    list.push({ n:nm, q:q, c:null, p:null, st:'pending' });
    food[foodDay] = list; saveFood();
    nIn.value=''; qIn.value=''; burstAt(addBtn,false); render();
    estimateEntry(nm).then(r=>{
      const cur = foodLog(foodDay).slice();
      const idx = cur.findIndex(x=>x.n===nm && x.st==='pending');
      if (idx>=0){
        cur[idx] = { n:nm, q:q, cu:r.c, pu:r.p,
          c:Math.round(r.c * q), p:Math.round(r.p * q), st:'done', src:r.src };
        food[foodDay]=cur; saveFood();
        rememberFood(nm, r.c, r.p);
        if (view==='food') render();
      }
    });
  }
  addBtn.onclick = addFood;
  nIn.onkeydown = (e)=>{ if (e.key==='Enter') addFood(); };
  qIn.onkeydown = (e)=>{ if (e.key==='Enter') addFood(); };
  logCard.appendChild(addBtn);

  const yKey = shiftYmd(foodDay, -1);
  const yLog = (food[yKey] || []).filter(e=>e.st !== 'pending' && e.c !== null);
  if (yLog.length && !log.length){
    const cy = document.createElement('button'); cy.className='wbtn';
    cy.style.cssText = 'width:100%;margin:4px 0 2px;';
    const yCal = yLog.reduce((s,e)=>s+(+e.c||0),0);
    cy.textContent = 'Copy the previous day (' + yLog.length + ' items · ' + yCal + ' cal)';
    cy.onclick = ()=>{
      const list = foodLog(foodDay).slice();
      yLog.forEach(e=>{ const u = unitMacros(e);
        list.push({ n:e.n, q:u.q, cu:u.cu, pu:u.pu, c:e.c, p:e.p, st:'done', src:'copy' }); });
      food[foodDay] = list; saveFood(); burstAt(cy,false); render();
    };
    logCard.appendChild(cy);
  }

  log.forEach((e,i)=>{
    const u = unitMacros(e);
    const it = document.createElement('div'); it.className='fitem';
    const nm = document.createElement('span'); nm.className='fnm'; nm.textContent = e.n;
    it.appendChild(nm);

    if (e.st !== 'pending'){
      const qb = document.createElement('button'); qb.className='fq';
      qb.textContent = fmtQty(u.q) + '×';
      qb.title = 'Change how many — this rescales the numbers';
      qb.onclick = ()=>{
        const v = prompt('How many "'+e.n+'"?\n\n2, 0.5 and 1/2 all work.', fmtQty(u.q));
        if (v === null) return;
        const nq = parseQty(v);
        if (nq === null){ alert('Try a number like 2, 0.5 or 1/2.'); return; }
        const cur = foodLog(foodDay).slice();
        cur[i] = { n:e.n, q:nq, cu:u.cu, pu:u.pu,
          c:Math.round(u.cu * nq), p:Math.round(u.pu * nq), st:'done', src:e.src || 'qty' };
        food[foodDay] = cur; saveFood(); render();
      };
      it.appendChild(qb);
    }

    const mac = document.createElement('span'); mac.className='fmac';
    if (e.st==='pending'){ mac.textContent = 'estimating…'; }
    else {
      mac.textContent = '≈ '+(e.c||0)+' cal · '+(e.p||0)+'g';
      mac.style.cursor='pointer';
      mac.title = 'Tap to correct — it will be remembered for next time';
      mac.onclick = ()=>{
        const many = fmtQty(u.q);
        const one = Math.abs(u.q - 1) < 1e-9;
        const cc = prompt('Calories for '+(one?'':many+' × ')+'"'+e.n+'"', e.c||0);
        if (cc===null) return;
        const pp = prompt('Protein grams for '+(one?'':many+' × ')+'"'+e.n+'"', e.p||0);
        if (pp===null) return;
        const ctot = Math.round(+cc||0), ptot = Math.round(+pp||0);
        const cu = ctot / u.q, pu = ptot / u.q;
        const cur = foodLog(foodDay).slice();
        cur[i] = { n:e.n, q:u.q, cu:cu, pu:pu, c:ctot, p:ptot, st:'done', src:'edit' };
        food[foodDay]=cur; saveFood();
        rememberFood(e.n, cu, pu);   /* correcting it once teaches it for good */
        render();
      };
    }
    it.appendChild(mac);

    const x = document.createElement('button'); x.className='fx'; x.innerHTML='&times;';
    x.onclick = ()=>{ const list=foodLog(foodDay).slice(); list.splice(i,1); food[foodDay]=list; saveFood(); render(); };
    it.appendChild(x);
    logCard.appendChild(it);
  });
  if (!log.length){
    const em = document.createElement('div'); em.className='exnote';
    em.textContent = 'Write what you ate in plain words. Anything you’ve logged before is remembered, so it fills in instantly — and the amount box handles half or double portions. Tap any estimate to correct it once and it sticks.';
    logCard.appendChild(em);
  }
  wrap.appendChild(logCard);
}

/* ================= work =================
   The standing weekly list is yours to edit now. Each item carries its own id
   so renaming, reordering or deleting one never shuffles another's checkmark. */
const WORK_WEEK_SEED = {
  Mon: [
    { t:'Prep for L10', sub:['Pull scorecard data','Review to-do list','Prioritize issues'] },
    'Review ads', 'Review ads', 'Plan week', "Sassy's 1:1"
  ],
  Tue: ['Select featured newsletter story','Submit write-in options for the app','Review ads','Review ads','Edit Main Newsletter'],
  Wed: ['Review Decaf','Review ads','Review ads','Bailey 1:1','Peter 1:1','KA 1:1','1:1 with Nate'],
  Thu: ['Select featured newsletter story','Submit write-in options for the app','Review ads','Review ads','Edit Main Newsletter','Choose TPOE Topic and announce to team','Pull TPOE top-clicked data','Review TPOE Newsletter',"Steph's 1:1"],
  Fri: ['Edit/link TPOE Crossword','Record TPOE Podcast','Final review of TPOE Newsletter','Review ads','Review ads'],
  Sat: ['Story Selection','Set featured story'],
  Sun: []
};
const WORK_STANDING_SEED = ['Review Praying the News','Review News Health'];
let wkSeq = 0;
function newWorkId(){ return 'w'+Date.now().toString(36)+(wkSeq++).toString(36); }

let workweek = null, workstanding = null;
try { workweek = JSON.parse(localStorage.getItem('mwl-workweek') || 'null'); } catch(e){ workweek = null; }
try { workstanding = JSON.parse(localStorage.getItem('mwl-workstanding') || 'null'); } catch(e){ workstanding = null; }
function saveWorkWeek(){ localStorage.setItem('mwl-workweek', JSON.stringify(workweek)); }
function saveWorkStanding(){ localStorage.setItem('mwl-workstanding', JSON.stringify(workstanding)); }

if (!workweek || typeof workweek !== 'object'){
  workweek = {};
  const carry = {};                       /* old positional key -> new id key */
  DAYS.forEach(dn=>{
    workweek[dn] = (WORK_WEEK_SEED[dn] || []).map((raw,i)=>{
      const src = typeof raw === 'string' ? { t:raw } : raw;
      const o = { id:newWorkId(), t:src.t };
      if (src.sub && src.sub.length){
        o.sub = src.sub.map((s,j)=>{
          const sub = { id:newWorkId(), t:s };
          carry['WKS|'+dn+'|'+i+'|'+j] = 'WKS|'+sub.id;
          return sub;
        });
      } else {
        carry['WK|'+dn+'|'+i] = 'WK|'+o.id;
      }
      return o;
    });
  });
  /* keep this week's ticks attached as the keys change shape */
  let moved = false;
  Object.keys(carry).forEach(oldK=>{
    if (state[oldK]){ state[carry[oldK]] = state[oldK]; delete state[oldK]; moved = true; }
  });
  if (moved) save();
  saveWorkWeek();
}
if (!Array.isArray(workstanding)){
  workstanding = WORK_STANDING_SEED.map((t,i)=>{
    const o = { id:newWorkId(), t:t };
    if (state['WKST|'+i]){ state['WKST|'+o.id] = true; delete state['WKST|'+i]; }
    if (state['WKST-T|'+i]){ state['WKST-T|'+o.id] = true; delete state['WKST-T|'+i]; }
    return o;
  });
  save(); saveWorkStanding();
}
let workDay = DAYS[now.getDay()];
let workEdit = false;

let worktasks = [];
try { worktasks = JSON.parse(localStorage.getItem('mwl-worktasks') || '[]'); } catch(e){ worktasks = []; }
if (!Array.isArray(worktasks)) worktasks = [];
function saveWork(){ localStorage.setItem('mwl-worktasks', JSON.stringify(worktasks)); }

let worklinks = [];
try { worklinks = JSON.parse(localStorage.getItem('mwl-worklinks') || 'null'); } catch(e){ worklinks = null; }
if (!Array.isArray(worklinks)) worklinks = [
  { label:'Monday.com', url:'https://monday.com' },
  { label:'Slack', url:'https://app.slack.com/client' }
];
function saveLinks(){ localStorage.setItem('mwl-worklinks', JSON.stringify(worklinks)); }
/* one-time: make sure Slack is present for existing users */
if (!localStorage.getItem('mwl-links-slack')){
  if (!worklinks.some(l=>/slack/i.test(l.label)))
    worklinks.push({ label:'Slack', url:'https://app.slack.com/client' });
  localStorage.setItem('mwl-links-slack','1'); saveLinks();
}

function workLeaves(day){
  const keys = [];
  (workweek[day]||[]).forEach(item=>{
    if (item.sub && item.sub.length) item.sub.forEach(s=> keys.push('WKS|'+s.id));
    else keys.push('WK|'+item.id);
  });
  return keys;
}
/* remove an item and any checkmarks it owned */
function dropWorkKeys(item){
  if (item.sub && item.sub.length) item.sub.forEach(s=>{ delete state['WKS|'+s.id]; });
  else delete state['WK|'+item.id];
}
function workRow(key, label, isSub, todayKey){
  const done = !!state[key];
  const today = todayKey ? !!state[todayKey] : false;
  const row = document.createElement('div');
  row.className='wtask'+(isSub?' sub':'')+(done?' done':'')+(today&&!done?' istoday':'');
  const cb = document.createElement('input'); cb.type='checkbox'; cb.checked=done;
  cb.onchange = ()=>{ state[key]=cb.checked; if(!cb.checked) delete state[key]; save();
    if (cb.checked) burstAt(cb,false); renderWork(); };
  const lb = document.createElement('span'); lb.className='wl'; lb.textContent=label;
  row.appendChild(cb); row.appendChild(lb);
  if (todayKey && !done){
    const pill = document.createElement('button'); pill.className='spill today'+(today?' on':'');
    pill.textContent='Today'; pill.title = today?'Remove from today':'Add to today';
    pill.onclick = ()=>{ if (state[todayKey]) delete state[todayKey]; else state[todayKey]=true; save();
      if (state[todayKey]) burstAt(pill,false); renderWork(); };
    row.appendChild(pill);
  }
  return row;
}
function renderWork(){
  const wrap = document.getElementById('workView'); wrap.innerHTML = '';

  const links = document.createElement('div');

    const tot = workLeaves(d).length;

    b.className = (d===workDay?'sel ':'') + (d===todayKey?'today ':'') + (tot&&pc===100?'full':'');

  const eb = document.createElement('button'); eb.className='wkedit'+(workEdit?' on':'');

  /* the ✎ ✕ ▲▼ cluster shown while editing */
  function editTools(opts){
    const box = document.createElement('span'); box.className='wktools';
    const mk = (glyph, title, fn, disabled)=>{
      const b = document.createElement('button'); b.className='wkt';
      b.innerHTML = glyph; b.title = title;
      if (disabled) b.disabled = true; else b.onclick = fn;
      return b;
    };
    if (opts.up)   box.appendChild(mk('&#9650;','Move up', opts.up, opts.upOff));
    if (opts.down) box.appendChild(mk('&#9660;','Move down', opts.down, opts.downOff));
    box.appendChild(mk('&#9998;','Rename', opts.rename));
    const del = mk('&times;','Delete', opts.del); del.classList.add('rm');
    box.appendChild(del);
    return box;
  }

  items.forEach((item,i)=>{
    const isParent = !!(item.sub && item.sub.length);
    if (isParent){
      const head = document.createElement('div'); head.className='worksubhead';
      const ht = document.createElement('span'); ht.textContent = item.t;
      head.appendChild(ht);
      if (workEdit) head.appendChild(editTools({
        up: ()=>{ items.splice(i-1,0,items.splice(i,1)[0]); saveWorkWeek(); renderWork(); }, upOff: i===0,
        down: ()=>{ items.splice(i+1,0,items.splice(i,1)[0]); saveWorkWeek(); renderWork(); }, downOff: i===items.length-1,
        rename: ()=>{ const v=prompt('Rename:', item.t); if (v && v.trim()){ item.t=v.trim(); saveWorkWeek(); renderWork(); } },
        del: ()=>{ if (!confirm('Delete "'+item.t+'" and its '+item.sub.length+' steps?')) return;
          dropWorkKeys(item); items.splice(i,1); save(); saveWorkWeek(); renderWork(); }
      }));
      wkCard.appendChild(head);
      item.sub.forEach((s,j)=>{
        const r = workRow('WKS|'+s.id, s.t, true);
        if (workEdit) r.appendChild(editTools({
          rename: ()=>{ const v=prompt('Rename step:', s.t); if (v && v.trim()){ s.t=v.trim(); saveWorkWeek(); renderWork(); } },
          del: ()=>{ if (!confirm('Delete step "'+s.t+'"?')) return;
            delete state['WKS|'+s.id]; item.sub.splice(j,1); save(); saveWorkWeek(); renderWork(); }
        }));
        wkCard.appendChild(r);
      });
      if (workEdit){
        const addSub = document.createElement('button'); addSub.className='wkadd sub';
        addSub.textContent = '+ step under ' + item.t;
        addSub.onclick = ()=>{ const v=prompt('New step under "'+item.t+'":'); if (!v || !v.trim()) return;
          item.sub.push({ id:newWorkId(), t:v.trim() }); saveWorkWeek(); renderWork(); };
        wkCard.appendChild(addSub);
      }
    } else {
      const r = workRow('WK|'+item.id, item.t, false);
      if (workEdit) r.appendChild(editTools({
        up: ()=>{ items.splice(i-1,0,items.splice(i,1)[0]); saveWorkWeek(); renderWork(); }, upOff: i===0,
        down: ()=>{ items.splice(i+1,0,items.splice(i,1)[0]); saveWorkWeek(); renderWork(); }, downOff: i===items.length-1,
        rename: ()=>{ const v=prompt('Rename:', item.t); if (v && v.trim()){ item.t=v.trim(); saveWorkWeek(); renderWork(); } },
        del: ()=>{ if (!confirm('Delete "'+item.t+'"?')) return;
          dropWorkKeys(item); items.splice(i,1); save(); saveWorkWeek(); renderWork(); },
        sub: true
      }));
      wkCard.appendChild(r);
    }
  });

  if (workEdit){
    const addRow2 = document.createElement('div'); addRow2.className='wkaddrow';
    const ai = document.createElement('input'); ai.type='text'; ai.className='mealin';
    ai.placeholder = 'Add to ' + DAY_FULL[workDay];
    const ab = document.createElement('button'); ab.className='wbtn'; ab.textContent='Add';
    function addWorkItem(){
      const v = ai.value.trim(); if (!v) return;
      workweek[workDay] = workweek[workDay] || [];
      workweek[workDay].push({ id:newWorkId(), t:v });
      saveWorkWeek(); ai.value=''; burstAt(ab,false); renderWork();
    }
    ab.onclick = addWorkItem;
    ai.onkeydown = e=>{ if (e.key === 'Enter') addWorkItem(); };
    addRow2.appendChild(ai); addRow2.appendChild(ab);
    wkCard.appendChild(addRow2);
    const cn = document.createElement('div'); cn.className='exnote';
    cn.textContent = 'Changes here apply every week. Ticks stay attached to their own item, so reordering or renaming won’t move them.';
    wkCard.appendChild(cn);
  }
  wrap.appendChild(wkCard);

  /* ---- standing items (any day) ---- */
  const stCard = document.createElement('section'); stCard.className='pcard';
  const sh = document.createElement('h3');
  sh.innerHTML = '<span>Standing — anytime this week</span>';
  stCard.appendChild(sh);
  workstanding.forEach((s,i)=>{
    const r = workRow('WKST|'+s.id, s.t, false, 'WKST-T|'+s.id);
    if (workEdit) r.appendChild(editTools({
      up: ()=>{ workstanding.splice(i-1,0,workstanding.splice(i,1)[0]); saveWorkStanding(); renderWork(); }, upOff: i===0,
      down: ()=>{ workstanding.splice(i+1,0,workstanding.splice(i,1)[0]); saveWorkStanding(); renderWork(); }, downOff: i===workstanding.length-1,
      rename: ()=>{ const v=prompt('Rename:', s.t); if (v && v.trim()){ s.t=v.trim(); saveWorkStanding(); renderWork(); } },
      del: ()=>{ if (!confirm('Delete "'+s.t+'"?')) return;
        delete state['WKST|'+s.id]; delete state['WKST-T|'+s.id];
        workstanding.splice(i,1); save(); saveWorkStanding(); renderWork(); }
    }));
    stCard.appendChild(r);
  });
  if (workEdit){
    const sr = document.createElement('div'); sr.className='wkaddrow';
    const si = document.createElement('input'); si.type='text'; si.className='mealin';
    si.placeholder = 'Add a standing item';
    const sb = document.createElement('button'); sb.className='wbtn'; sb.textContent='Add';
    function addStanding(){
      const v = si.value.trim(); if (!v) return;
      workstanding.push({ id:newWorkId(), t:v });
      saveWorkStanding(); si.value=''; burstAt(sb,false); renderWork();
    }
    sb.onclick = addStanding;
    si.onkeydown = e=>{ if (e.key === 'Enter') addStanding(); };
    sr.appendChild(si); sr.appendChild(sb);
    stCard.appendChild(sr);
  }
  wrap.appendChild(stCard);

  const listCard = document.createElement('section'); listCard.className='pcard';
  listCard.innerHTML = '<h3>One-off to-dos</h3>';
  const addRow = document.createElement('div'); addRow.className='waddrow';
  const tIn = document.createElement('input'); tIn.type='text'; tIn.className='mealin'; tIn.placeholder='Add a work task';
  const dIn = document.createElement('input'); dIn.type='date'; dIn.className='mealin';
  addRow.appendChild(tIn); addRow.appendChild(dIn);
  listCard.appendChild(addRow);
  const addBtn = document.createElement('button'); addBtn.className='wbtn'; addBtn.textContent='Add task';
  addBtn.style.marginBottom='12px';
  function addWork(){
    const v = tIn.value.trim(); if (!v) return;
    worktasks.push({ id:'wk'+Date.now(), t:v, due:dIn.value||'', done:false });
    saveWork(); tIn.value=''; dIn.value=''; burstAt(addBtn,false); renderWork();
  }
  addBtn.onclick = addWork;
  tIn.onkeydown = (e)=>{ if (e.key==='Enter') addWork(); };
  listCard.appendChild(addBtn);

  const todayY = ymd(new Date(now));
  const rank = t => t.today?0 : t.week?1 : (t.due?2:3);
  const sorted = worktasks.slice().sort((a,b)=>{
    if (a.done!==b.done) return a.done?1:-1;
    const ra=rank(a), rb=rank(b); if (ra!==rb) return ra-rb;
    if (a.due&&b.due) return a.due<b.due?-1:1;
    return 0;
  });
  sorted.forEach(tk=>{
    const row = document.createElement('div');
    row.className='wtask'+(tk.done?' done':'')+((tk.today||tk.week)&&!tk.done?' istoday':'');
    const cb = document.createElement('input'); cb.type='checkbox'; cb.checked=tk.done;
    cb.onchange = ()=>{ tk.done=cb.checked; saveWork(); if (cb.checked) burstAt(cb,false); renderWork(); };
    const lb = document.createElement('span'); lb.className='wl'; lb.textContent=tk.t;
    row.appendChild(cb); row.appendChild(lb);
    if (tk.due && !tk.done){
      const due = document.createElement('span');
      due.className = 'due' + (tk.due < todayY ? ' over' : '');
      const dd = ymdToDate(tk.due);
      due.textContent = tk.due===todayY ? 'today' : dd.toLocaleDateString('en-US',{month:'short',day:'numeric'});
      row.appendChild(due);
    }
    if (!tk.done){
      const pT = document.createElement('button'); pT.className='spill today'+(tk.today?' on':'');
      pT.textContent='Today'; pT.title = tk.today?'Remove from today':'Add to today';
      pT.onclick = ()=>{ tk.today=!tk.today; if (tk.today) tk.week=false; saveWork();
        if (tk.today) burstAt(pT,false); renderWork(); };
      const pW = document.createElement('button'); pW.className='spill week'+(tk.week?' on':'');
      pW.textContent='Week'; pW.title = tk.week?'Remove from this week':'Anytime this week';
      pW.onclick = ()=>{ tk.week=!tk.week; if (tk.week) tk.today=false; saveWork();
        if (tk.week) burstAt(pW,false); renderWork(); };
      row.appendChild(pT); row.appendChild(pW);
    }
    const x = document.createElement('button'); x.className='wx'; x.innerHTML='&times;';
    x.onclick = ()=>{ worktasks = worktasks.filter(w=>w.id!==tk.id); saveWork(); renderWork(); };
    row.appendChild(x);
    listCard.appendChild(row);
  });
  if (!worktasks.length){
    const em = document.createElement('div'); em.className='exnote';
    em.textContent = 'No work tasks yet. Add one, then tag it Today or Week when it’s ready.';
    listCard.appendChild(em);
  }
  const nDone = worktasks.filter(t=>t.done).length;
  if (nDone){
    const cd = document.createElement('button'); cd.className='wbtn';
    cd.style.cssText = 'width:100%;margin-top:10px;';
    cd.textContent = 'Clear ' + nDone + ' finished task' + (nDone===1?'':'s');
    cd.onclick = ()=>{
      if (!confirm('Remove ' + nDone + ' finished task' + (nDone===1?'':'s') + ' from this list?')) return;
      worktasks = worktasks.filter(t=>!t.done); saveWork(); renderWork();
    };
    listCard.appendChild(cd);
  }
  wrap.appendChild(listCard);
}

/* ================= rogue mode =================
   Every task due this week, grouped by zone instead of by day. Ticking here
   writes to exactly the same key the Week tab uses for that task's scheduled
   day — there's no second copy of "done", so the two views can't drift. */
function weekTaskRows(){
  const seen = {}, rows = [];
  const today = DAYS[now.getDay()];
  /* everyday habits first — one row each, ticking it marks today */
  tasks.filter(t=>t.cad === 'daily').forEach(t=>{
    seen[t.id] = true;
    rows.push({ task:t, day:today, daily:true,
      doneDays: DAYS.filter(d=>state[storeId(d, t.id)]).length });
  });
  DAYS.forEach(dn=>{
    liveTasksOn(dn).forEach(t=>{
      if (t.cad === 'daily' || seen[t.id]) return;
      seen[t.id] = true;
      rows.push({ task:t, day:dn });
    });
  });
  return rows;
}
function renderRogue(){
  const wrap = document.getElementById('rogueView'); wrap.innerHTML = '';
  const rows = weekTaskRows();

  const intro = document.createElement('div'); intro.className='exnote';
  intro.style.padding = '0 2px 10px';
  intro.textContent = 'Everything due this week, by zone. Did a kitchen job early? Tick it here — it lands on its real day in the Week tab, and vice versa.';
  wrap.appendChild(intro);

  if (!rows.length){
    const em = document.createElement('div'); em.className='pcard';
    em.innerHTML = '<div class="exnote">Nothing scheduled this week yet. Add tasks on the Tasks tab.</div>';
    wrap.appendChild(em);
    return;
  }

  const done = rows.filter(r=>state[storeId(r.day, r.task.id)]).length;
  const bar = document.createElement('div'); bar.className='pcard rgtotal';
  bar.innerHTML = '<div class="rgnum">'+done+' / '+rows.length+'</div>' +
    '<div class="rglbl">done this week</div>' +
    '<div class="rgbar"><i style="width:'+(rows.length?Math.round(100*done/rows.length):0)+'%"></i></div>';
  wrap.appendChild(bar);

  const order = spaceNames().slice();
  rows.forEach(r=>{ if (order.indexOf(r.task.bucket) === -1) order.push(r.task.bucket); });

  order.forEach(zone=>{
    const mine = rows.filter(r=>r.task.bucket === zone);
    if (!mine.length) return;
    mine.sort((a,b)=>{
      const d = DAYS.indexOf(a.day) - DAYS.indexOf(b.day);
      return d !== 0 ? d : a.task.label.localeCompare(b.task.label);
    });
    const zDone = mine.filter(r=>state[storeId(r.day, r.task.id)]).length;

    const card = document.createElement('section'); card.className='pcard rgzone';
    const h = document.createElement('h3');
    h.innerHTML = '<span>'+zone+'</span><span class="rgc'+(zDone===mine.length?' all':'')+'">'+
      zDone+'/'+mine.length+'</span>';
    card.appendChild(h);

    mine.forEach(r=>{
      const id = storeId(r.day, r.task.id);
      const isDone = !!state[id];
      const row = document.createElement('label'); row.className='rgrow'+(isDone?' done':'');
      const cb = document.createElement('input'); cb.type='checkbox'; cb.checked = isDone;
      cb.onchange = ()=>{
        if (cb.checked) state[id] = true; else delete state[id];
        save();
        if (cb.checked) burstAt(cb, false);
        render();
      };
      const nm = document.createElement('span'); nm.className='rgn'; nm.textContent = r.task.label;
      const dp = document.createElement('span'); dp.className='rgd';
      row.appendChild(cb); row.appendChild(nm);
      if (r.daily){
        /* an everyday habit — show how much of the week it's had, tick marks today */
        const cnt = document.createElement('span');
        cnt.className = 'rgt' + (r.doneDays === 7 ? ' full' : '');
        cnt.textContent = r.doneDays + '/7';
        cnt.title = r.doneDays + ' of 7 days done this week';
        row.appendChild(cnt);
        dp.textContent = 'today';
        dp.title = 'Everyday habit — this ticks off ' + DAY_FULL[r.day];
      } else {
        if (r.task.cad !== 'weekly'){
          const tg = document.createElement('span'); tg.className='rgt'; tg.textContent = r.task.cad;
          row.appendChild(tg);
        }
        dp.textContent = r.day;
        dp.title = 'Scheduled for ' + DAY_FULL[r.day];
      }
      row.appendChild(dp);
      card.appendChild(row);
    });
    wrap.appendChild(card);
  });

  const foot = document.createElement('div'); foot.className='exnote';
  foot.style.textAlign='center';
  foot.textContent = 'Everyday habits show a ×/7 for the week; ticking one here marks today.';
  wrap.appendChild(foot);
}

/* ================= top level ================= */
function render(){
  snapshotToday();

  document.getElementById('tabWeek').className = view==='week'?'on':'';
  document.getElementById('tabPlan').className = view==='plan'?'on':'';
  document.getElementById('tabAll').className = view==='all'?'on':'';
  document.getElementById('tabProg').className = view==='prog'?'on':'';
  document.getElementById('tabFood').className = view==='food'?'on':'';
  document.getElementById('tabWork').className = view==='work'?'on':'';
  document.getElementById('tabRogue').className = view==='rogue'?'on':'';
  document.getElementById('weekView').style.display = view==='week'?'':'none';
  document.getElementById('planView').style.display = view==='plan'?'':'none';
  document.getElementById('allView').style.display = view==='all'?'':'none';
  document.getElementById('progView').style.display = view==='prog'?'':'none';
  document.getElementById('foodView').style.display = view==='food'?'':'none';
  document.getElementById('workView').style.display = view==='work'?'':'none';
  document.getElementById('rogueView').style.display = view==='rogue'?'':'none';
  if (view==='week') renderWeek(); else if (view==='plan') renderPlan();
  else if (view==='all') renderAll(); else if (view==='prog') renderProgress();
  else if (view==='food') renderFood(); else if (view==='rogue') renderRogue();
  else renderWork();

  if (view !== lastRenderedView){
    const map = { week:'weekView', plan:'planView', all:'allView', prog:'progView', food:'foodView', work:'workView', rogue:'rogueView' };
    const el = document.getElementById(map[view]);
    if (el){ el.classList.remove('viewin'); void el.offsetWidth; el.classList.add('viewin'); }
    lastRenderedView = view;
  }

  // ---- contextual hero ----
  let title='The 5am Club', sub='', big='', small='', pct=0, color='var(--pop)';
  if (view==='week'){
    const p=dayProgress(selDay); pct=p.total?100*p.done/p.total:0;
    sub = 'Wake 5:00 — out the door by 7:25';
    big=p.done+' of '+p.total+' done'; small=DAY_FULL[selDay];
  } else if (view==='plan'){
    const p=weekProgress(); pct=p.total?100*p.done/p.total:0;
    sub='Set the week once — it pulls onto each day';
    big=p.done+' of '+p.total+' this week'; small='meals + workouts';
  } else if (view==='all'){
    const p=weekProgress(); pct=p.total?100*p.done/p.total:0;
    sub='Everything on your plate, one place';
    big=p.done+' of '+p.total+' this week'; small=tasks.length+' tasks in rotation';
  } else if (view==='prog'){
    const p=weekProgress(); pct=p.total?100*p.done/p.total:0;
    const cur=currentStreak('workout'), best=bestStreak('workout');
    title='Look at You Go';
    sub='Your momentum, receipts and all';
    big=(cur?'🔥 ':'')+cur+'-day workout streak'; small='longest '+best+' · '+weeksTracked()+' weeks strong';
  } else if (view==='food'){
    const log=foodLog(foodDay);
    const cal=log.reduce((s,e)=>s+(+e.c||0),0), pro=log.reduce((s,e)=>s+(+e.p||0),0);
    pct=Math.min(100,100*cal/CAL_MAX);
    const r10 = pro>0 ? (cal/pro).toFixed(1) : '—';
    title='Today’s Fuel'; color='#ffd166';
    sub='Aim: '+CAL_MIN.toLocaleString()+'–'+CAL_MAX.toLocaleString()+' cal · '+PRO_FLOOR+'g protein floor';
    big=cal+' / '+CAL_MAX+' cal'; small=pro+'g protein · R10 '+r10;
  } else if (view==='rogue'){
    const rr = weekTaskRows();
    const rdone = rr.filter(r=>state[storeId(r.day, r.task.id)]).length;
    pct = rr.length ? 100*rdone/rr.length : 0;
    title='Rogue Mode'; color='#3ddc97';
    sub='Every zone, whole week — do it whenever you like';
    big = rr.length ? rdone+' of '+rr.length+' knocked out' : 'Nothing scheduled this week';
    small = 'ticks land on the right day automatically';
  } else { // work
    const wl=workLeaves(workDay), wdone=wl.filter(x=>state[x]).length;
    pct=wl.length?100*wdone/wl.length:0;
    title='Daily Grind'; color='#ffffff';
    sub='Hiya, Kathleen! Here’s what you can crush today.';
    big=wl.length ? wdone+' of '+wl.length+' today' : 'No standing tasks today';
    small=DAY_FULL[workDay];
  }
  document.querySelector('.hero').className = 'hero h-'+view;
  document.querySelector('.hero h1').textContent = title;
  document.getElementById('subline').textContent = sub;
  const C = 2*Math.PI*26; const rpct = Math.max(0,Math.min(100,pct));
  const rv = document.getElementById('ringVal');
  rv.style.strokeDashoffset = C - C*rpct/100; rv.style.stroke = color;
  document.getElementById('ringNum').textContent = Math.round(pct)+'%';
  const ringEl = document.querySelector('.ring'); if (ringEl) ringEl.classList.toggle('full', Math.round(pct)>=100);
  document.getElementById('ringBig').textContent = big;
  document.getElementById('ringSmall').textContent = small;

  document.getElementById('wkLabel').textContent = 'Week of ' +
    weekStart.toLocaleDateString('en-US',{month:'short',day:'numeric'}) +
    ' — checks reset each Sunday';
}

/* ================= quick capture / inbox ================= */

}

      const v = sel.value; if (!v) return;
      if (v==='work'){ worktasks.push({ id:'wk'+Date.now(), t:it.t, due:'', done:false }); saveWork(); }
      else if (v==='week') addExtra(it.t);
      inbox = inbox.filter(x=>x.id!==it.id); saveInbox(); burstAt(sel,false);
      renderInbox();
      if (view==='work') renderWork(); else if (view==='week') renderWeek();
    };
    const del = document.createElement('button'); del.className='ibx'; del.innerHTML='&times;';
    del.onclick = ()=>{ inbox = inbox.filter(x=>x.id!==it.id); saveInbox(); renderInbox(); };
    row.appendChild(tx); row.appendChild(sel); row.appendChild(del);
    list.appendChild(row);
  });
}
(function initCapture(){
  const inp = document.getElementById('capIn');
  const add = document.getElementById('capAdd');
  function commit(){ if (!inp.value.trim()) return; addThought(inp.value); inp.value='';
    inboxOpen = true; burstAt(add,false); renderInbox(); }
  add.onclick = commit;
  inp.onkeydown = (e)=>{ if (e.key==='Enter') commit(); };

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = document.getElementById('capMic');
  if (SR){
    let rec=null, listening=false;
    mic.onclick = ()=>{
      if (listening){ if (rec) rec.stop(); return; }
      rec = new SR(); rec.lang='en-US'; rec.interimResults=false;
      rec.onresult = (e)=>{ const tx=e.results[0][0].transcript;
        inp.value = (inp.value ? inp.value+' ' : '') + tx; };
      rec.onend = ()=>{ listening=false; mic.classList.remove('rec'); };
      rec.onerror = ()=>{ listening=false; mic.classList.remove('rec'); };
      listening=true; mic.classList.add('rec');
      try { rec.start(); } catch(err){ listening=false; mic.classList.remove('rec'); }
    };
  } else { mic.style.display='none'; }

  document.getElementById('inboxToggle').onclick = ()=>{ inboxOpen=!inboxOpen; renderInbox(); };
  renderInbox();
})();

    projectId: "kat-kat-planner",

      k !== 'mwl-dirtykeys';
  }

     instead of overwriting each other.

     and EVERY browser on iOS, Chrome included — silently discards that
     assignment and keeps the native method, so no edit on an iPhone was ever
     noticed and nothing was ever uploaded from one. Chrome on desktop allows
     it, which is why only the computer ever synced.

     and keep an engine-independent polling watcher as a safety net. */

    try { localStorage.removeItem(probe); } catch(e){}

    ready: function(){ return fbReady; },

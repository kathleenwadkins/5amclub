function workLeaves(day){
  const keys = [];
  (WORK_WEEK[day]||[]).forEach((raw,i)=>{
    const item = typeof raw==='string' ? { t:raw } : raw;
    if (item.sub && item.sub.length) item.sub.forEach((s,j)=> keys.push('WKS|'+day+'|'+i+'|'+j));
    else keys.push('WK|'+day+'|'+i);
  });
  return keys;
}
function workRow(key, label, isSub, todayKey){
  const done = !!state[key];
  const today = todayKey ? !!state[todayKey] : false;
  const row = document.createElement('div');
  row.className='wtask'+(isSub?' sub':'')+(done?' done':'')+(today&&!done?' istoday':'');
  const cb = document.createElement('input'); cb.type='checkbox'; cb.checked=done;
  cb.onchange = ()=>{ state[key]=cb.checked; if(!cb.checked) delete state[key]; save();
    if (cb.checked) burstAt(cb,false); renderWork(); };
  const lb = document.createElement('span'); lb.className='wl'; lb.textContent=label;
  row.appendChild(cb); row.appendChild(lb);
  if (todayKey && !done){
    const pill = document.createElement('button'); pill.className='spill today'+(today?' on':'');
    pill.textContent='Today'; pill.title = today?'Remove from today':'Add to today';
    pill.onclick = ()=>{ if (state[todayKey]) delete state[todayKey]; else state[todayKey]=true; save();
      if (state[todayKey]) burstAt(pill,false); renderWork(); };
    row.appendChild(pill);
  }
  return row;
}
function renderWork(){
  const wrap = document.getElementById('workView'); wrap.innerHTML = '';

  const links = document.createElement('div');
  worklinks.forEach((l,i)=>{
    const a = document.createElement('a'); a.className='wlink';
    a.href = l.url; a.target='_blank'; a.rel='noopener';
    a.innerHTML = '<span>'+l.label+'</span><span class="ar">↗</span>';
    a.oncontextmenu = (e)=>{ e.preventDefault();
      if (confirm('Remove link "'+l.label+'"?')){ worklinks.splice(i,1); saveLinks(); renderWork(); } };
    links.appendChild(a);
  });
  const addLink = document.createElement('button'); addLink.className='wbtn';
  addLink.style.marginBottom='14px'; addLink.textContent='+ Add a work link';
  addLink.onclick = ()=>{
    const label = prompt('Link name (e.g. Google Docs, Gmail):'); if (!label) return;
    let url = prompt('URL:'); if (!url) return;
    if (!/^https?:\/\//.test(url)) url = 'https://'+url;
    worklinks.push({ label:label.trim(), url:url.trim() }); saveLinks(); renderWork();
  };
  wrap.appendChild(links); wrap.appendChild(addLink);

  /* ---- standard weekly work, by day ---- */
  const daystrip = document.createElement('div'); daystrip.className='days';
  const todayKey = DAYS[(now.getDay()+6)%7];
  DAYS.forEach(d=>{
    const tot = workLeaves(d).length;
    const done = workLeaves(d).filter(k=>state[k]).length;
    const pc = tot ? 100*done/tot : 0;
    const b = document.createElement('button');
    b.className = (d===workDay?'sel ':'') + (d===todayKey?'today ':'') + (tot&&pc===100?'full':'');
    b.innerHTML = '<span class="d">'+d+'</span><span class="mini"><i style="width:'+pc+'%"></i></span>';
    b.onclick = ()=>{ workDay = d; renderWork(); };
    daystrip.appendChild(b);
  });
  wrap.appendChild(daystrip);

  const wkCard = document.createElement('section'); wkCard.className='pcard';
  const wp = workLeaves(workDay);
  const wdone = wp.filter(k=>state[k]).length;
  wkCard.innerHTML = '<h3>'+DAY_FULL[workDay]+' — standard'+(wp.length?' · '+wdone+'/'+wp.length:'')+'</h3>';
  const items = WORK_WEEK[workDay] || [];
  if (!items.length){
    const em = document.createElement('div'); em.className='exnote';
    em.textContent = 'No standing work tasks on '+DAY_FULL[workDay]+'.';
    wkCard.appendChild(em);
  }
  items.forEach((raw,i)=>{
    const item = typeof raw==='string' ? { t:raw } : raw;
    if (item.sub && item.sub.length){
      const head = document.createElement('div'); head.className='worksubhead';
      head.textContent = item.t; wkCard.appendChild(head);
      item.sub.forEach((sname,j)=> wkCard.appendChild(workRow('WKS|'+workDay+'|'+i+'|'+j, sname, true)));
    } else {
      wkCard.appendChild(workRow('WK|'+workDay+'|'+i, item.t, false));
    }
  });
  wrap.appendChild(wkCard);

  /* ---- standing items (any day) ---- */
  const stCard = document.createElement('section'); stCard.className='pcard';
  stCard.innerHTML = '<h3>Standing — anytime this week</h3>';
  WORK_STANDING.forEach((s,i)=> stCard.appendChild(workRow('WKST|'+i, s, false, 'WKST-T|'+i)));
  wrap.appendChild(stCard);

  const listCard = document.createElement('section'); listCard.className='pcard';
  listCard.innerHTML = '<h3>One-off to-dos</h3>';
  const addRow = document.createElement('div'); addRow.className='waddrow';
  const tIn = document.createElement('input'); tIn.type='text'; tIn.className='mealin'; tIn.placeholder='Add a work task';
  const dIn = document.createElement('input'); dIn.type='date'; dIn.className='mealin';
  addRow.appendChild(tIn); addRow.appendChild(dIn);
  listCard.appendChild(addRow);
  const addBtn = document.createElement('button'); addBtn.className='wbtn'; addBtn.textContent='Add task';
  addBtn.style.marginBottom='12px';
  function addWork(){
    const v = tIn.value.trim(); if (!v) return;
    worktasks.push({ id:'wk'+Date.now(), t:v, due:dIn.value||'', done:false });
    saveWork(); tIn.value=''; dIn.value=''; burstAt(addBtn,false); renderWork();
  }
  addBtn.onclick = addWork;
  tIn.onkeydown = (e)=>{ if (e.key==='Enter') addWork(); };
  listCard.appendChild(addBtn);

  const todayY = ymd(new Date(now));
  const rank = t => t.today?0 : t.week?1 : (t.due?2:3);
  const sorted = worktasks.slice().sort((a,b)=>{
    if (a.done!==b.done) return a.done?1:-1;
    const ra=rank(a), rb=rank(b); if (ra!==rb) return ra-rb;
    if (a.due&&b.due) return a.due<b.due?-1:1;
    return 0;
  });
  sorted.forEach(tk=>{
    const row = document.createElement('div');
    row.className='wtask'+(tk.done?' done':'')+((tk.today||tk.week)&&!tk.done?' istoday':'');
    const cb = document.createElement('input'); cb.type='checkbox'; cb.checked=tk.done;
    cb.onchange = ()=>{ tk.done=cb.checked; saveWork(); if (cb.checked) burstAt(cb,false); renderWork(); };
    const lb = document.createElement('span'); lb.className='wl'; lb.textContent=tk.t;
    row.appendChild(cb); row.appendChild(lb);
    if (tk.due && !tk.done){
      const due = document.createElement('span');
      due.className = 'due' + (tk.due < todayY ? ' over' : '');
      const dd = ymdToDate(tk.due);
      due.textContent = tk.due===todayY ? 'today' : dd.toLocaleDateString('en-US',{month:'short',day:'numeric'});
      row.appendChild(due);
    }
    if (!tk.done){
      const pT = document.createElement('button'); pT.className='spill today'+(tk.today?' on':'');
      pT.textContent='Today'; pT.title = tk.today?'Remove from today':'Add to today';
      pT.onclick = ()=>{ tk.today=!tk.today; if (tk.today) tk.week=false; saveWork();
        if (tk.today) burstAt(pT,false); renderWork(); };
      const pW = document.createElement('button'); pW.className='spill week'+(tk.week?' on':'');
      pW.textContent='Week'; pW.title = tk.week?'Remove from this week':'Anytime this week';
      pW.onclick = ()=>{ tk.week=!tk.week; if (tk.week) tk.today=false; saveWork();
        if (tk.week) burstAt(pW,false); renderWork(); };
      row.appendChild(pT); row.appendChild(pW);
    }
    const x = document.createElement('button'); x.className='wx'; x.innerHTML='&times;';
    x.onclick = ()=>{ worktasks = worktasks.filter(w=>w.id!==tk.id); saveWork(); renderWork(); };
    row.appendChild(x);
    listCard.appendChild(row);
  });
  if (!worktasks.length){
    const em = document.createElement('div'); em.className='exnote';
    em.textContent = 'No work tasks yet. Add one, then tag it Today or Week when it’s ready.';
    listCard.appendChild(em);
  }
  const nDone = worktasks.filter(t=>t.done).length;
  if (nDone){
    const cd = document.createElement('button'); cd.className='wbtn';
    cd.style.cssText = 'width:100%;margin-top:10px;';
    cd.textContent = 'Clear ' + nDone + ' finished task' + (nDone===1?'':'s');
    cd.onclick = ()=>{
      if (!confirm('Remove ' + nDone + ' finished task' + (nDone===1?'':'s') + ' from this list?')) return;
      worktasks = worktasks.filter(t=>!t.done); saveWork(); renderWork();
    };
    listCard.appendChild(cd);
  }
  wrap.appendChild(listCard);
}

  const k = Math.ceil((new Date(2026,7,20) - now)/86400000);
  document.getElementById('kcount').textContent = k>0
    ? 'Kindergarten in '+k+' days (Aug 20)' : 'School year in session';

  document.getElementById('tabWeek').className = view==='week'?'on':'';
  document.getElementById('tabPlan').className = view==='plan'?'on':'';
  document.getElementById('tabAll').className = view==='all'?'on':'';
  document.getElementById('tabProg').className = view==='prog'?'on':'';
  document.getElementById('tabFood').className = view==='food'?'on':'';
  document.getElementById('tabWork').className = view==='work'?'on':'';
  document.getElementById('weekView').style.display = view==='week'?'':'none';
  document.getElementById('planView').style.display = view==='plan'?'':'none';
  document.getElementById('allView').style.display = view==='all'?'':'none';
  document.getElementById('progView').style.display = view==='prog'?'':'none';
  document.getElementById('foodView').style.display = view==='food'?'':'none';
  document.getElementById('workView').style.display = view==='work'?'':'none';
  if (view==='week') renderWeek(); else if (view==='plan') renderPlan();
  else if (view==='all') renderAll(); else if (view==='prog') renderProgress();
  else if (view==='food') renderFood(); else renderWork();

  if (view !== lastRenderedView){
    const map = { week:'weekView', plan:'planView', all:'allView', prog:'progView', food:'foodView', work:'workView' };
    const el = document.getElementById(map[view]);
    if (el){ el.classList.remove('viewin'); void el.offsetWidth; el.classList.add('viewin'); }
    lastRenderedView = view;
  }

  // ---- contextual hero ----
  let title='The 5am Club', sub='', big='', small='', pct=0, color='var(--pop)', showK=false;
  if (view==='week'){
    const p=dayProgress(selDay); pct=p.total?100*p.done/p.total:0;
    sub = version==='now' ? 'Summer rhythm — wake 5:00, kids up 7:30' : 'School rhythm — wake 5:00, drop-off by 7:25';
    big=p.done+' of '+p.total+' done'; small=DAY_FULL[selDay]; showK=true;
  } else if (view==='plan'){
    const p=weekProgress(); pct=p.total?100*p.done/p.total:0;
    sub='Set the week once — it pulls onto each day';
    big=p.done+' of '+p.total+' this week'; small='meals + workouts'; showK=true;
  } else if (view==='all'){
    const p=weekProgress(); pct=p.total?100*p.done/p.total:0;
    sub='Everything on your plate, one place';
    big=p.done+' of '+p.total+' this week'; small=tasks.length+' tasks in rotation';
  } else if (view==='prog'){
    const p=weekProgress(); pct=p.total?100*p.done/p.total:0;
    const cur=currentStreak('workout'), best=bestStreak('workout');
    title='Look at You Go';
    sub='Your momentum, receipts and all';
    big=(cur?'🔥 ':'')+cur+'-day workout streak'; small='longest '+best+' · '+weeksTracked()+' weeks strong';
  } else if (view==='food'){
    const log=foodLog(foodDay);
    const cal=log.reduce((s,e)=>s+(+e.c||0),0), pro=log.reduce((s,e)=>s+(+e.p||0),0);
    pct=Math.min(100,100*cal/CAL_MAX);
    const r10 = pro>0 ? (cal/pro).toFixed(1) : '—';
    title='Today’s Fuel'; color='#ffd166';
    sub='Aim: '+CAL_MIN.toLocaleString()+'–'+CAL_MAX.toLocaleString()+' cal · '+PRO_FLOOR+'g protein floor';
    big=cal+' / '+CAL_MAX+' cal'; small=pro+'g protein · R10 '+r10;
  } else { // work
    const wl=workLeaves(workDay), wdone=wl.filter(x=>state[x]).length;
    pct=wl.length?100*wdone/wl.length:0;
    title='Daily Grind'; color='#ffffff';
    sub='Hiya, Kathleen! Here’s what you can crush today.';
    big=wl.length ? wdone+' of '+wl.length+' today' : 'No standing tasks today';
    small=DAY_FULL[workDay];
  }
  document.querySelector('.hero').className = 'hero h-'+view;
  document.querySelector('.hero h1').textContent = title;
  document.getElementById('subline').textContent = sub;
  document.getElementById('kcount').style.display = showK ? '' : 'none';
  const C = 2*Math.PI*26; const rpct = Math.max(0,Math.min(100,pct));
  const rv = document.getElementById('ringVal');
  rv.style.strokeDashoffset = C - C*rpct/100; rv.style.stroke = color;
  document.getElementById('ringNum').textContent = Math.round(pct)+'%';
  const ringEl = document.querySelector('.ring'); if (ringEl) ringEl.classList.toggle('full', Math.round(pct)>=100);
  document.getElementById('ringBig').textContent = big;
  document.getElementById('ringSmall').textContent = small;

  document.getElementById('wkLabel').textContent = 'Week of ' +
    monday.toLocaleDateString('en-US',{month:'short',day:'numeric'}) +
    ' — checks reset each Monday';
}

/* ================= quick capture / inbox ================= */
let inbox = [];
try { inbox = JSON.parse(localStorage.getItem('mwl-inbox') || '[]'); } catch(e){ inbox = []; }
if (!Array.isArray(inbox)) inbox = [];
function saveInbox(){ localStorage.setItem('mwl-inbox', JSON.stringify(inbox)); }
let inboxOpen = false;

function addThought(txt){
  const t = txt.trim(); if (!t) return;
  inbox.unshift({ id:'ib'+Date.now(), t:t });
  saveInbox();
}
function renderInbox(){
  const wrap = document.getElementById('inboxWrap');
  if (!inbox.length){ wrap.style.display='none'; return; }
  wrap.style.display='';
  document.getElementById('inboxCount').textContent = inbox.length;
  document.getElementById('inboxCaret').innerHTML = inboxOpen ? '&#9662;' : '&#9656;';
  const list = document.getElementById('inboxList');
  list.style.display = inboxOpen ? '' : 'none'; list.innerHTML='';
  inbox.forEach(it=>{
    const row = document.createElement('div'); row.className='inboxitem';
    const tx = document.createElement('span'); tx.className='ibtx'; tx.textContent = it.t;
    const sel = document.createElement('select'); sel.className='ibsel';
    sel.innerHTML = '<option value="">Add to…</option>'
      + '<option value="week">This week’s list</option>'
      + '<option value="work">Work list</option>';
    sel.onchange = ()=>{
      const v = sel.value; if (!v) return;
      if (v==='work'){ worktasks.push({ id:'wk'+Date.now(), t:it.t, due:'', done:false }); saveWork(); }
      else if (v==='week') addExtra(it.t);
      inbox = inbox.filter(x=>x.id!==it.id); saveInbox(); burstAt(sel,false);
      renderInbox();
      if (view==='work') renderWork(); else if (view==='week') renderWeek();
    };
    const del = document.createElement('button'); del.className='ibx'; del.innerHTML='&times;';
    del.onclick = ()=>{ inbox = inbox.filter(x=>x.id!==it.id); saveInbox(); renderInbox(); };
    row.appendChild(tx); row.appendChild(sel); row.appendChild(del);
    list.appendChild(row);
  });
}
(function initCapture(){
  const inp = document.getElementById('capIn');
  const add = document.getElementById('capAdd');
  function commit(){ if (!inp.value.trim()) return; addThought(inp.value); inp.value='';
    inboxOpen = true; burstAt(add,false); renderInbox(); }
  add.onclick = commit;
  inp.onkeydown = (e)=>{ if (e.key==='Enter') commit(); };

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = document.getElementById('capMic');
  if (SR){
    let rec=null, listening=false;
    mic.onclick = ()=>{
      if (listening){ if (rec) rec.stop(); return; }
      rec = new SR(); rec.lang='en-US'; rec.interimResults=false;
      rec.onresult = (e)=>{ const tx=e.results[0][0].transcript;
        inp.value = (inp.value ? inp.value+' ' : '') + tx; };
      rec.onend = ()=>{ listening=false; mic.classList.remove('rec'); };
      rec.onerror = ()=>{ listening=false; mic.classList.remove('rec'); };
      listening=true; mic.classList.add('rec');
      try { rec.start(); } catch(err){ listening=false; mic.classList.remove('rec'); }
    };
  } else { mic.style.display='none'; }

  document.getElementById('inboxToggle').onclick = ()=>{ inboxOpen=!inboxOpen; renderInbox(); };
  renderInbox();
})();

document.getElementById('tabWeek').onclick = ()=>{ view='week'; localStorage.setItem('mwl-view','week'); render(); };
document.getElementById('tabPlan').onclick = ()=>{ view='plan'; localStorage.setItem('mwl-view','plan'); render(); };
document.getElementById('tabAll').onclick = ()=>{ view='all'; localStorage.setItem('mwl-view','all'); render(); };
document.getElementById('tabProg').onclick = ()=>{ view='prog'; localStorage.setItem('mwl-view','prog'); render(); };
document.getElementById('tabFood').onclick = ()=>{ view='food'; localStorage.setItem('mwl-view','food'); render(); };
document.getElementById('tabWork').onclick = ()=>{ view='work'; localStorage.setItem('mwl-view','work'); render(); };
document.getElementById('vNow').onclick = ()=>{ setVersion('now'); };

/* Clears every checkbox for a genuinely fresh week. Safe for streaks because
   snapshotToday() treats past days as upgrade-only — the record of a workout
   already logged can't be undone by clearing the box. */
document.getElementById('resetBtn').onclick = ()=>{
  if (!confirm('Clear this week’s checkboxes for a fresh start?\n\nEverything unticks, including workouts. Days already logged stay in your streak and stats.')) return;
  state = {}; save(); render();
};

const syncBtn = document.getElementById('syncBtn');
function refreshSyncBtn(){
  const s = window.appSync;
  syncBtn.textContent = (s && s.ready()) ? 'Synced ✓' : 'Sync off';
}
/* the sync layer now loads after this script, so let it tell us when it's up */
window.refreshSyncBtn = refreshSyncBtn;
syncBtn.onclick = ()=>{
  const s = window.appSync;
  const st = (s && s.status) ? s.status() : 'sync layer not loaded';
  alert('Sync status:\n\n' + st + '\n\n(Data syncs automatically across devices that open this site. If this says BLOCKED or an error, copy it to me.)');
};
refreshSyncBtn();

/* offline support — needs sw.js deployed next to this file. Skipped on
   file:// so opening the HTML locally still works untouched. */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* offline is a bonus, never a blocker */ });
  });
}

render();

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===================== CLOUD SYNC (Firebase) =====================
   Paste your Firebase project's config below. Until you do, the app
   runs exactly as before (local only). See FIREBASE-SETUP.md.        */
(function(){
  var firebaseConfig = {
    apiKey: "AIzaSyAwRmKIgb7eYC2Hg4WaoPpV1093246JhLc",
    authDomain: "kat-kat-planner.firebaseapp.com",
    projectId: "kat-kat-planner",
    storageBucket: "kat-kat-planner.firebasestorage.app",
    messagingSenderId: "94937331334",
    appId: "1:94937331334:web:7653b1c2749451d56c0307"
  };
  /* ============================================================== */
  var configured = firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf('PASTE') !== 0;
  var fbReady=false, db=null, syncDoc=null, pushTimer=null, applying=false, syncStatus='starting…';
  var lastPush=null;
  var standalone = (window.navigator.standalone === true) ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  var deviceId = localStorage.getItem('mwl-deviceid');
  if (!deviceId){ deviceId = Math.random().toString(36).slice(2)+Date.now().toString(36);
    localStorage.setItem('mwl-deviceid', deviceId); }

  /* Only this app's own keys are ever synced. Browser extensions also write
     to localStorage; syncing those made every extension heartbeat trigger a
     full upload that clobbered the other device. */
  function isSynced(k){
    return k && k.indexOf('mwl-') === 0 &&
      k !== 'mwl-syncrev' && k !== 'mwl-deviceid' && k !== 'mwl-synccode' &&
      k !== 'mwl-dirtykeys';
  }

  /* Keys this device has changed since its last successful upload. Only these
     get written remotely, so two devices editing different things merge
     instead of overwriting each other.

     This list is persisted: a phone can be locked or backgrounded seconds
     after an edit, and iOS freezes the page before a pending upload fires.
     Surviving that (and any reload) is what stops phone edits from vanishing. */
  var dirty = {};
  try {
    (JSON.parse(localStorage.getItem('mwl-dirtykeys') || '[]') || [])
      .forEach(function(k){ if (isSynced(k)) dirty[k] = true; });
  } catch(e){ dirty = {}; }

  /* ---------------------------------------------------------------------
     Change detection.

     This used to do `localStorage.setItem = function(){…}`. WebKit — Safari
     and EVERY browser on iOS, Chrome included — silently discards that
     assignment and keeps the native method, so no edit on an iPhone was ever
     noticed and nothing was ever uploaded from one. Chrome on desktop allows
     it, which is why only the computer ever synced.

     Patch the prototype instead (WebKit honours that), then verify it took,
     and keep an engine-independent polling watcher as a safety net. */
  var _nativeSet = Storage.prototype.setItem;
  function _set(k,v){ _nativeSet.call(localStorage, k, v); }
  function rememberDirty(){
    try { _set('mwl-dirtykeys', JSON.stringify(Object.keys(dirty))); } catch(e){}
  }
  function noteChange(k){
    if (applying || !isSynced(k)) return;
    dirty[k] = true; rememberDirty(); schedulePush();
  }
  try {
    Storage.prototype.setItem = function(k,v){
      _nativeSet.call(this, k, v);
      try { if (this === window.localStorage) noteChange(k); } catch(e){}
    };
  } catch(e){}

  /* Prove tracking actually works here rather than assuming it. */
  var trackingMode = 'unknown';
  (function(){
    var probe = 'mwl-tracktest';
    localStorage.setItem(probe, '1');
    trackingMode = dirty[probe] ? 'live' : 'polling-only';
    delete dirty[probe];
    try { localStorage.removeItem(probe); } catch(e){}
    rememberDirty();
  })();

  function schedulePush(){ if (!fbReady||!syncDoc) return; clearTimeout(pushTimer); pushTimer=setTimeout(pushLocal,600); }
  function flushNow(){
    if (!fbReady||!syncDoc) return;
    if (!Object.keys(dirty).length) return;
    clearTimeout(pushTimer); pushLocal();
  }
  function collect(){ var p={}; for (var i=0;i<localStorage.length;i++){ var k=localStorage.key(i);
    if (!isSynced(k)) continue; p[k]=localStorage.getItem(k); } return p; }

  /* Safety net: diff the app's keys on a timer. Engine-independent, so even if
     a browser blocks the prototype patch too, edits still get noticed. */
  var lastSeen = collect();
  function syncLastSeen(){ lastSeen = collect(); }
  setInterval(function(){
    if (applying) return;
    var cur = collect(), found = false;
    Object.keys(cur).forEach(function(k){
      if (lastSeen[k] !== cur[k]){ lastSeen[k] = cur[k]; dirty[k] = true; found = true; }
    });
    Object.keys(lastSeen).forEach(function(k){ if (!(k in cur)) delete lastSeen[k]; });
    if (found){ rememberDirty(); schedulePush(); }
  }, 2000);

  function pushLocal(){
    if (!fbReady||!syncDoc) return Promise.resolve();
    var mine = {}, n = 0;
    Object.keys(dirty).forEach(function(k){
      var v = localStorage.getItem(k);
      if (v !== null){ mine[k] = v; n++; }
    });
    if (!n) return Promise.resolve();
    var rev = Date.now()+'-'+deviceId;
    /* A write with no network path doesn't fail — Firestore queues it and the
       promise simply never settles, which is why the phone kept claiming it
       was synced. Time it out so the Sync button tells the truth. */
    function withTimeout(p){
      return new Promise(function(resolve, reject){
        var t = setTimeout(function(){
          reject(new Error('timed out after 15s — the write never reached Firestore'));
        }, 15000);
        p.then(function(v){ clearTimeout(t); resolve(v); },
               function(e){ clearTimeout(t); reject(e); });
      });
    }
    syncStatus='saving '+n+' item'+(n===1?'':'s')+'…';
    return withTimeout(db.runTransaction(function(tx){
      return tx.get(syncDoc).then(function(snap){
        var d = snap.exists ? snap.data() : null;
        var merged = {};
        if (d && d.payload){
          Object.keys(d.payload).forEach(function(k){ if (isSynced(k)) merged[k] = d.payload[k]; });
        } else {
          var all = collect();
          Object.keys(all).forEach(function(k){ merged[k] = all[k]; });
        }
        Object.keys(mine).forEach(function(k){ merged[k] = mine[k]; });
        tx.set(syncDoc, { payload:merged, rev:rev, device:deviceId, ts:Date.now() });
      });
    })).then(function(){
      Object.keys(mine).forEach(function(k){ delete dirty[k]; });
      rememberDirty();
      _set('mwl-syncrev', rev);
      lastPush = new Date().toLocaleTimeString();
      syncStatus='synced ✓ ('+n+' item'+(n===1?'':'s')+' saved '+lastPush+')';
    }).catch(function(e){
      syncStatus='UPLOAD FAILED — '+((e&&e.code)||(e&&e.message)||e);
    });
  }

  /* Remote wins, except for keys we've edited and not yet uploaded. */
  function applyPayload(p){
    var changed = false;
    applying = true;
    try {
      Object.keys(p).forEach(function(k){
        if (!isSynced(k) || dirty[k]) return;
        if (localStorage.getItem(k) !== p[k]){ _set(k, p[k]); changed = true; }
      });
    } finally { applying = false; }
    /* pulled values are not local edits — don't let the watcher re-flag them */
    syncLastSeen();
    return changed;
  }
  var FIXED_DOC = 'kat-9f3a7c21b8e64d05a1c2b7e6';
  try { localStorage.removeItem('mwl-synccode'); } catch(e){}
  function startSync(){
    var code = FIXED_DOC;
    syncDoc = db.collection('fivamclub').doc(code);
    syncDoc.onSnapshot(function(snap){
      var d = snap.data();
      if (!d || !d.payload){ syncStatus='connected — uploading this device…'; pushLocal(); return; }
      if (d.rev === localStorage.getItem('mwl-syncrev')){
        /* Edits left over from a previous session still need to go up. */
        if (Object.keys(dirty).length){ schedulePush(); syncStatus='sending unsaved changes…'; }
        else syncStatus='synced ✓ (up to date '+new Date().toLocaleTimeString()+')';
        return;
      }
      if (d.device === deviceId){
        _set('mwl-syncrev', d.rev);
        if (Object.keys(dirty).length) schedulePush();
        return;
      }
      var changed = applyPayload(d.payload);
      _set('mwl-syncrev', d.rev);
      /* Upload our own pending edits BEFORE reloading — reloading first would
         kill the pending timer and lose them for good. */
      if (Object.keys(dirty).length){
        clearTimeout(pushTimer);
        pushLocal().then(function(){ if (changed) location.reload(); });
        syncStatus='merging both devices…';
        return;
      }
      if (changed){ syncStatus='pulling from your other device…'; location.reload(); }
      else { syncStatus='synced ✓ (up to date '+new Date().toLocaleTimeString()+')'; }
    }, function(e){ syncStatus='READ BLOCKED — '+((e&&e.code)||(e&&e.message)||e); });
    /* Phones get locked or swiped away seconds after an edit. Flush then. */
    window.addEventListener('pagehide', flushNow);
    window.addEventListener('beforeunload', flushNow);
    document.addEventListener('visibilitychange', function(){
      if (document.visibilityState === 'hidden') flushNow();
      else schedulePush();
    });
  }
  if (configured){
    if (typeof firebase === 'undefined'){ syncStatus='Firebase SDK didn’t load (check connection / host)'; }
    else { try {
        firebase.initializeApp(firebaseConfig);
        db=firebase.firestore();
        /* Firestore's default streaming transport is unreliable inside an iOS
           home-screen web app: writes sit in the offline queue forever while
           cached reads keep working, with no error raised. Long-polling is the
           standard workaround and behaves normally in a regular browser too. */
        try { db.settings({ experimentalForceLongPolling:true, merge:true }); } catch(e){}
        fbReady=true; syncStatus='connected — waiting for data…';
      }
      catch(e){ fbReady=false; syncStatus='init error — '+((e&&e.message)||e); } }
    if (fbReady) startSync();
  } else { syncStatus='no Firebase config in file'; }
  window.appSync = {
    ready: function(){ return fbReady; },
    status: function(){
      var pending = Object.keys(dirty);
      return syncStatus +
        '\n\nThis device: ' + deviceId.slice(0,8) +
        (standalone ? ' (home-screen app)' : ' (browser)') +
        '\nChange tracking: ' + trackingMode +
        '\nLast upload from here: ' + (lastPush || 'never — nothing from this device has reached the cloud') +
        '\nWaiting to upload: ' + (pending.length ? pending.length + ' — ' + pending.join(', ') : 'nothing');
    },
    code: function(){ return localStorage.getItem('mwl-synccode'); }
  };
  /* this block now runs after the app script, so nudge the Sync button */
  if (typeof window.refreshSyncBtn === 'function') window.refreshSyncBtn();
})();
</script>

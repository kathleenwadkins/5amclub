<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The 5am Club</title>
<meta name="description" content="Daily, weekly, monthly and annual task system.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="5am Club">
<meta name="theme-color" content="#7a2fb0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237a2fb0'/%3E%3Ctext x='32' y='43' font-family='-apple-system,sans-serif' font-size='26' font-weight='700' fill='%23fff' text-anchor='middle'%3E5a%3C/text%3E%3C/svg%3E">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;1,400&display=swap');
  :root { color-scheme: light;
    --bg:#f9f5f9; --card:#ffffff; --ink:#2a2430; --muted:#8b8393;
    --accent:#7a2fb0; --accent-2:#1fbdd4; --accent-soft:#f3e9fb; --line:#ece4f0;
    --gold:#b8860b; --gold-soft:#fdf3d9;
    --pop:#ff8c42;
    --shadow:0 1px 2px rgba(42,36,48,.05), 0 6px 20px -8px rgba(122,47,176,.18);
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); max-width:640px; margin:0 auto;
    padding:20px 16px calc(28px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased; }
  #confetti { position:fixed; inset:0; width:100%; height:100%;
    pointer-events:none; z-index:9999; }

  /* ---------- header ---------- */
  .hero { background:linear-gradient(135deg,#6d2fb8 0%,#a32f9e 52%,#e0457b 100%);
    border-radius:20px; padding:18px 18px 16px; color:#fff; box-shadow:var(--shadow);
    position:relative; overflow:hidden; }
  .hero::after { content:""; position:absolute; right:-46px; top:-56px; width:180px; height:180px;
    border-radius:50%; background:rgba(255,255,255,.06); }
  .hero h1 { font-size:1.4rem; font-weight:800; letter-spacing:-0.02em; }
  .hero .sub { font-size:0.78rem; opacity:.78; margin-top:3px; }
  .ringwrap { display:flex; align-items:center; gap:14px; margin-top:14px; position:relative; z-index:1; }
  .ring { position:relative; width:62px; height:62px; flex:none; }
  .ring svg { transform:rotate(-90deg); }
  .ring .trk { stroke:rgba(255,255,255,.2); }
  .ring .val { stroke:var(--pop); stroke-linecap:round;
    transition:stroke-dashoffset .5s cubic-bezier(.4,0,.2,1); }
  .ring .num { position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; font-size:0.82rem; font-weight:800; }
  .ringtxt .big { font-size:0.92rem; font-weight:700; }
  .ringtxt .small { font-size:0.74rem; opacity:.75; margin-top:2px; }

  /* ---------- tabs ---------- */
  .tabs { display:flex; gap:4px; margin:16px 0 12px; background:#eee5f2;
    padding:4px; border-radius:12px; }
  .tabs button { flex:1; padding:9px 1px; border:none; border-radius:9px;
    background:none; font-size:0.7rem; font-weight:700; color:var(--muted);
    cursor:pointer; transition:all .18s; white-space:nowrap; }
  .tabs button.on { background:#fff; color:var(--accent); box-shadow:0 1px 3px rgba(0,0,0,.07); }

  .toggle { display:flex; gap:6px; margin:0 0 12px; }
  .toggle button { flex:1; padding:9px 4px; border:1px solid var(--line); background:var(--card);
    border-radius:11px; font-size:0.78rem; font-weight:600; color:var(--muted);
    cursor:pointer; transition:all .18s; }
  .toggle button.on { background:var(--accent); border-color:var(--accent); color:#fff; }

  /* ---------- day strip ---------- */
  .days { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:16px; }
  .days button { padding:9px 0 7px; border:1px solid var(--line); background:var(--card);
    border-radius:12px; cursor:pointer; text-align:center; transition:all .18s; }
  .days button .d { display:block; font-size:0.72rem; font-weight:700; }
  .days button.sel { border-color:var(--accent); background:var(--accent-soft);
    transform:translateY(-1px); box-shadow:var(--shadow); }
  .days button.today .d::after { content:""; display:block; width:4px; height:4px;
    border-radius:50%; background:var(--gold); margin:3px auto 0; }
  .days button.full { background:var(--accent); border-color:var(--accent); }
  .days button.full .d { color:#fff; }
  .mini { display:block; height:3px; border-radius:2px; background:var(--line);
    margin:5px 7px 0; overflow:hidden; }
  .mini i { display:block; height:100%; background:var(--accent-2);
    width:0; transition:width .4s; }
  .days button.full .mini { background:rgba(255,255,255,.3); }
  .days button.full .mini i { background:var(--pop); }

  /* ---------- buckets ---------- */
  .bucket { background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:6px 15px 4px; margin-bottom:11px; box-shadow:var(--shadow); }
  .bucket h2 { font-size:0.68rem; text-transform:uppercase; letter-spacing:0.09em;
    color:var(--muted); padding:12px 0 8px; display:flex; justify-content:space-between;
    align-items:center; }
  .bucket h2 .time { font-weight:500; text-transform:none; letter-spacing:0; opacity:.85; }
  .bucket h2 .nm { -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent; }
  .b-morning h2 .nm { background-image:linear-gradient(90deg,#22c9d8,#2f9fd0); }
  .b-work    h2 .nm { background-image:linear-gradient(90deg,#2f9fd0,#6b6ec9); }
  .b-zone    h2 .nm { background-image:linear-gradient(90deg,#12b3c4,#3f93cf); }
  .b-home    h2 .nm { background-image:linear-gradient(90deg,#7c5cc4,#a544b0); }
  .b-evening h2 .nm { background-image:linear-gradient(90deg,#a544b0,#e0457b); }
  .row { border-top:1px solid var(--line); }
  .row:first-of-type { border-top:none; }
  label.item { display:flex; align-items:flex-start; gap:11px; padding:10px 2px;
    cursor:pointer; font-size:0.89rem; line-height:1.38; }
  label.item input { appearance:none; -webkit-appearance:none; flex:none; width:21px; height:21px;
    border:2px solid #c9bed3; border-radius:7px; margin-top:1px; cursor:pointer;
    position:relative; transition:all .18s; }
  label.item input:active { transform:scale(.88); }
  label.item input:checked { background:var(--accent); border-color:var(--accent); }
  label.item input:checked::after { content:""; position:absolute; left:6px; top:2px; width:5px;
    height:10px; border:solid #fff; border-width:0 2.5px 2.5px 0; transform:rotate(45deg);
    animation:pop .28s cubic-bezier(.2,1.4,.5,1); }
  @keyframes pop { 0%{transform:rotate(45deg) scale(0)} 100%{transform:rotate(45deg) scale(1)} }
  label.item span { transition:color .2s, opacity .2s; }
  label.item input:checked + span { color:var(--muted); text-decoration:line-through;
    opacity:.62; }
  .anchor { color:var(--gold); font-weight:700; }
  .row.gold { background:linear-gradient(90deg,var(--gold-soft),transparent 70%);
    margin:0 -15px; padding:0 15px; }
  .tag.zone { color:#0f7a52; background:#e4f6ee; }
  .tag { display:inline-block; font-size:0.6rem; font-weight:700; text-transform:uppercase;
    letter-spacing:0.06em; color:var(--accent); background:var(--accent-soft);
    border-radius:8px; padding:2px 7px; margin-left:6px; vertical-align:1px; }

  .wnote { display:block; width:calc(100% - 32px); margin:0 0 11px 32px; padding:8px 11px;
    font-size:0.85rem; font-family:inherit; color:var(--ink);
    border:1px dashed #cdc7bd; border-radius:9px; background:#fdfcfa; transition:all .18s; }
  .wnote:focus { outline:none; border:1px solid var(--accent); background:#fff;
    box-shadow:0 0 0 3px var(--accent-soft); }
  .pills { display:flex; gap:6px; margin:0 0 11px 32px; }

  /* ---------- all-tasks ---------- */
  .addform { background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:15px; margin-bottom:14px; box-shadow:var(--shadow); }
  .addform h3 { font-size:0.68rem; text-transform:uppercase; letter-spacing:0.09em;
    color:var(--muted); margin-bottom:11px; }
  .addform input[type=text], .addform select, .addform input[type=date] {
    font-family:inherit; font-size:0.85rem; color:var(--ink); background:#fff;
    border:1px solid var(--line); border-radius:9px; padding:9px 11px; }
  .addform input[type=text] { width:100%; margin-bottom:8px; }
  .addform input[type=text]:focus { outline:none; border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft); }
  .frow { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .frow select, .frow input[type=date] { flex:1; min-width:88px; }
  .addform .go { width:100%; padding:11px; border:none; border-radius:11px;
    background:var(--accent); color:#fff; font-size:0.86rem; font-weight:700;
    cursor:pointer; transition:all .18s; }
  .addform .go:active { transform:scale(.98); }

  .sched { background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:6px 15px 4px; margin-bottom:11px; box-shadow:var(--shadow); }
  .sched h2 { font-size:0.68rem; text-transform:uppercase; letter-spacing:0.09em;
    color:var(--muted); padding:12px 0 6px; display:flex; justify-content:space-between; }
  .sched h2 .hint { font-weight:500; text-transform:none; letter-spacing:0; }
  .srow { display:flex; flex-direction:column; gap:7px; padding:10px 0;
    border-top:1px solid var(--line); font-size:0.85rem; }
  .srow:first-of-type { border-top:none; }
  .stop { display:flex; align-items:center; gap:8px; }
  .srow .lbl { flex:1; line-height:1.3; user-select:none; -webkit-user-select:none; }
  .sctl { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .srow select, .srow input[type=date] { font-family:inherit; font-size:0.76rem;
    border:1px solid var(--line); border-radius:8px; padding:5px 6px; background:#fff;
    color:var(--ink); }
  .srow .del { border:none; background:none; color:#b9534a; font-size:1.15rem;
    cursor:pointer; padding:0 4px; line-height:1; flex:none; }
  /* zone pill — doubles as the picker for moving a task to another zone */
  .srow select.zsel { font-family:inherit; font-size:0.7rem; font-weight:700;
    color:var(--accent); background:var(--accent-soft);
    border:1px solid transparent; border-radius:999px; padding:3px 4px 3px 9px;
    cursor:pointer; flex:none; width:auto; max-width:120px; }
  .srow select.zsel:focus { outline:none; border-color:var(--accent); }
  .srow select.cadsel { font-weight:700; color:var(--accent); }
  .empty { color:var(--muted); font-size:0.8rem; padding:8px 0 12px; }
  /* ---------- spaces ---------- */
  .spaddrow { display:flex; gap:6px; align-items:center; }
  .spaddrow .mealin { flex:1; min-width:0; }
  .spday { font-family:inherit; font-size:0.76rem; font-weight:700; color:var(--accent);
    background:var(--accent-soft); border:1px solid transparent; border-radius:9px;
    padding:7px 6px; cursor:pointer; flex:none; max-width:118px; }
  .spday:focus { outline:none; border-color:var(--accent); }
  .spacecard { padding-top:2px; }
  .sphead { display:flex; align-items:center; gap:8px; padding:12px 0 6px;
    border-bottom:1px solid var(--line); margin-bottom:2px; }
  .spname { font-size:1rem; font-weight:800; letter-spacing:-0.01em; cursor:pointer;
    flex:1 1 auto; min-width:0; line-height:1.2; }
  .spcount { margin-left:auto; font-size:0.68rem; color:var(--muted); font-weight:600;
    flex:none; white-space:nowrap; }
  .spwarn { font-size:0.7rem; color:#a3245a; background:#fbe9f0; border-radius:8px;
    padding:6px 9px; margin:8px 0 2px; }
  .sptaskadd { display:flex; gap:6px; padding:10px 0 6px; border-top:1px solid var(--line); }
  .sptaskadd .mealin { flex:1; min-width:0; }
  /* inside a space card the zone and day just echo the header, so keep them
     quiet — they're controls for the exceptions, not labels */
  .spacecard .srow select.zsel { background:none; color:#b6acc2;
    font-weight:600; font-size:0.64rem; max-width:none; padding:3px 2px 3px 6px; }
  .spacecard .sctl select { color:var(--muted); }
  .spacecard .sctl select.cadsel { color:var(--accent); }
  .srow select.offday { border-color:var(--gold); color:var(--gold) !important;
    background:var(--gold-soft); font-weight:700; }

  /* day heading inside the Weekly group */
  .daysub { display:flex; justify-content:space-between; align-items:baseline;
    font-size:0.8rem; font-weight:700; color:var(--accent);
    padding:12px 0 2px; border-top:1px solid var(--line); margin-top:4px; }
  .daysub:first-of-type { border-top:none; margin-top:0; padding-top:6px; }
  .daysub .dn { font-size:0.66rem; font-weight:600; color:var(--muted); }
  .daysub + .srow { border-top:none; }
  .spnoday { border:none; background:none; font-family:inherit; font-size:0.7rem;
    font-weight:600; color:var(--muted); font-style:italic; cursor:pointer;
    padding:3px 4px; flex:none; }
  .spnoday:active { color:var(--accent); }

  .nncard { background:var(--card); border:1.5px solid #d8c3ea; border-radius:16px;
    padding:6px 15px 4px; margin-bottom:14px; box-shadow:var(--shadow); }
  .nncard h2 { font-size:0.68rem; text-transform:uppercase; letter-spacing:0.09em;
    padding:12px 0 8px; display:flex; justify-content:space-between; align-items:center; }
  .nncard h2 .nm { -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
    background-image:linear-gradient(90deg,#22c9d8,#7c5cc4 55%,#e0457b); }
  .nncard h2 .cnt { font-weight:500; text-transform:none; letter-spacing:0;
    color:var(--muted); }
  .nnhint { font-size:0.76rem; color:var(--muted); line-height:1.45; padding:2px 0 12px; }
  .star { border:none; background:none; cursor:pointer; padding:8px 2px 8px 8px;
    font-size:0.95rem; line-height:1; color:#cfc6d6; flex:none; transition:all .15s; }
  .star.on { color:var(--gold); }
  .star:active { transform:scale(.85); }
  .bump { border:none; background:none; cursor:pointer; padding:8px 2px 8px 6px;
    font-size:1rem; line-height:1; color:#c3b9cd; flex:none; transition:all .15s; }
  .bump:active { transform:translateX(3px); }
  .bump.back { color:var(--accent); }
  .bump.back:active { transform:translateX(-3px); }
  .b-extra h2 .nm { background-image:linear-gradient(90deg,#e0457b,#a544b0); }
  .exbtn { border:none; background:none; cursor:pointer; padding:8px 3px;
    font-size:0.88rem; line-height:1; color:#b6acc2; flex:none; transition:all .15s; }
  .exbtn:active { transform:scale(.86); color:var(--accent); }
  .exbtn.del { color:#c98b84; font-size:1.05rem; }
  .exbtn.del:active { color:#b9534a; }
  .exadd { display:flex; gap:6px; padding:10px 0 6px; border-top:1px solid var(--line); }
  .exadd input { flex:1; font-family:inherit; font-size:0.85rem; color:var(--ink);
    background:#fff; border:1px solid var(--line); border-radius:9px; padding:9px 11px; }
  .exadd input:focus { outline:none; border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft); }
  .exadd button { border:none; border-radius:9px; background:var(--accent); color:#fff;
    font-size:0.82rem; font-weight:700; padding:0 16px; cursor:pointer; }
  .exadd button:active { transform:scale(.97); }
  .exnote { font-size:0.72rem; color:var(--muted); padding:2px 0 10px; }
  .mealrow { display:flex; align-items:center; gap:10px; padding:7px 0;
    border-top:1px solid var(--line); }
  .mealrow:first-of-type { border-top:none; }
  .mealday { font-size:0.72rem; font-weight:700; color:var(--accent);
    width:34px; flex:none; }
  .mealin { flex:1; font-family:inherit; font-size:0.85rem; color:var(--ink);
    background:#fff; border:1px solid var(--line); border-radius:8px; padding:7px 10px; }
  .mealin:focus { outline:none; border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft); }
  .pulled { color:var(--accent); font-weight:500; }
  .pullempty { color:var(--muted); font-style:italic; opacity:.8; }

  /* ---------- week planning ---------- */
  .grocerylink { display:flex; align-items:center; justify-content:center; gap:6px;
    text-decoration:none; background:linear-gradient(120deg,#22c9d8,#7c5cc4);
    color:#fff; font-size:0.85rem; font-weight:700; padding:12px; border-radius:14px;
    margin-bottom:14px; box-shadow:var(--shadow); }
  .planrow { display:flex; align-items:center; gap:8px; padding:6px 0;
    border-top:1px solid var(--line); }
  .planrow:first-of-type { border-top:none; }
  .planctrl { display:flex; flex-direction:column; gap:2px; flex:none; }
  .planctrl button { border:none; background:none; color:#b6acc2; cursor:pointer;
    font-size:0.75rem; line-height:1; padding:2px 4px; }
  .planctrl button:disabled { opacity:.25; cursor:default; }
  .planctrl button:active:not(:disabled) { color:var(--accent); }
  .timerow { display:flex; align-items:center; gap:10px; padding:9px 0;
    border-top:1px solid var(--line); }
  .timerow:first-of-type { border-top:none; }
  .timelbl { flex:1; font-size:0.84rem; line-height:1.3; }
  .timein { flex:none; font-family:inherit; font-size:0.82rem; font-weight:700;
    color:var(--accent); background:#fff; border:1px solid var(--line);
    border-radius:9px; padding:6px 8px; }
  .timein:focus { outline:none; border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft); }
  .milesrow { display:flex; align-items:center; gap:8px; padding:0 0 9px 42px; }
  .milesrow .mlbl { font-size:0.72rem; color:var(--muted); }
  .milesrow input { flex:none; width:64px; font-family:inherit; font-size:0.78rem; color:var(--ink);
    background:#fff; border:1px solid var(--line); border-radius:8px; padding:5px 8px; }
  .milesrow input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }

  /* ---------- work ---------- */
  .waiting { background:linear-gradient(135deg,#6d2fb8,#a32f9e 55%,#e0457b); color:#fff;
    border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:14px; }
  .waiting .wn { font-size:2.4rem; font-weight:800; line-height:1; }
  .waiting .wt { font-size:0.82rem; opacity:.92; line-height:1.35; }
  .waiting .wact { margin-left:auto; display:flex; flex-direction:column; gap:6px; }
  .waiting a, .waiting button { border:none; border-radius:9px; background:rgba(255,255,255,.9);
    color:#7a2fb0; font-size:0.72rem; font-weight:700; padding:7px 11px; cursor:pointer;
    text-decoration:none; text-align:center; white-space:nowrap; }
  .wlink { display:flex; align-items:center; gap:8px; text-decoration:none;
    padding:11px 13px; border:1px solid var(--line); border-radius:12px; background:var(--card);
    color:var(--ink); font-size:0.88rem; font-weight:600; margin-bottom:8px; box-shadow:var(--shadow); }
  .wlink .ar { margin-left:auto; color:var(--muted); }
  .waddrow { display:flex; gap:6px; margin-bottom:8px; }
  .waddrow input[type=text] { flex:1 1 auto; min-width:0; }
  .waddrow input[type=date] { flex:none; width:118px; min-width:0; max-width:40%; }
  .wtask { display:flex; align-items:center; gap:10px; padding:9px 0;
    border-top:1px solid var(--line); font-size:0.88rem; }
  .wtask:first-of-type { border-top:none; }
  .wtask input[type=checkbox] { appearance:none; -webkit-appearance:none; width:20px; height:20px;
    border:2px solid #c9bed3; border-radius:6px; flex:none; cursor:pointer; position:relative; }
  .wtask input:checked { background:var(--accent); border-color:var(--accent); }
  .wtask input:checked::after { content:""; position:absolute; left:5px; top:1px; width:5px; height:10px;
    border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg); }
  .wtask .wl { flex:1; }
  .wtask.done .wl { color:var(--muted); text-decoration:line-through; opacity:.6; }
  .wtask .due { font-size:0.7rem; font-weight:700; padding:2px 8px; border-radius:8px;
    background:var(--accent-soft); color:var(--accent); white-space:nowrap; }
  .wtask .due.over { background:#fbe9f0; color:#a3245a; }
  .wtask .wx { border:none; background:none; color:#b9534a; font-size:1.1rem; cursor:pointer; padding:0 2px; }
  .wbtn { border:1px solid var(--line); background:var(--card); color:var(--accent);
    font-size:0.74rem; font-weight:700; padding:8px 14px; border-radius:9px; cursor:pointer; }
  .wbtn:active { background:var(--accent-soft); }
  .worksubhead { font-size:0.85rem; font-weight:700; color:var(--accent);
    padding:10px 0 3px; border-top:1px solid var(--line); }
  .worksubhead:first-of-type { border-top:none; }
  .wtask.sub { padding-left:20px; border-top:none; }
  /* editing the standing work list */
  #workView .pcard h3 { display:flex; justify-content:space-between; align-items:center; }
  .wkedit { border:1px solid #E5E5E5; background:#fff; color:#111111; font-family:inherit;

const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const BUCKET_SEED = ['Home','Kitchen','Living Area','Bedrooms','Bathrooms','Entrance',
  'Grocery','Misc','Morning','Work Day','Evening'];

/* ================= confetti ================= */
const cvs = document.getElementById('confetti');
const ctx = cvs.getContext('2d');
let parts = [], raf = null;
function sizeCanvas(){
  const dpr = window.devicePixelRatio || 1;
  cvs.width = innerWidth * dpr; cvs.height = innerHeight * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
sizeCanvas(); addEventListener('resize', sizeCanvas);
const COLORS = ['#7a2fb0','#e0457b','#1fbdd4','#ffd166','#ff8c42','#a32f9e','#3ddc97'];
function burst(x, y, n, power){
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, s = (Math.random()*0.6+0.5)*power;
    parts.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - power*0.5,
      w:Math.random()*6+4, h:Math.random()*4+3, rot:Math.random()*6.28,
      vr:(Math.random()-0.5)*0.4, c:COLORS[(Math.random()*COLORS.length)|0],
      life:0, max:60+Math.random()*35 });
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts = parts.filter(p=>p.life < p.max);
  parts.forEach(p=>{
    p.life++; p.vy += 0.32; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    ctx.globalAlpha = Math.max(0, 1 - p.life/p.max);
    ctx.fillStyle = p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
  });
  if (parts.length) raf = requestAnimationFrame(tick);
  else { raf = null; ctx.clearRect(0,0,innerWidth,innerHeight); }
}
function burstAt(el, big){
  const r = el.getBoundingClientRect();
  burst(r.left + r.width/2, r.top + r.height/2, big?90:14, big?9:5);
}
function celebrate(){

let tasks;
/* There used to be a schema check here that wiped the whole task list when a
   version constant changed. Harmless when everything was a default; now that
   the list is yours, it was a loaded gun — removed. */
try { tasks = JSON.parse(localStorage.getItem('mwl-tasklist')); } catch(e){ tasks = null; }
if (!Array.isArray(tasks)) tasks = [];
let seeded = [];
try { seeded = JSON.parse(localStorage.getItem('mwl-seeded') || '[]'); } catch(e){ seeded = []; }
DEFAULT_TASKS.forEach(d=>{
  if (!seeded.includes(d.id)){
    if (!tasks.find(t=>t.id===d.id)) tasks.push(Object.assign({}, d));
    seeded.push(d.id);
  }
});

/* one-time corrections to already-seeded tasks */
const PATCHES = [
  { key:'d6-rename', id:'d6', when:t=>t.label==='Sweep or vacuum',
    apply:t=>{ t.label = 'Quick floor cleanup'; } },
  { key:'d2-weekly', id:'d2', when:t=>t.cad==='daily',
    apply:t=>{ t.label='Empty trashes'; t.cad='weekly'; t.day='Sun'; } }
];
let patched = [];
try { patched = JSON.parse(localStorage.getItem('mwl-patched') || '[]'); } catch(e){ patched = []; }
PATCHES.forEach(p=>{
  if (patched.includes(p.key)) return;
  const t = tasks.find(x=>x.id===p.id);
  if (t && p.when(t)) p.apply(t);
  patched.push(p.key);
});
localStorage.setItem('mwl-patched', JSON.stringify(patched));
localStorage.setItem('mwl-seeded', JSON.stringify(seeded));
localStorage.setItem('mwl-tasklist', JSON.stringify(tasks));
function saveTasks(){ localStorage.setItem('mwl-tasklist', JSON.stringify(tasks)); }

/* ================= spaces =================
   A space is a room or area with a day of the week attached. Tasks added to a
   space inherit that day, so you set "Kitchen = Monday" once instead of
   picking Monday on every kitchen task. */
let spaces = null;
try { spaces = JSON.parse(localStorage.getItem('mwl-spaces') || 'null'); } catch(e){ spaces = null; }
function saveSpaces(){ localStorage.setItem('mwl-spaces', JSON.stringify(spaces)); }
function newSpaceId(){ return 'sp' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
if (!Array.isArray(spaces) || !spaces.length){
  /* first run: build spaces out of the zones already in use, giving each the
     day most of its tasks already sit on */
  const byZone = {};
  tasks.forEach(t=>{ if (t.bucket) (byZone[t.bucket] = byZone[t.bucket] || []).push(t); });
  const names = BUCKET_SEED.filter(n=>byZone[n])
    .concat(Object.keys(byZone).filter(n=>BUCKET_SEED.indexOf(n) === -1));
  spaces = names.map(n=>{
    const tally = {};
    byZone[n].forEach(t=>{ if (t.day) tally[t.day] = (tally[t.day]||0) + 1; });
    let day = 'Mon', best = 0;
    Object.keys(tally).forEach(d=>{ if (tally[d] > best){ best = tally[d]; day = d; } });
    return { id:newSpaceId(), name:n, day:day };
  });
  if (!spaces.length) spaces = [{ id:newSpaceId(), name:'Home', day:'Mon' }];
  saveSpaces();
}
function spaceNames(){ return spaces.map(s=>s.name); }
/* Seeded defaults still carry the old zone name. If that space has been
   renamed, follow it — otherwise a newly added default lands orphaned. */
(function(){
  if (spaceByName('Home') || !spaceByName('Around the House')) return;
  let moved = false;
  tasks.forEach(t=>{ if (t.bucket === 'Home'){ t.bucket = 'Around the House'; moved = true; } });
  if (moved) saveTasks();
})();

function spaceByName(n){ return spaces.filter(s=>s.name === n)[0] || null; }
function tasksInSpace(name){ return tasks.filter(t=>t.bucket === name); }
function orphanTasks(){
  const known = spaceNames();
  return tasks.filter(t=>known.indexOf(t.bucket) === -1);
}
/* Moving a space moves the tasks that were following it, and leaves alone any
   you'd deliberately set to a different day. Passing null means "no fixed day"
   — for a catch-all space whose tasks are spread across the week — and leaves
   every task's own day untouched. */
function setSpaceDay(sp, day){
  if (!day){ sp.day = null; saveSpaces(); render(); return; }
  const wasFollowing = sp.day ? tasksInSpace(sp.name).filter(t=>t.day === sp.day) : [];
  sp.day = day;
  wasFollowing.forEach(t=>{ if (t.cad !== 'daily' && t.cad !== 'once') t.day = day; });
  saveSpaces(); saveTasks(); render();
}
function renameSpace(sp, name){
  const old = sp.name;
  sp.name = name;
  tasks.forEach(t=>{ if (t.bucket === old) t.bucket = name; });
  saveSpaces(); saveTasks(); render();
}
/* "Home" was never really a one-day zone — it holds daily habits, scattered
   monthly jobs and a dozen Saturday deep-clean projects. Give it an honest
   name and no fixed day; each task keeps whatever day it already had. */
if (!localStorage.getItem('mwl-aroundhouse-v1')){
  const h = spaceByName('Home');
  if (h){
    h.name = 'Around the House';
    h.day = null;
    tasks.forEach(t=>{ if (t.bucket === 'Home') t.bucket = 'Around the House'; });
    saveSpaces(); saveTasks();
  }
  localStorage.setItem('mwl-aroundhouse-v1','1');
}

/* ================= fixed rhythm ================= */

const TIME_DEFAULTS = {

function tRaw(k){ return times[k] || TIME_DEFAULTS[k] || ''; }
/* "05:00" -> "5:00", "18:00" -> "6:00" — am/pm is obvious from context */
function tf(k){
  const v = tRaw(k), p = v.split(':');
  if (p.length !== 2) return v;
  const h = parseInt(p[0],10);
  return ((h % 12) === 0 ? 12 : h % 12) + ':' + p[1];
}

/* ================= right now =================
   The routine already knows every time of day; this reads the clock and says
   which block you're in, so at 5am you don't have to decide. */
function tMin(k){ const p = tRaw(k).split(':'); return (+p[0])*60 + (+p[1]); }
function rightNow(){
  const d = new Date();
  const dow = DAYS[d.getDay()];
  if (dow === 'Sat' || dow === 'Sun') return null;   /* weekends aren't clocked */
  const mins = d.getHours()*60 + d.getMinutes();
  const segs = [
    [tMin('wake'),      tMin('block'),      'Laundry, bed, caffeine'],
    [tMin('block'),     tMin('devotional'), 'Devotional'],
    [tMin('workout'),   tMin('james'),      'Workout'],
    [tMin('james'),     tMin('kids'),       'Wake James'],
    [tMin('kids'),      tMin('leave'),      'Wake Bennett & Emma'],
    [tMin('leave'),     tMin('workstart'),  'School run'],
    [tMin('workstart'), tMin('workend'),    'Work — walking pad on'],
    [tMin('workend'),   tMin('dinner'),     'Home — dinner prep'],
    [tMin('dinner'),    tMin('bath'),       'Dinner'],
    [tMin('bath'),      tMin('kidsbed'),    'Bathtime'],
    [tMin('kidsbed'),   tMin('mybed'),      'Kitchen reset, lay out tomorrow'],
    [tMin('mybed'),     24*60,              'In bed']
  ].filter(s=>s[1] > s[0]);
  const clock = ((d.getHours()%12)===0?12:d.getHours()%12) + ':' + String(d.getMinutes()).padStart(2,'0');
  if (mins < tMin('wake')) return { clock, label:'Still asleep', sub:'Up at ' + tf('wake') };
  for (let i=0;i<segs.length;i++){
    const s = segs[i];
    if (mins >= s[0] && mins < s[1]){
      const nx = segs[i+1];
      const endH = Math.floor(s[1]/60), endM = String(s[1]%60).padStart(2,'0');
      const end = ((endH%12)===0?12:endH%12) + ':' + endM;
      return { clock, label:s[2],
        sub: s[1] < 24*60 ? ('until ' + end + (nx ? ' \u00b7 then ' + nx[2] : '')) : '' };
    }
  }
  return { clock, label:'In bed', sub:'' };
}

  /* The 4th slot on each row is a permanent id. Checkmarks and pinned
     non-negotiables key off it instead of the row's position, so editing the
     routine — adding, removing or reordering a line, or changing a time —
     can never shunt them onto the wrong row. */
  if (day === 'Sat') return {
    Morning: { time:'flex', items:[
      ['Wake by 6:30 — keep the rhythm, gently', false, null, 'wake'],
      ['Make the bed', false, null, 'makebed'],
      ['Devotional', false, null, 'devotional'],
      ['Workout', true, 'workout', 'workout'],
      ['Start a load of laundry', false, null, 'laundry-start']
    ]},

      ['One household project or errand — just one', false, null, 'project'],
      ['Fold + put away laundry', false, null, 'laundry-fold']
    ]},

      ['Kid time — something they pick', true, null, 'kidtime'],
      ['Kitchen reset', false, null, 'kitchen'],
      ['In bed by 9:30', false, 'bed', 'bed']
    ]}
  };

    return {
      Morning: { time:'flex', items:[
        ['Wake by 6:30', false, null, 'wake'],
        ['Make the bed', false, null, 'makebed'],
        ['Devotional', false, null, 'devotional'],
        ['Workout', false, 'workout', 'workout'],
        ['Start a load of laundry', false, null, 'laundry-start']
      ]},
      'Planning block': { time:'planning block', items:[
        ['Meal plan the week — anchor to proteins on hand', true, null, 'mealplan'],
        ['Build the prep list (what gets done at each lunch break)', false, null, 'preplist'],
        ['Fold + put away laundry', false, null, 'laundry-fold']
      ]},
      Evening: { time:'wind down', items:[
        ['Kid time — something they pick', true, null, 'kidtime'],
        ['Kitchen reset', false, null, 'kitchen'],
        ['Pack backpack + lunch for Monday', true, null, 'backpack'],
        ['In bed by 9:15 — Monday\u2019s workout starts tonight', true, 'bed', 'bed']
      ]}
    };
  }
  return {
    Morning: { time: tf('wake')+' \u2013 '+tf('leave'), items:[
      ['Wake '+tf('wake')+' \u2014 feet on floor, no snooze', true, 'wake', 'wake'],
      ['Fold + put away laundry', false, null, 'laundry-fold'],
      ['Make the bed', false, null, 'makebed'],
      ['Devotional', false, null, 'devotional'],
      ['Workout', true, 'workout', 'workout'],
      ['Wake James \u2014 '+tf('james'), false, null, 'wake-james'],
      ['Wake Bennett & Emma \u2014 '+tf('kids'), false, null, 'wake-kids'],
      ['Out the door for dropoff \u2014 '+tf('leave'), true, null, 'leave']
    ]},
    'Work Day': { time: tf('workstart')+' \u2013 '+tf('workend'), items:[
      ['', false, 'steps', 'steps'],
      ['Lunch break: dinner prep (chop, marinate, or crockpot on)', true, null, 'lunchprep'],
      ['Hard stop by '+tf('workend'), false, null, 'hardstop']
    ]},
    'Daily tasks': { time:'fits in the gaps', items:[
      ['Start a load of laundry', false, null, 'laundry-start'],
      ['Switch laundry to dryer (mid-morning)', false, null, 'laundry-dryer'],
      ['10-min toy pickup with the kids', false, null, 'toypickup']
    ]},
    Evening: { time: tf('dinner')+' \u2013 '+tf('mybed'), items:[
      ['Dinner on the table at '+tf('dinner'), false, 'meal', 'dinner'],
      ['Kid time \u2014 20 minutes, undivided, after dinner', true, null, 'kidtime'],
      ['Bathtime \u2014 '+tf('bath'), false, null, 'bath'],
      ['Kids down by '+tf('kidsbed'), false, null, 'kidsbed'],
      ['Kitchen reset + dishwasher running', false, null, 'kitchen'],
      ['Lay out workout clothes + tomorrow\u2019s top 3', false, null, 'layout'],
      ['In bed by '+tf('mybed')+' \u2014 this protects tomorrow\u2019s workout', true, 'bed', 'bed']
    ]}
  };
}

/* ================= dates ================= */
/* the week runs Sunday → Saturday */
function weekStartOf(d){
  const x = new Date(d);
  x.setDate(x.getDate() - x.getDay());   /* getDay(): 0 = Sunday */
  x.setHours(0,0,0,0); return x;
}
const now = new Date();
const weekStart = weekStartOf(now);
const weekKey = 'mwl-' + weekStart.toISOString().slice(0,10);
/* The week used to start on Monday, so this week's checkmarks sit under a
   different key. Carry over only the days that fall on the SAME actual date
   under both schemes — otherwise a Sunday changeover would drag last Monday's
   ticks onto next Monday. */
(function(){
  if (localStorage.getItem(weekKey)) return;
  const oldStart = new Date(now);
  oldStart.setDate(oldStart.getDate() - ((oldStart.getDay()+6)%7));
  oldStart.setHours(0,0,0,0);
  const oldKey = 'mwl-' + oldStart.toISOString().slice(0,10);
  let prev = null;
  try { prev = JSON.parse(localStorage.getItem(oldKey) || 'null'); } catch(e){}
  if (!prev || typeof prev !== 'object') return;
  const OLD_DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const sameDate = {};
  DAYS.forEach(dn=>{
    const o = new Date(oldStart); o.setDate(o.getDate() + OLD_DAYS.indexOf(dn));
    const n = new Date(weekStart); n.setDate(n.getDate() + DAYS.indexOf(dn));
    sameDate[dn] = o.getTime() === n.getTime();
  });
  const dayOf = k=>{
    const p = String(k).split('|');
    if (p[0] === 'ANCH') return p[2];
    if (p[0] === 'T' || p[0] === 'wnote') return p[1];
    if (p.length === 3) return p[0];        /* Day|Bucket|index */
    if (p.length === 4) return p[1];        /* legacy mode|Day|Bucket|index */
    return null;                            /* week-wide, e.g. EXW */
  };
  const carried = {};
  Object.keys(prev).forEach(k=>{
    const dn = dayOf(k);
    if (dn === null || sameDate[dn]) carried[k] = prev[k];
  });
  localStorage.setItem(weekKey, JSON.stringify(carried));
})();
function dateFor(dn){ const d = new Date(weekStart); d.setDate(d.getDate()+DAYS.indexOf(dn)); return d; }
function wom(d){ return Math.floor((d.getDate()-1)/7)+1; }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function occursOn(t, d){
  const dn = DAYS[d.getDay()];
  if (t.cad === 'daily') return true;
  if (t.cad === 'once') return t.date === ymd(d);
  if (t.day !== dn) return false;
  if (t.cad === 'weekly') return true;
  if (t.cad === 'monthly') return wom(d) === t.week;
  if (t.cad === 'quarterly') return wom(d) === t.week && QMONTHS.includes(d.getMonth());
  if (t.cad === 'annual') return wom(d) === t.week && d.getMonth() === t.month;
  return false;
}
function tasksOn(dn){ const d = dateFor(dn); return tasks.filter(t=>occursOn(t,d)); }
function occursAnyDay(t){ return DAYS.some(d=>occursOn(t, dateFor(d))); }
function autoDay(){
  let best='Mon', bestN=Infinity;
  DAYS.forEach(dn=>{ const n = tasks.filter(t=>t.day===dn).length; if (n<bestN){bestN=n;best=dn;} });
  return best;
}
function autoWeek(cad){
  let best=1, bestN=Infinity;
  for (let w=1;w<=4;w++){ const n = tasks.filter(t=>t.cad===cad&&t.week===w).length; if (n<bestN){bestN=n;best=w;} }
  return best;
}
/* Switch a task's cadence in place, filling in whatever the new cadence needs
   and dropping what it doesn't — so no delete-and-re-add. */
function changeCadence(t, cad){
  t.cad = cad;
  if (cad === 'daily'){
    delete t.day; delete t.week; delete t.month; delete t.date;
  } else if (cad === 'once'){
    delete t.day; delete t.week; delete t.month;
    if (!t.date){ const d = new Date(now); d.setDate(d.getDate()+1); t.date = ymd(d); }
  } else {
    delete t.date;
    if (!t.day) t.day = autoDay();
    if (cad === 'weekly'){ delete t.week; delete t.month; }
    else {
      if (!t.week) t.week = autoWeek(cad);
      if (cad === 'annual'){ if (typeof t.month !== 'number') t.month = now.getMonth(); }
      else delete t.month;
    }
  }
  saveTasks(); render();
}

/* ================= state ================= */
let state = {};
try { state = JSON.parse(localStorage.getItem(weekKey) || '{}'); } catch(e){ state = {}; }
/* There's one rhythm now — no summer/school switch. Routine checkboxes and
   pinned non-negotiables used to be filed under the active mode, so strip that
   prefix off anything already saved rather than orphaning it. */
(function(){
  const was = localStorage.getItem('mwl-version') || 'school';
  let touched = false;
  Object.keys(state).forEach(k=>{
    const p = k.split('|');
    if (p.length === 4 && (p[0] === 'now' || p[0] === 'school')){
      if (p[0] === was && state[k] && state[p.slice(1).join('|')] === undefined){
        state[p.slice(1).join('|')] = state[k];
      }
      delete state[k]; touched = true;
    }
  });
  if (touched) save();
  ['mwl-version','mwl-version-era'].forEach(k=>{ try { localStorage.removeItem(k); } catch(e){} });
})();
let stepsPerMile = +localStorage.getItem('mwl-stepspermile') || 2318;
let view = localStorage.getItem('mwl-view') || 'week';
let lastRenderedView = null;
let selDay = DAYS[now.getDay()];

function save(){ localStorage.setItem(weekKey, JSON.stringify(state)); }

/* walking-pad miles — keyed by real date in its own store, so they survive the
   weekly reset and can be trended like weight. */
let milesLog = {};
try { milesLog = JSON.parse(localStorage.getItem('mwl-miles') || '{}'); } catch(e){ milesLog = {}; }
function saveMiles(){ localStorage.setItem('mwl-miles', JSON.stringify(milesLog)); }
function getMiles(dn){ const v = milesLog[ymd(dateFor(dn))]; return (v || v === 0) ? v : ''; }
function setMiles(dn, v){
  const k = ymd(dateFor(dn));
  if (v === '' || v === null || isNaN(parseFloat(v))) delete milesLog[k];
  else milesLog[k] = parseFloat(v);
  saveMiles();
}

/* Workout / wake / bed are tracked by their own keys rather than by a routine
   row's position, so streaks survive the routine being edited or reset. */
function anchorKey(kind, day){ return 'ANCH|'+kind+'|'+day; }
if (!localStorage.getItem('mwl-anchmig-v1')){
  DAYS.forEach(dn=>{
    const plan = fixedPlan(dn);
    for (const b in plan){
      plan[b].items.forEach((it,i)=>{
        if (!state[fixedId(dn,b,it[3])]) return;
        if (it[2] === 'workout' || it[2] === 'wake' || it[2] === 'bed')
          state[anchorKey(it[2], dn)] = true;
      });
    }
  });
  save();
  localStorage.setItem('mwl-anchmig-v1','1');
}

/* miles used to live in the per-week state bucket, which meant they vanished
   every Monday — carry anything already logged into the permanent store. */
if (!localStorage.getItem('mwl-milesmig-v1')){
  DAYS.forEach(dn=>{
    const v = parseFloat(state['MI|'+dn]);
    if (v > 0) milesLog[ymd(dateFor(dn))] = v;
    delete state['MI|'+dn];
  });
  saveMiles(); save();
  localStorage.setItem('mwl-milesmig-v1','1');
}

/* non-negotiables: up to 5 per day, persist across weeks */
let nn = {};
try { nn = JSON.parse(localStorage.getItem('mwl-nn') || '{}'); } catch(e){ nn = {}; }
/* pins were filed per mode too — fold them down to just the day */
(function(){
  let touched = false;
  ['now','school'].forEach(ver=>{
    DAYS.forEach(dn=>{
      const old = ver+'|'+dn;
      if (!nn[old]) return;
      if (!nn[dn] || !nn[dn].length) nn[dn] = nn[old];
      delete nn[old]; touched = true;
    });
  });
  if (touched) localStorage.setItem('mwl-nn', JSON.stringify(nn));
})();
function nnKey(day){ return day; }
function nnList(day){ return nn[nnKey(day)] || []; }
function nnHas(day, rk){ return nnList(day).indexOf(rk) !== -1; }
function nnToggle(day, rk){
  const k = nnKey(day); const list = nn[k] || [];
  const i = list.indexOf(rk);
  if (i !== -1) list.splice(i,1);
  else { if (list.length >= 5) return false; list.push(rk); }
  nn[k] = list; localStorage.setItem('mwl-nn', JSON.stringify(nn));
  return true;
}
function fixedId(d,b,slug){ return d+'|'+b+'|'+slug; }
/* Ticks and pins used to be filed by a row's position, so any routine edit
   shifted them onto the wrong row. Re-file them against the row ids, matching
   by position one final time. */
if (!localStorage.getItem('mwl-slugmig-v1')){
  let movedState = false, movedPins = false;
  DAYS.forEach(dn=>{
    const plan = fixedPlan(dn);
    for (const b in plan){
      plan[b].items.forEach((it,i)=>{
        const slug = it[3]; if (!slug) return;
        const oldK = dn+'|'+b+'|'+i, newK = dn+'|'+b+'|'+slug;
        if (state[oldK] !== undefined && state[newK] === undefined){
          state[newK] = state[oldK]; delete state[oldK]; movedState = true;
        }
        const oldRk = b+'#'+i, newRk = b+'#'+slug;
        const list = nn[dn];
        if (list){
          const at = list.indexOf(oldRk);
          if (at !== -1){ list[at] = newRk; movedPins = true; }
        }
      });
    }
  });
  if (movedState) save();
  if (movedPins) localStorage.setItem('mwl-nn', JSON.stringify(nn));
  localStorage.setItem('mwl-slugmig-v1','1');
}

/* The routine's "Home" block became 'Daily tasks' on weekdays and got a plainer
   name at weekends — carry its ticks and pins over to the new block names. */
if (!localStorage.getItem('mwl-blockmig-v1')){
  const rename = dn => dn === 'Sat' ? 'Weekend block' : dn === 'Sun' ? 'Planning block' : 'Daily tasks';
  let movedState = false, movedPins = false;
  DAYS.forEach(dn=>{
    const to = rename(dn);
    Object.keys(state).forEach(k=>{
      const p = k.split('|');
      if (p.length === 3 && p[0] === dn && p[1] === 'Home'){
        const nk = dn+'|'+to+'|'+p[2];
        if (state[nk] === undefined){ state[nk] = state[k]; }
        delete state[k]; movedState = true;
      }
    });
    const list = nn[dn];
    if (list) list.forEach((rk,idx)=>{
      if (rk.indexOf('Home#') === 0){ list[idx] = to + '#' + rk.slice(5); movedPins = true; }
    });
  });
  if (movedState) save();
  if (movedPins) localStorage.setItem('mwl-nn', JSON.stringify(nn));
  localStorage.setItem('mwl-blockmig-v1','1');
}

/* Sunday's "Rest day" line became a Workout row that pulls from the Plan tab,
   so move its tick and any pin onto the new row id. */
if (!localStorage.getItem('mwl-sunworkout-v1')){
  const from = 'Sun|Morning|rest', to = 'Sun|Morning|workout';
  if (state[from] !== undefined && state[to] === undefined){ state[to] = state[from]; }
  if (state[from] !== undefined){ delete state[from]; save(); }
  const list = nn['Sun'];
  if (list){
    const at = list.indexOf('Morning#rest');
    if (at !== -1){ list[at] = 'Morning#workout'; localStorage.setItem('mwl-nn', JSON.stringify(nn)); }
  }
  localStorage.setItem('mwl-sunworkout-v1','1');
}
function storeId(d,t){ return 'T|'+d+'|'+t; }
function noteId(d){ return 'wnote|'+d; }

/* tasks bumped to another day — lives in week state, so it clears on reset */
function movedTo(t){ return state['MV|'+t.id]; }
function liveTasksOn(dn){
  return tasks.filter(t=>{
    if (t.cad === 'daily') return true;
    const mv = movedTo(t);
    if (mv && occursAnyDay(t)) return mv === dn;
    return occursOn(t, dateFor(dn));
  });
}
function nextDay(dn){ return DAYS[(DAYS.indexOf(dn)+1)%7]; }

/* free-text extras — one weekly list, shown every day, cleared on reset */
if (!state['EXW']){
  let merged = [];
  Object.keys(state).forEach(k=>{ if (k.indexOf('EX|')===0 && Array.isArray(state[k])) merged = merged.concat(state[k]); });
  if (merged.length) state['EXW'] = merged;
}
function extras(){ return state['EXW'] || []; }
function addExtra(text){
  const list = extras().slice();
  list.push({ t:text, d:false });
  state['EXW'] = list; save();
}
function editExtra(idx, text){
  const list = extras().slice();
  if (!list[idx]) return;
  list[idx] = { t:text, d:list[idx].d };
  state['EXW'] = list; save();
}
/* Non-negotiables pin an extra by its position ('EX#2'), so removing one has to
   shift those pins down or they'd point at the wrong to-do. */
function deleteExtra(idx){
  const list = extras().slice();
  if (!list[idx]) return;
  list.splice(idx, 1);
  state['EXW'] = list;
  let touched = false;
  Object.keys(nn).forEach(k=>{
    const out = [];
    (nn[k] || []).forEach(rk=>{
      if (rk.indexOf('EX#') !== 0){ out.push(rk); return; }
      const j = +rk.slice(3);
      if (j === idx){ touched = true; return; }
      if (j > idx){ out.push('EX#'+(j-1)); touched = true; return; }
      out.push(rk);
    });
    nn[k] = out;
  });
  if (touched) localStorage.setItem('mwl-nn', JSON.stringify(nn));
  save();
}

try { workouts = JSON.parse(localStorage.getItem('mwl-workouts') || '{}'); } catch(e){ workouts = {}; }

function getMeal(d){ return meals[d] || ''; }

function dayProgress(day){
  const plan = fixedPlan(day);
  let total=0, done=0;
  for (const b in plan){ plan[b].items.forEach(it=>{ total++; if (state[fixedId(day,b,it[3])]) done++; }); }
  liveTasksOn(day).forEach(t=>{ total++; if (state[storeId(day,t.id)]) done++; });
  extras().forEach(x=>{ total++; if (x.d) done++; });
  return { total, done };
}

/* ========== history + streaks ========== */
let history = {};
try { history = JSON.parse(localStorage.getItem('mwl-history') || '{}'); } catch(e){ history = {}; }
function ymdToDate(s){ const a=s.split('-').map(Number); return new Date(a[0],a[1]-1,a[2]); }
function dowKey(d){ return DAYS[d.getDay()]; }

function dayFacts(day){
  return {
    workoutDone: !!state[anchorKey('workout',day)],
    wakeDone: !!state[anchorKey('wake',day)],
    bedDone: !!state[anchorKey('bed',day)]
  };
}
function snapshotToday(){
  // Snapshot every day of THIS week up through today from the live checkboxes,
  // so ticking a past day (e.g. yesterday's workout) still counts.
  //
  // Days before today are UPGRADE-ONLY: a recorded workout can never be
  // un-recorded by clearing checkboxes. That's what makes "Reset week" safe —
  // it wipes the boxes for a fresh week without erasing the streak behind them.
  const today = new Date(now); today.setHours(0,0,0,0);
  DAYS.forEach((wd,idx)=>{
    const d = new Date(weekStart); d.setDate(d.getDate()+idx); d.setHours(0,0,0,0);
    if (d > today) return;
    const f = dayFacts(wd);
    const p = dayProgress(wd);
    const key = ymd(d);
    const pct = p.total ? Math.round(100*p.done/p.total) : 0;
    const prev = history[key];
    if (d < today && prev){
      history[key] = {
        p: Math.max(prev.p||0, pct),
        w: !!prev.w || f.workoutDone,
        k: !!prev.k || f.wakeDone,
        b: !!prev.b || f.bedDone,
        dn: Math.max(prev.dn||0, p.done),
        tt: Math.max(prev.tt||0, p.total)
      };
    } else {
      history[key] = { p:pct, w:f.workoutDone, k:f.wakeDone, b:f.bedDone, dn:p.done, tt:p.total };
    }
  });
  localStorage.setItem('mwl-history', JSON.stringify(history));
}
function anchorFreeze(kind, d){
  const wd = dowKey(d);
  if (kind === 'workout') return wd === 'Sun';
  if (kind === 'wake') return wd === 'Sat' || wd === 'Sun';
  return false;
}
function anchorDone(kind, e){
  if (!e) return false;
  return kind==='workout' ? !!e.w : kind==='wake' ? !!e.k : !!e.b;
}
function currentStreak(kind){
  let streak=0, first=true;
  let d=new Date(now); d.setHours(0,0,0,0);
  for (let i=0;i<400;i++){
    if (anchorFreeze(kind,d)){ d.setDate(d.getDate()-1); first=false; continue; }
    if (anchorDone(kind, history[ymd(d)])){ streak++; d.setDate(d.getDate()-1); first=false; continue; }
    if (first){ d.setDate(d.getDate()-1); first=false; continue; }
    break;
  }
  return streak;
}
function bestStreak(kind){
  const keys = Object.keys(history); if (!keys.length) return 0;
  keys.sort();
  let d = ymdToDate(keys[0]);
  const end = new Date(now); end.setHours(0,0,0,0);
  let best=0, run=0;
  while (d <= end){
    if (anchorFreeze(kind,d)){ /* freeze */ }
    else if (anchorDone(kind, history[ymd(d)])){ run++; if (run>best) best=run; }
    else run=0;
    d.setDate(d.getDate()+1);
  }
  return best;
}
function allTimeDone(){
  return Object.values(history).reduce((s,e)=>s+(e.dn||0),0);
}
function bestDayPct(){
  return Object.values(history).reduce((m,e)=>Math.max(m,e.p||0),0);
}
/* ================= what moves the needle =================
   Your history already records, per day, whether you worked out, woke at 5 and
   made bed-time. This just asks whether one predicts the next. */
function driverStats(){
  const keys = Object.keys(history).sort();
  const bed = { yes:0, yesW:0, no:0, noW:0 };
  const wake = { yes:0, yesW:0, no:0, noW:0 };
  keys.forEach(k=>{
    const d = ymdToDate(k);
    if (anchorFreeze('workout', d)) return;        /* Sunday is a rest day */
    const e = history[k];
    const prev = history[ymd(new Date(d.getTime() - 86400000))];
    const did = !!e.w;
    if (prev && !anchorFreeze('bed', d)){
      if (prev.b){ bed.yes++; if (did) bed.yesW++; } else { bed.no++; if (did) bed.noW++; }
    }
    if (!anchorFreeze('wake', d)){
      if (e.k){ wake.yes++; if (did) wake.yesW++; } else { wake.no++; if (did) wake.noW++; }
    }
  });
  const pct = (n,d)=> d ? Math.round(100*n/d) : null;
  return {
    bed: { onTime:{ n:bed.yes, pct:pct(bed.yesW,bed.yes) },
           late:  { n:bed.no,  pct:pct(bed.noW,bed.no) } },
    wake:{ onTime:{ n:wake.yes, pct:pct(wake.yesW,wake.yes) },
           late:  { n:wake.no,  pct:pct(wake.noW,wake.no) } }
  };
}
/* ================= last week, on Sunday =================
   Sunday is the planning block, so surface the week just gone before she
   plans the next one. */
function lastWeekReview(){
  const prevStart = new Date(weekStart); prevStart.setDate(prevStart.getDate()-7);
  const days = [];
  for (let i=0;i<7;i++){ const d=new Date(prevStart); d.setDate(d.getDate()+i); days.push(d); }
  const ents = days.map(d=>history[ymd(d)]).filter(Boolean);
  if (!ents.length) return null;
  const pct = Math.round(ents.reduce((s,e)=>s+(e.p||0),0) / ents.length);
  const workouts = days.filter(d=>!anchorFreeze('workout',d) && history[ymd(d)] && history[ymd(d)].w).length;
  const workoutDays = days.filter(d=>!anchorFreeze('workout',d)).length;
  const wakes = days.filter(d=>!anchorFreeze('wake',d) && history[ymd(d)] && history[ymd(d)].k).length;
  const wakeDays = days.filter(d=>!anchorFreeze('wake',d)).length;
  const miles = milesForWeek(prevStart);
  let wDelta = null;
  const es = weightEntries();
  if (es.length){
    const from = ymd(prevStart), to = ymd(days[6]);
    const inWk = es.filter(e=>e.d >= from && e.d <= to);
    if (inWk.length >= 2) wDelta = inWk[inWk.length-1].w - inWk[0].w;
  }
  return { pct, workouts, workoutDays, wakes, wakeDays, miles, wDelta,
           label: prevStart.toLocaleDateString('en-US',{month:'short',day:'numeric'}) };
}

function weeksTracked(){

/* press-and-hold helper */
function attachLongPress(el, cb){
  let timer=null;
  const start = ()=>{ timer=setTimeout(()=>{ timer=null; cb(); }, 500); };
  const cancel = ()=>{ if (timer){ clearTimeout(timer); timer=null; } };
  el.addEventListener('touchstart', start, {passive:true});
  el.addEventListener('touchmove', cancel, {passive:true});
  el.addEventListener('touchend', cancel);
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', cancel);
  el.addEventListener('mouseleave', cancel);
  el.oncontextmenu = (e)=>{ e.preventDefault(); };
}

    top.appendChild(del);
    row.appendChild(top);

    const ctl = document.createElement('div'); ctl.className='sctl';
    const cs = document.createElement('select'); cs.className='cadsel';
    cs.title = 'How often this repeats';
    CADENCES.forEach(([val,label])=>{ const o=document.createElement('option');
      o.value=val; o.textContent=label; if (val===t.cad) o.selected=true; cs.appendChild(o); });
    cs.onchange = ()=>{
      const to = cs.value;
      changeCadence(t, to);
      if (sp && sp.day && to !== 'daily' && to !== 'once'){ t.day = sp.day; saveTasks(); render(); }
    };
    ctl.appendChild(cs);

    if (t.cad !== 'daily' && t.cad !== 'once'){
      const ds = document.createElement('select');
      ds.title = (sp && sp.day) ? 'Defaults to ' + DAY_FULL[sp.day] + ' — change only if this one differs'
                                : 'The day this task runs';
      DAYS.forEach(dn=>{ const o=document.createElement('option'); o.textContent=dn;
        if (dn===t.day) o.selected=true; ds.appendChild(o); });
      if (sp && sp.day && t.day !== sp.day) ds.className = 'offday';
      ds.onchange = ()=>{ t.day = ds.value; saveTasks(); render(); };
      ctl.appendChild(ds);
    }
    if (t.cad==='monthly'||t.cad==='quarterly'||t.cad==='annual'){
      const ws = document.createElement('select');
      for (let w=1;w<=4;w++){ const o=document.createElement('option'); o.value=w; o.textContent='Wk '+w;
        if (w===t.week) o.selected=true; ws.appendChild(o); }
      ws.onchange = ()=>{ t.week = +ws.value; saveTasks(); render(); };
      ctl.appendChild(ws);
    }
    if (t.cad==='annual'){
      const ms = document.createElement('select');
      MONTH_NAMES.forEach((mn,mi)=>{ const o=document.createElement('option'); o.value=mi; o.textContent=mn;
        if (mi===t.month) o.selected=true; ms.appendChild(o); });
      ms.onchange = ()=>{ t.month = +ms.value; saveTasks(); render(); };
      ctl.appendChild(ms);
    }
    if (t.cad==='once'){
      const dt = document.createElement('input'); dt.type='date'; dt.value = t.date||'';
      dt.onchange = ()=>{ t.date = dt.value; saveTasks(); render(); };
      ctl.appendChild(dt);
    }
    row.appendChild(ctl);
    return row;
  }

  function spaceCard(sp){
    const list = tasksInSpace(sp.name).slice().sort((a,b)=>{
      const c = (cadRank[a.cad]||9) - (cadRank[b.cad]||9);
      if (c !== 0) return c;
      if (a.cad === 'annual' && a.month !== b.month) return (a.month||0)-(b.month||0);
      if (a.week !== b.week && a.week != null && b.week != null) return (a.week||0)-(b.week||0);
      if (di(a) !== di(b)) return di(a) - di(b);
      return a.label.localeCompare(b.label);
    });
    const offDay = sp.day ? list.filter(t=>t.day && t.day !== sp.day &&
      t.cad !== 'daily' && t.cad !== 'once').length : 0;

    const sec = document.createElement('section'); sec.className='sched spacecard';
    const head = document.createElement('div'); head.className='sphead';

    const nm = document.createElement('span'); nm.className='spname';
    nm.textContent = sp.name; nm.title = 'Long-press to rename this space';
    attachLongPress(nm, ()=>{
      const v = prompt('Rename this space:', sp.name);
      if (v === null || !v.trim()) return;
      const other = spaceByName(v.trim());
      if (other && other.id !== sp.id){ alert('You already have a space called ' + v.trim() + '.'); return; }
      renameSpace(sp, v.trim());
    });

    /* A space with no fixed day gets a plain label instead of a day picker —
       its tasks are spread across the week and each keeps its own day. */
    let dsel;
    if (sp.day){
      dsel = document.createElement('select'); dsel.className='spday';
      dsel.title = 'The day this space gets done';
      DAYS.forEach(dn=>{ const o=document.createElement('option'); o.value=dn;
        o.textContent=DAY_FULL[dn]; if (dn===sp.day) o.selected=true; dsel.appendChild(o); });
      const none = document.createElement('option');
      none.value=''; none.textContent='No fixed day'; dsel.appendChild(none);
      dsel.onchange = ()=> setSpaceDay(sp, dsel.value);
    } else {
      dsel = document.createElement('button'); dsel.className='spnoday';
      dsel.textContent = 'various days';
      dsel.title = 'Tasks here keep their own days — tap to give the whole space one day';
      dsel.onclick = ()=>{
        const v = prompt('Give ' + sp.name + ' a single day?\n\n' +
          'Type Sun, Mon, Tue, Wed, Thu, Fri or Sat — or leave blank to keep various days.');
        if (v === null || !v.trim()) return;
        const want = v.trim().slice(0,3);
        const match = DAYS.filter(d=>d.toLowerCase() === want.toLowerCase())[0];
        if (!match){ alert('Didn’t recognise that day.'); return; }
        setSpaceDay(sp, match);
      };
    }

    const cnt = document.createElement('span'); cnt.className='spcount';
    cnt.textContent = list.length + (list.length===1?' task':' tasks');

    const rm = document.createElement('button'); rm.className='del'; rm.textContent='×';
    rm.title = 'Delete this space';
    rm.onclick = ()=>{
      const msg = list.length
        ? 'Delete the ' + sp.name + ' space and its ' + list.length + ' task' + (list.length===1?'':'s') + '?'
        : 'Delete the ' + sp.name + ' space?';
      if (!confirm(msg)) return;
      tasks = tasks.filter(t=>t.bucket !== sp.name);
      spaces = spaces.filter(s=>s.id !== sp.id);
      saveSpaces(); saveTasks(); render();
    };

    head.appendChild(nm); head.appendChild(dsel); head.appendChild(cnt); head.appendChild(rm);
    sec.appendChild(head);

    if (offDay){
      const w = document.createElement('div'); w.className='spwarn';
      w.textContent = offDay + (offDay===1?' task sits':' tasks sit') + ' on a different day to this space.';
      sec.appendChild(w);
    }

    if (!list.length){
      const e = document.createElement('div'); e.className='empty';
      e.textContent = 'No tasks in here yet.'; sec.appendChild(e);
    }
    list.forEach(t=> sec.appendChild(buildTaskRow(t, sp)));

    /* inline add — inherits the space's day, which is the whole point */
    const ar = document.createElement('div'); ar.className='sptaskadd';
    const ti = document.createElement('input'); ti.type='text'; ti.className='mealin';
    ti.placeholder = 'Add a task to ' + sp.name;
    const ab = document.createElement('button'); ab.className='wbtn'; ab.textContent='Add';
    function addTask(){
      const v = ti.value.trim(); if (!v) return;
      tasks.push({ id:'u'+Date.now()+Math.random().toString(36).slice(2,5),
        label:v, cad:'weekly', bucket:sp.name,
        day: sp.day || DAYS[now.getDay()] });   /* dayless space: start on today, editable per task */
      saveTasks(); ti.value=''; burstAt(ab,false); render();
    }
    ab.onclick = addTask;
    ti.onkeydown = e=>{ if (e.key === 'Enter') addTask(); };
    ar.appendChild(ti); ar.appendChild(ab);
    sec.appendChild(ar);
    return sec;
  }

  spaces.forEach(sp=> wrap.appendChild(spaceCard(sp)));

  /* ---------- anything whose space no longer exists ---------- */
  const strays = orphanTasks();
  if (strays.length){
    const sec = document.createElement('section'); sec.className='sched';
    const h = document.createElement('h2');
    h.innerHTML = 'Not in a space<span class="hint">move them somewhere</span>';
    sec.appendChild(h);
    strays.forEach(t=> sec.appendChild(buildTaskRow(t, null)));
    wrap.appendChild(sec);
  }

  /* ---------- tidy up expired one-offs ---------- */
  const today = ymd(new Date(now));
  const past = tasks.filter(t=>t.cad==='once' && t.date && t.date < today);
  if (past.length){
    const cp = document.createElement('button'); cp.className='wbtn';
    cp.style.cssText = 'width:100%;margin:4px 0 10px;';
    cp.textContent = 'Clear ' + past.length + ' past one-time task' + (past.length===1?'':'s');
    cp.onclick = ()=>{
      if (!confirm('Remove ' + past.length + ' one-time task' +
        (past.length===1?'':'s') + ' whose date has already passed?')) return;
      const ids = past.map(t=>t.id);
      tasks = tasks.filter(t=>ids.indexOf(t.id) === -1);
      saveTasks(); render();
    };
    wrap.appendChild(cp);
  }
}

function planSwap(store, lsKey, a, b){
  const t = store[a]||''; store[a] = store[b]||''; store[b] = t;
  localStorage.setItem(lsKey, JSON.stringify(store));
}
function planSection(title, store, lsKey, ph, showMiles){

  sec.innerHTML = '<h3>'+title+'</h3>';

    dw.title='Move down'; dw.setAttribute('aria-label','Move down');

      mi.value = walkPlan[dn] || '';
      mi.oninput = ()=>{ if (mi.value==='') delete walkPlan[dn]; else walkPlan[dn]=mi.value; saveWalkPlan(); };
      const munit = document.createElement('span'); munit.className='mlbl'; munit.textContent='mi';
      mr.appendChild(mlbl); mr.appendChild(mi); mr.appendChild(munit);

  return sec;

/* ================= trend insights ================= */
function recentFoodStats(days){
  let calSum=0, proSum=0, n=0;
  for (let i=0;i<days;i++){
    const d = new Date(now); d.setDate(d.getDate()-i);
    const log = food[ymd(d)];
    if (log && log.length){
      calSum += log.reduce((s,e)=>s+(+e.c||0),0);
      proSum += log.reduce((s,e)=>s+(+e.p||0),0);
      n++;
    }
  }
  return { avgCal: n?Math.round(calSum/n):0, avgPro: n?Math.round(proSum/n):0, daysLogged:n };
}
function weekWorkoutStats(){
  let elapsed=0, done=0;
  const today0 = new Date(now); today0.setHours(0,0,0,0);
  DAYS.forEach((dn,idx)=>{
    if (dn === 'Sun') return;
    const d = new Date(weekStart); d.setDate(d.getDate()+idx); d.setHours(0,0,0,0);
    if (d > today0) return;
    elapsed++;
    const e = history[ymd(d)];
    if (e && e.w) done++;
  });
  return { elapsed, done };
}
/* miles for the 7 days starting at a given week-start */
function milesForWeek(startDate){
  let total = 0;
  for (let i=0;i<7;i++){
    const d = new Date(startDate); d.setDate(d.getDate()+i);
    const v = parseFloat(milesLog[ymd(d)]);
    if (v > 0) total += v;
  }
  return total;
}
function weekWalkMiles(){ return milesForWeek(weekStart); }
function lastWeekWalkMiles(){
  const m = new Date(weekStart); m.setDate(m.getDate()-7);
  return milesForWeek(m);
}
function renderInsights(){
  const card = document.createElement('section'); card.className='pcard';
  card.innerHTML = '<h3>How you’re trending</h3>';
  const f = recentFoodStats(7);
  const wk = weekWorkoutStats();
  const miles = weekWalkMiles();
  const wt = weightTrend();

  if (!f.daysLogged && !wk.done && !miles && !wt){
    const em = document.createElement('div'); em.className='exnote';
    em.textContent = 'Log a few meals on the Food tab and check off workouts this week, and this card will start telling you what to adjust.';
    card.appendChild(em);
    return card;
  }

  const lines = [];

  /* Weight is the actual result, so it leads — and it's what decides whether
     the intake/activity numbers below need changing at all. */
  if (wt && wt.rate !== null){
    const r = wt.rate, dropping = r < 0, mag = Math.abs(r);
    if (mag < 0.3){
      lines.push('Weight’s held about steady the last two weeks' +
        (mag >= 0.05 ? ' (' + fmtDelta(r) + ' lb/wk)' : '') +
        '. If you want the scale moving again, the lever with the least downside is activity — add a mile or two of walking pad — before cutting food further.');
    } else if (dropping && mag <= 2){
      lines.push('Down about ' + mag.toFixed(1) + ' lb/wk over the last two weeks. That’s a sustainable pace — nothing needs changing, just keep the current pattern.');
    } else if (dropping){
      lines.push('Down about ' + mag.toFixed(1) + ' lb/wk, which is faster than the usual 1–2 lb guideline. If you’re feeling drained or your workouts are suffering, eating a bit more — nearer the top of your range — usually holds the trend without the crash.');
    } else {
      lines.push('Up about ' + mag.toFixed(1) + ' lb/wk over the last two weeks. Worth a look at portions and how consistently you’re logging before changing anything bigger — a couple of unlogged days can hide a lot.');
    }
    if (f.daysLogged && f.avgCal >= CAL_MIN && f.avgCal <= CAL_MAX && Math.abs(r) < 0.3){
      lines.push('Your intake is inside target and the scale is flat, so the gap is likely activity or unlogged bites rather than your calorie ceiling.');
    }
  } else if (wt){
    lines.push('You’ve logged ' + wt.count + ' weigh-in' + (wt.count===1?'':'s') +
      '. Once there are about two weeks in, this card can tell you whether your intake and activity are actually producing the trend you want.');
  }
  if (f.daysLogged){
    const dayWord = f.daysLogged===1 ? 'day' : 'days';
    if (f.avgCal > CAL_MAX){
      lines.push('Averaging ~'+f.avgCal.toLocaleString()+' cal over the last '+f.daysLogged+' logged '+dayWord+' — about '+(f.avgCal-CAL_MAX)+' over your ceiling. Trim a bit at dinner or cut one snack.');
    } else if (f.avgCal < CAL_MIN){
      lines.push('Averaging ~'+f.avgCal.toLocaleString()+' cal over the last '+f.daysLogged+' logged '+dayWord+' — under your '+CAL_MIN+' floor. Add a bit more, especially protein-dense food, so you’re not under-fueling.');
    } else {
      lines.push('Averaging ~'+f.avgCal.toLocaleString()+' cal over the last '+f.daysLogged+' logged '+dayWord+' — right in your '+CAL_MIN+'–'+CAL_MAX+' range. Keep doing what you’re doing.');
    }
    if (f.avgPro < PRO_FLOOR){
      lines.push('Protein’s averaging ~'+f.avgPro+'g, about '+(PRO_FLOOR-f.avgPro)+'g short of your '+PRO_FLOOR+'g floor — work in one more protein source most days (shake, eggs, Greek yogurt).');
    } else {
      lines.push('Protein’s on target at ~'+f.avgPro+'g/day. Nice.');
    }
  }
  if (wk.elapsed){
    lines.push(wk.done+' of '+wk.elapsed+' workout days done this week — '+
      (wk.done/wk.elapsed < 0.7 ? 'squeeze in one more before Sunday.' : 'strong, keep going.'));
  }
  if (miles > 0){
    const lastWk = lastWeekWalkMiles();
    let cmp = '';
    if (lastWk > 0){
      const diff = miles - lastWk;
      cmp = Math.abs(diff) < 0.5
        ? ' About the same as last week.'
        : (diff > 0 ? ' Up ' : ' Down ') + Math.abs(diff).toFixed(1) + ' mi from last week.';
    }
    lines.push('Logged '+miles.toFixed(1)+' mi on the walking pad this week (~'+Math.round(miles*stepsPerMile).toLocaleString()+' steps).'+cmp+
      (miles < 5 ? ' Try to bump this up a bit.' : ' Solid volume.'));
  }
  lines.forEach(t=>{
    const row = document.createElement('div'); row.className='brow';
    row.innerHTML = '<span>'+t+'</span>';
    card.appendChild(row);
  });
  return card;
}

  const rate = (recent !== null && prior !== null) ? (recent - prior) : null;
  const spanDays = Math.round((ymdToDate(latest.d) - ymdToDate(first.d))/86400000);
  const overallRate = spanDays >= 7 ? (latest.w - first.w)/(spanDays/7) : null;

function estimateLocal(text){

function unitMacros(e){
  const q = (+e.q > 0) ? +e.q : 1;

  const pu = (e.pu !== undefined && e.pu !== null) ? +e.pu : (+e.p || 0) / q;

function parseQty(s){
  if (s === null || s === undefined) return null;
  s = String(s).trim();
  if (!s) return 1;
  let m = s.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if (m){ const d = +m[3]; if (!d) return null; return +m[1] + (+m[2]) / d; }
  m = s.match(/^(\d*\.?\d*)\s*\/\s*(\d*\.?\d+)$/);
  if (m && m[1] !== ''){ const d = parseFloat(m[2]); if (!d) return null; return parseFloat(m[1]) / d; }
